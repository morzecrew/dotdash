# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-secrets.json
# One device's subscription URL, and the password devices on the network
# give. mihomo's distroless image runs as 65532.
api_version: selfhost/v1alpha1

secrets:
  - name: subscription_url
    description: The device's subscription URL, as dotdash's client-config prints it with subscriptions on
    required: true
    owner: "65532:65532"
    services: [mihomo]

  # Always generated, so a listen beyond 127.0.0.1 never runs without it.
  - name: proxy_password
    description: The password devices give, with proxy_user, when listen is not 127.0.0.1
    required: true
    generator: {kind: password, length: 32}
    owner: "65532:65532"
    services: [mihomo]
