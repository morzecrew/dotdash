# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-secrets.json
# One device's subscription URL, the rules, and the password devices on the
# network give. mihomo's distroless image runs as 65532.
api_version: selfhost/v1alpha1

secrets:
  - name: subscription_url
    description: The device's subscription URL, as dotdash's client-config prints it with subscriptions on
    required: true
    owner: "65532:65532"
    services: [mihomo]

  # The rules are mihomo's classical rules without the target, one per line,
  # "DOMAIN-SUFFIX,example.com" or "IP-CIDR,192.168.0.0/16,no-resolve";
  # "#" starts a comment. Generated as a comment line, a placeholder that
  # matches nothing, because morzer renders no file for an unset optional
  # secret (morzer#318) and mihomo needs the file. The alphabet is "#" twice:
  # morzer wants at least two characters, and counts them, not distinct ones.
  - name: block_rules
    description: Destinations refused, one mihomo classical rule per line without the target; a placeholder until set
    required: true
    generator: {kind: password, length: 32, alphabet: "##"}
    owner: "65532:65532"
    services: [mihomo]

  - name: direct_rules
    description: Destinations reached directly, not through dotdash, one mihomo classical rule per line without the target; a placeholder until set
    required: true
    generator: {kind: password, length: 32, alphabet: "##"}
    owner: "65532:65532"
    services: [mihomo]

  # Always generated, so a listen beyond 127.0.0.1 never runs without it.
  - name: proxy_password
    description: The password devices give, with proxy_user, when listen is not 127.0.0.1
    required: true
    generator: {kind: password, length: 32}
    owner: "65532:65532"
    services: [mihomo]
