[project]
name = "dotdash-manager"
# Released from dotdash's own tags: install it at the tag your machines run.
version = "0.0.0"
description = "A dotdash network from one roster, through morzer's desired state"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=45",
    "pydantic>=2.11",
    "typer>=0.16",
]

[project.scripts]
dotdash-manager = "dotdash_manager.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
