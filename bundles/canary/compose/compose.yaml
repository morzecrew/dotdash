# dotdash-canary. Each service is an Xray client of one dotdash path, with a
# loopback HTTP inbound only the image's probe uses: hooks/healthy runs it, and
# it passes when a request went out through dotdash and came back.
#
# Compose sees only what morzer gives it: DOTDASH_CANARY_IMAGE_*,
# DOTDASH_CANARY_PARAM_*, DOTDASH_CANARY_SECRETS_DIR.

x-client: &client
  image: ${DOTDASH_CANARY_IMAGE_XRAY:?set by morzer}
  restart: unless-stopped
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  mem_limit: 128m
  logging:
    driver: local
    options: {max-size: 10m, max-file: "3"}
  environment:
    XRAY_HEALTHCHECK_PROXY: http://127.0.0.1:10809
    XRAY_HEALTHCHECK_URL: ${DOTDASH_CANARY_PARAM_PROBE_URL:-https://www.gstatic.com/generate_204}
    XRAY_HEALTHCHECK_TIMEOUT: 7s
    # Go's soft memory limit at about 90% of mem_limit: Go collects garbage harder
    # near it rather than let the kernel kill Xray at the cap (dotdash-lab #49).
    GOMEMLIMIT: 115MiB
  tmpfs:
    - /run/xray:uid=65532,gid=65532,mode=0700,size=1m
  # No healthcheck here: hooks/healthy runs the probe itself (see there).

services:
  reality:
    <<: *client
    volumes:
      # Long form, so a missing file fails the start rather than becoming a
      # directory morzer cannot render over.
      - type: bind
        source: /etc/dotdash-canary/reality.json
        target: /etc/xray/config.json
        read_only: true
        bind: {create_host_path: false}
    # dotdash_cdn_xhttp_path for the CDN checks, empty while they are off.
    secrets: [dotdash_id, dotdash_encryption, dotdash_short_id, dotdash_cdn_xhttp_path]

  # One-shot behind a profile, started only by `morzer task run measure`. On
  # the project's network it reaches each transport's probe inbound, which is
  # why those listen beyond loopback; nothing outside the project can.
  measure:
    image: ${DOTDASH_CANARY_IMAGE_BUSYBOX:?set by morzer}
    restart: "no"
    profiles: [tasks]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    environment:
      PROBE_URL: ${DOTDASH_CANARY_PARAM_PROBE_URL:-https://www.gstatic.com/generate_204}
      DOWNLOAD_URL: ${DOTDASH_CANARY_PARAM_DOWNLOAD_URL:-https://speed.cloudflare.com/__down?bytes=1000000}
      # The facts task's: what it watches, and its check without dotdash.
      DOTDASH_SERVER: ${DOTDASH_CANARY_PARAM_DOTDASH_SERVER:?set by morzer}
      DOTDASH_ADDRESS: ${DOTDASH_CANARY_PARAM_DOTDASH_ADDRESS:?set by morzer}
      # Its REALITY port, for facts' blocked_by: whether the canary's own
      # network still connects to it at all.
      DOTDASH_PORT: ${DOTDASH_CANARY_PARAM_DOTDASH_PORT:-443}
      # An IPv6-only address facts fetches through each transport; none for none.
      IPV6_URL: ${DOTDASH_CANARY_PARAM_IPV6_URL:-none}
      # The key the canary checks the server under, in its facts, so the
      # manager knows a rotated key got through before devices move to it.
      DOTDASH_PUBLIC_KEY: ${DOTDASH_CANARY_PARAM_DOTDASH_PUBLIC_KEY:-}
      CONTROL_URL: ${DOTDASH_CANARY_PARAM_CONTROL_URL:-none}
      FREEZE_URL: ${DOTDASH_CANARY_PARAM_FREEZE_URL:-https://speed.cloudflare.com/__down?bytes=65536}
      FREEZE_UP_URL: ${DOTDASH_CANARY_PARAM_FREEZE_UP_URL:-https://speed.cloudflare.com/__up}
      BURST_CHECK: ${DOTDASH_CANARY_PARAM_BURST_CHECK:-true}
      # The CDNs in front of a relay, which facts checks through the reality
      # service's inbounds for them (templates/reality.json.tmpl).
      DOTDASH_CDN_HOSTS: ${DOTDASH_CANARY_PARAM_DOTDASH_CDN_HOSTS:-none}
      DOTDASH_ORIGIN_HOST: ${DOTDASH_CANARY_PARAM_DOTDASH_ORIGIN_HOST:-none}
    volumes:
      - ${DOTDASH_CANARY_RELEASE_DIR:?set by morzer}/tasks:/task:ro
      - type: image
        source: ${DOTDASH_CANARY_IMAGE_XRAY:?set by morzer}
        target: /opt/xray
        image:
          subpath: usr/local/bin
      # busybox has no CA certificates; the healthcheck needs them for https.
      - type: image
        source: ${DOTDASH_CANARY_IMAGE_XRAY:?set by morzer}
        target: /etc/ssl/certs
        image:
          subpath: etc/ssl/certs

secrets:
  dotdash_id: {file: "${DOTDASH_CANARY_SECRETS_DIR:?set by morzer}/dotdash_id"}
  dotdash_encryption: {file: "${DOTDASH_CANARY_SECRETS_DIR:?set by morzer}/dotdash_encryption"}
  dotdash_short_id: {file: "${DOTDASH_CANARY_SECRETS_DIR:?set by morzer}/dotdash_short_id"}
  dotdash_xhttp_path: {file: "${DOTDASH_CANARY_SECRETS_DIR:?set by morzer}/dotdash_xhttp_path"}
  dotdash_kcp_seed: {file: "${DOTDASH_CANARY_SECRETS_DIR:?set by morzer}/dotdash_kcp_seed"}
  dotdash_cdn_xhttp_path: {file: "${DOTDASH_CANARY_SECRETS_DIR:?set by morzer}/dotdash_cdn_xhttp_path"}
