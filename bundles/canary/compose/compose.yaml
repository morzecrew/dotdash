# dotdash-canary. Each service is an Xray client of one dotdash path, with a
# loopback HTTP inbound only the image's probe uses: hooks/healthy runs it, and
# it passes when a request went out through dotdash and came back.
#
# Compose sees only what morzer gives it: DOTDASH_CANARY_IMAGE_*,
# DOTDASH_CANARY_PARAM_*, DOTDASH_CANARY_SECRETS_DIR.

x-client: &client
  image: ${DOTDASH_CANARY_IMAGE_XRAY:?set by morzer}
  restart: unless-stopped
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  mem_limit: 128m
  logging:
    driver: local
    options: {max-size: 10m, max-file: "3"}
  environment:
    XRAY_HEALTHCHECK_PROXY: http://127.0.0.1:10809
    XRAY_HEALTHCHECK_URL: ${DOTDASH_CANARY_PARAM_PROBE_URL:-https://www.gstatic.com/generate_204}
    XRAY_HEALTHCHECK_TIMEOUT: 7s
  tmpfs:
    - /run/xray:uid=65532,gid=65532,mode=0700,size=1m
  # No healthcheck here: hooks/healthy runs the probe itself (see there).

services:
  reality:
    <<: *client
    volumes:
      # Long form, so a missing file fails the start rather than becoming a
      # directory morzer cannot render over.
      - type: bind
        source: /etc/dotdash-canary/reality.json
        target: /etc/xray/config.json
        read_only: true
        bind: {create_host_path: false}
    secrets: [vless_id, vless_encryption, reality_short_id]

  # One-shot behind a profile, started only by `morzer task run measure`. On
  # the project's network it reaches each transport's probe inbound, which is
  # why those listen beyond loopback; nothing outside the project can.
  measure:
    image: ${DOTDASH_CANARY_IMAGE_BUSYBOX:?set by morzer}
    restart: "no"
    profiles: [tasks]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    environment:
      PROBE_URL: ${DOTDASH_CANARY_PARAM_PROBE_URL:-https://www.gstatic.com/generate_204}
      DOWNLOAD_URL: ${DOTDASH_CANARY_PARAM_DOWNLOAD_URL:-https://speed.cloudflare.com/__down?bytes=1000000}
    volumes:
      - ${DOTDASH_CANARY_RELEASE_DIR:?set by morzer}/tasks:/task:ro
      - type: image
        source: ${DOTDASH_CANARY_IMAGE_XRAY:?set by morzer}
        target: /opt/xray
        image:
          subpath: usr/local/bin
      # busybox has no CA certificates; the healthcheck needs them for https.
      - type: image
        source: ${DOTDASH_CANARY_IMAGE_XRAY:?set by morzer}
        target: /etc/ssl/certs
        image:
          subpath: etc/ssl/certs

secrets:
  vless_id: {file: "${DOTDASH_CANARY_SECRETS_DIR:?set by morzer}/vless_id"}
  vless_encryption: {file: "${DOTDASH_CANARY_SECRETS_DIR:?set by morzer}/vless_encryption"}
  reality_short_id: {file: "${DOTDASH_CANARY_SECRETS_DIR:?set by morzer}/reality_short_id"}
  xhttp_path: {file: "${DOTDASH_CANARY_SECRETS_DIR:?set by morzer}/xhttp_path"}
  kcp_seed: {file: "${DOTDASH_CANARY_SECRETS_DIR:?set by morzer}/kcp_seed"}
