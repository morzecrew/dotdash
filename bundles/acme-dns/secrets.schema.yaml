# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-secrets.json
# Nothing reads this secret. It is here because morzer creates the encrypted
# state, which lists who backups are encrypted for, only for a release that
# declares a secret or an init given a recovery recipient: without it, a
# machine set up with --no-recovery-recipient could never back up its
# registrations, and every update would fail at the pre-update backup.
# ponytail: drop it once morzer#363 gives every installation its own key.
api_version: selfhost/v1alpha1

secrets:
  - name: state_anchor
    description: Random, read by nothing; it makes init create the encrypted state backups need (morzer#363)
    required: true
    generator: {kind: hex, length: 32}
    services: []
