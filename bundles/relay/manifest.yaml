# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-manifest.json
api_version: selfhost/v1alpha1
kind: application-release

metadata:
  name: dotdash-relay
  # Stamped by `morzer release build --version X`, together with VERSION.
  version: 0.0.0
  description: A relay inside a network that lets only some addresses through, that carries devices on to a dotdash server
  vendor: morzecrew
  release_notes: RELEASE.md

providers:
  runtime: {name: compose}
  secrets: {name: sops-age}
  health: {name: http}

runtimes:
  compose:
    files:
      - compose/compose.yaml
    profiles:
      # A site of the relay's own, under its own domain, as REALITY's target,
      # instead of a borrowed one (site): see compose/own-site.yaml.
      own-site: [compose/own-site.yaml]
      # VLESS over mKCP on kcp_port, as the server's mkcp profile: UDP, its
      # packets encrypted under kcp_seed and dressed in kcp_header.
      mkcp: [compose/mkcp.yaml]
      # Hysteria2 on hysteria2_port (UDP), as the server's hysteria2 profile,
      # under the own site's certificate: it goes with own-site.
      hysteria2: [compose/hysteria2.yaml]
      # A plain-HTTP door on http_origin_port for a rented CDN that ends TLS at
      # its edge (http_origin_from, http_origin_host): it goes with own-site.
      http-origin: [compose/http-origin.yaml]
      # Traffic per inbound and outbound, and the verdicts on the servers,
      # into the node exporter's textfile directory.
      metrics: [compose/metrics.yaml]
      # The bytes each device moves, in the facts the manager reads hourly,
      # which flags a device moving far more than usual: a leaked link.
      device-traffic: [compose/device-traffic.yaml]
    # installation.profile=own-site,mkcp runs both, own-site,hysteria2 adds
    # Hysteria2, own-site,http-origin the door; metrics goes with any.
    combinable: [own-site, mkcp, hysteria2, http-origin, metrics, device-traffic]
    options:
      project: dotdash-relay

configuration:
  - template: templates/xray.json.tmpl
    target: /etc/dotdash-relay/xray.json
    mode: "0644"
  # The servers the own-site profile's Caddy fetches subscriptions from.
  - template: templates/caddy.env.tmpl
    target: /etc/dotdash-relay/caddy.env
    mode: "0644"

secrets:
  source: /etc/dotdash-relay/secrets.sops.yaml
  render_to: /run/dotdash-relay/secrets
  schema: secrets.schema.yaml

compatibility:
  # The manager this bundle is verified and rehearsed with, and the first that
  # checks requirements.ports by address, protocol and profile, and lets
  # listen default to empty.
  min_manager_version: "0.18.0"
  rollback_safe: true
  # No database, which an unattended update needs declared.
  database: none

requirements:
  architectures: [amd64, arm64]
  tools:
    docker: ">=28.0.0"
    compose: ">=2.35.0"
  memory: 256MiB
  disk: 512MiB
  # Each on the address and protocol Compose publishes it on, and a profile's
  # only under that profile: an entry that renders empty requires nothing.
  # An empty listen is every address, as Compose reads it.
  ports:
    - "{{ .Parameters.listen }}:{{ .Parameters.https_port }}"
    - '{{ if has "own-site" .Profiles }}{{ .Parameters.listen }}:{{ .Parameters.http_port }}{{ end }}'
    - '{{ if has "mkcp" .Profiles }}{{ .Parameters.kcp_port }}/udp{{ end }}'
    - '{{ if has "hysteria2" .Profiles }}{{ .Parameters.hysteria2_port }}/udp{{ end }}'
    - '{{ if has "http-origin" .Profiles }}{{ .Parameters.listen }}:{{ .Parameters.http_origin_port }}{{ end }}'

# `morzer task run relay-config -- <client>` on the dotdash server prints the
# init command and the secrets for this machine.
parameters:
  # Required unless the own-site profile, whose site is the relay's own.
  site:
    type: string
    default: none
    description: "Without the own-site profile, a site next to this machine, in its own network, that speaks TLS 1.3 and HTTP/2: devices send its name, and anyone probing port 443 gets its real handshake. With it, unused: the relay's own domain is the site"
    services: [xray]
  tcp_congestion:
    type: enum
    values: [bbr, cubic]
    default: bbr
    description: "TCP congestion control toward devices, in Xray's own namespace: bbr keeps its pace through a lossy last mile; cubic for a kernel without tcp_bbr, where bbr fails the apply and morzer rolls it back"
    services: [xray]
  https_port:
    type: port
    default: 443
    description: "Host port of the REALITY inbound, published at listen. Devices always dial 443, so anything else is for a web server of your own on this machine that holds 443 and passes this relay's name through to it untouched"
    services: [xray]
  http_port:
    type: port
    default: 80
    description: "With the own-site profile, host port of Caddy's plain HTTP, published at listen: the ACME HTTP-01 check under cert_issuer=acme. Behind a web server of your own, a spare port it forwards the relay's domain's HTTP to"
    services: [caddy]
  listen:
    type: string
    default: ""
    description: "Host address https_port and http_port are published on: empty for every address, IPv4 and IPv6; 0.0.0.0 for every IPv4 address alone; 127.0.0.1 behind a web server of your own on this machine that holds 443 and passes this relay's name through untouched"
    services: [xray, caddy]
  kcp_port:
    type: port
    default: 8447
    description: "Host UDP port devices reach this relay's mKCP on (the mkcp profile)"
    services: [xray]
  kcp_header:
    type: enum
    values: [none, dtls, srtp, utp, wechat, wireguard]
    default: dtls
    description: "What mKCP's packets start with (the mkcp profile), as the server's kcp_header; relay-entry carries it to the server's relays line"
    services: [xray]
  kcp_open:
    type: enum
    values: [none, quic]
    default: none
    description: "An opener in front of mKCP (the mkcp profile), as the server's kcp_open: quic sends a QUIC-Initial-shaped packet before the flow; relay-entry carries it to the server's relays line, so devices' links through this relay match"
    services: [xray]
  hysteria2_port:
    type: port
    default: 443
    description: "Host UDP port devices reach this relay's Hysteria2 on (the hysteria2 profile, with own-site); relay-entry carries it to the server's relays line"
    services: [xray]
  http_origin_port:
    type: port
    default: 8880
    description: "Host TCP port of the http-origin profile's door, published at listen: the port a rented CDN that ends TLS at its edge is told to fetch this relay from, in plain HTTP"
    services: [caddy]
  http_origin_from:
    type: string
    default: none
    description: "With the http-origin profile, the addresses the door answers, comma-separated IPs or CIDR ranges: the rented CDN's gateways, as it lists them; any: every address, for a CDN whose edges ask the origin themselves and publish no list; none: nobody. Everyone else gets a 404"
    services: [caddy]
  http_origin_host:
    type: string
    default: none
    description: "With the http-origin profile, the name devices reach the rented CDN at for this relay, its name for the resource, or several, comma-separated, where the CDN gives more than one, each <name>/<path> where the CDN gives a path of its own that its gateway turns back into the CDN path; relay-entry carries them to the server's relays line as origin=, and devices get an XHTTP link through each"
  cover:
    type: string
    default: pages
    description: "With the own-site profile, what the site serves past your own files in /srv/dotdash-relay (readable by uid 65532): pages, the bundled page; or your app's URL, http://cover-app:8080 for a container on the network dotdash-relay_edge or http://host.docker.internal:8080 for one published on the host, which gets every request but a subscription's and XHTTP's"
    services: [caddy]
  tunnel_host:
    type: string
    default: none
    description: "With the own-site profile, one host a cover app on dotdash-relay_edge may call through the tunnel, at http://caddy:8090 with no TLS: Caddy sends it on as HTTPS inside the link to the dotdash servers, or to the relays in via, so this machine shows one TLS client, Xray's. For an app whose own calls go to a site on a relay this one goes through; none: no such way"
    services: [caddy]
  cert_issuer:
    type: enum
    values: [acme, acme-dns, internal]
    default: acme
    description: "With the own-site profile, where its certificate comes from: acme is Let's Encrypt, over port 80; internal is Caddy's own CA, for a machine the internet cannot reach; acme-dns is Let's Encrypt over DNS-01, handed to an acme-dns server by a CNAME, for a wildcard over the domain's parent that keeps the domain out of the certificate logs (the acme_dns secret)"
    services: [caddy]
  # No services: relay-entry and facts, tasks, are all that read it.
  entry_host:
    type: string
    default: none
    description: "The address devices reach this relay at, its IP without a domain, for relay-entry and facts; none takes the relay's domain under own-site"
  # No services: relay-entry and facts, tasks, are all that read it.
  cdn_hosts:
    type: string
    default: none
    description: "With the own-site profile, the names devices use for local CDNs in front of this relay, comma-separated, each fetching from https://<the relay's domain> with the Host header set to it; relay-entry carries them to the server's relays line, and devices get an XHTTP link through each. none for none"
  # No services: relay-entry and facts, tasks, are all that read it.
  cdn_only:
    type: bool
    default: false
    description: "Give devices only the links through this relay's cdn_hosts, so its own address reaches none of them and it can stay the CDNs' origin while relays devices reach directly get blocked; relay-entry carries it to the server's relays line as cdn-only"
  # No services: relay-entry and facts, tasks, are all that read it.
  name:
    type: string
    default: none
    description: "A label for this relay, up to 24 letters, digits, dots, dashes or underscores, that devices' links through it carry in place of relay <n>; relay-entry carries it to the server's relays line as name=. Every device's app shows it, so pick one that says nothing about where the relay is hosted. none for none"
  metrics_textfile:
    type: string
    default: /var/lib/prometheus/node-exporter
    description: "Under the metrics profile, the node exporter's textfile directory, the one morzer's metrics.textfile names, which the exporters write dotdash-dotdash-relay-xray.prom into; it has to exist and be writable by 65532 (sudo setfacl -m u:65532:rwx <it>)"
  dotdash_servers:
    type: string
    required: true
    description: "The dotdash servers sharing one set of keys (dotdash's servers), comma-separated domains, each sent as its TLS server name; with several, the relay uses whichever answers fastest"
    services: [xray]
  dotdash_address:
    type: string
    # morzer wants a default for every parameter it doesn't ask for at init.
    default: none
    description: Where to connect when dotdash_servers names one server, if not to its name, such as an IP; none reaches each server by its name
    services: [xray]
  dotdash_port:
    type: port
    default: 443
    description: The dotdash server's https_port
    services: [xray]
  dotdash_public_key:
    type: string
    description: The dotdash server's REALITY public key, the pbk of its REALITY links
    services: [xray]
  dotdash_link:
    type: enum
    values: [reality, xhttp-reality]
    default: reality
    description: "How this relay reaches the servers. reality: REALITY with Vision on dotdash_port, a connection for each device's. xhttp-reality: XHTTP with REALITY on dotdash_xhttp_reality_port, connections reused across devices, about 100 ms sooner to a page's first byte for about twice the CPU here and on the server; needs the servers' xhttp-reality profile and the dotdash_xhttp_path secret"
    services: [xray]
  dotdash_xhttp_reality_port:
    type: port
    default: 8443
    description: The dotdash server's xhttp_reality_port, for dotdash_link=xhttp-reality
    services: [xray]
  via:
    type: text
    # morzer wants a default for every parameter it doesn't ask for at init,
    # so a comment, which the template skips, that shows the line's form.
    default: "# Relays to go through instead of the servers, one per line, as its relay-entry task prints it: <host> <site> <public key> <short id> <encryption>"
    description: "Other dotdash relays this one goes through instead of the servers, one line per relay as its relay-entry task prints it, \"<host> <site> <public key> <short id> <encryption>\" (the rest of the line is ignored); with several, it uses whichever answers fastest. Each has to let this relay's dotdash_id in. The servers still serve subscriptions, through them. Empty, it goes to the servers"
    services: [xray]
  via_link:
    type: enum
    values: [reality, xhttp]
    default: reality
    description: "How this relay reaches the relays in via. reality: REALITY with Vision, a connection for each device's, as devices' reality links to a relay. xhttp: XHTTP through each relay's own site, under its certificate, connections reused across devices, as devices' xhttp links to a relay; each via line has to carry own-site <path>"
    services: [xray]
  via_fingerprint:
    type: enum
    values: [chrome, firefox, safari, edge, ios, android, random, none]
    default: chrome
    description: "The TLS client hello the xhttp via leg shows the relay it goes through (via_link=xhttp only; the reality leg and the servers' leg are unaffected). The browser values mimic that browser. none uses Xray's own Go TLS stack, which looks like a server-side HTTP client rather than a browser and so fits one datacenter machine fetching from another; random picks a browser per connection. chrome keeps the earlier behaviour"
    services: [xray]
  ipv6:
    type: enum
    values: [allow, block]
    default: allow
    description: "IPv6 destinations. allow: carried on to the dotdash servers like any other. block: dropped here, so they never reach a server; names still go on, for the server to resolve"
    services: [xray]
  probe_url:
    type: string
    default: https://www.gstatic.com/generate_204
    description: What the health check fetches through dotdash; any 2xx is healthy
    services: [xray]

images:
  # The metrics profile's exporter turns Xray's counters into the textfile
  # with it (metrics/metrics.jq), mounted into the Caddy image's shell.
  jq: ghcr.io/jqlang/jq:1.8.1@sha256:4f34c6d23f4b1372ac789752cc955dc67c2ae177eb1b5860b75cdc5091ce6f91
  # The relay-entry task's shell; Xray's image has none.
  busybox: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
  xray: ghcr.io/morzecrew/xray:26.11.9@sha256:c9cbe1fc19310f136c3dd19fd7316378e8ea2bb8c9b45d48e53fa2a1571ce48d
  # The own-site profile's site; dotdash's own. Upstream's Caddy with the
  # acme-dns DNS module, for cert_issuer=acme-dns.
  caddy: ghcr.io/morzecrew/caddy-acmedns:2.11.9@sha256:93c19f705c2218d5fca7f7dcb694cae1ed3889588678aabb7af34c8892e2f2bb

# What an authority's desired-state document may set here (morzer 0.16): the
# devices, this relay's own client of the servers, the servers' facts, and
# the relays it goes through (via), which the manager sets or unsets.
# This relay's own keys stay its own; its facts carry their public halves.
# None of these reaches a command line or a hook.
managed:
  parameters: [dotdash_servers, dotdash_address, dotdash_port, dotdash_public_key, dotdash_link, dotdash_xhttp_reality_port, ipv6, via, via_link, via_fingerprint]
  secrets: [vless_clients, dotdash_id, dotdash_encryption, dotdash_short_id, dotdash_xhttp_path]

# What this machine tells the authority it follows, after every change, when
# sync.recipient is set: the facts task's JSON.
published:
  task: facts
  # Run again before every fleet publish, hourly, so the device-traffic
  # profile's counts are an hour old at most; without it the facts are
  # the same each time and stay as they are. One task operation an hour
  # in the journal and the attestations (retention.attestations).
  refresh: publish

tasks:
  relay-entry:
    description: "Print this relay's line for the dotdash server's relays parameter, and how a dotdash-canary checks it; argument: the address devices reach this machine at, else entry_host"
    service: relay-entry
    command: ["sh", "/task/relay-entry.sh"]
    args: true
    timeout: 1m
  facts:
    description: "Print relay-entry's line as JSON for the authority this relay follows: entry_host, site, public key, the short id, XHTTP path and mKCP seed links carry (output is credentials), and the Hysteria2 port"
    service: relay-entry
    command: ["sh", "/task/facts.sh"]
    timeout: 1m
  entry-check:
    description: "Check each entry end to end as a device reaches it, and the http-origin door by its log of the last hour: a line each, with why it fails"
    service: entry-check
    command: ["sh", "/task/entry-check.sh"]
    timeout: 3m

health:
  checks:
    # Fetches probe_url through dotdash, up to three tries, so healthy means the
    # way on to dotdash works. Whether devices can reach this machine is not
    # something it can see: only a device on such a network can (a canary).
    - {name: through-dotdash, type: command, command: ["hooks/healthy"], timeout: 2m}
    # With the own-site profile, Caddy, the site probes meet, is healthy.
    - {name: cover-site, type: command, command: ["hooks/cover-site"], timeout: 10s}

retention:
  releases: 3
  backups: 3
