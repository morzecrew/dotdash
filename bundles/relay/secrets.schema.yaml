# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-secrets.json
# The relay's own REALITY and VLESS Encryption keys, generated here, and what
# dotdash's relay-config task prints: the devices it lets in, and the client
# it uses itself. Xray's distroless image runs as 65532.
api_version: selfhost/v1alpha1

secrets:
  - name: vless_clients
    description: The devices this relay lets in, one "<uuid> [name]" per line, as dotdash's relay-config task prints them
    required: true
    owner: "65532:65532"
    services: [xray]

  - name: vless_seed
    description: ML-KEM-768 seed (64 bytes, hex) this relay's VLESS Encryption key pair derives from
    required: true
    generator: {kind: hex, length: 128}
    owner: "65532:65532"
    services: [xray]

  - name: reality_key
    description: This relay's REALITY private key (x25519, base64url)
    required: true
    generator: {kind: password, length: 43, alphabet: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"}
    owner: "65532:65532"
    services: [xray]

  - name: reality_short_id
    description: This relay's REALITY short id
    required: true
    generator: {kind: hex, length: 16}
    owner: "65532:65532"
    services: [xray]

  # Under the own-site profile, the path the relay's site routes to Xray's
  # XHTTP inbound; anything else gets the site. Caddy restarts with it only
  # while the profile is on (morzer 0.15.1).
  - name: xhttp_path
    description: Secret URL path the own-site profile's Caddy routes to Xray's XHTTP inbound; everything else gets the site
    required: true
    generator: {kind: hex, length: 32}
    owner: "65532:65532"
    services: [xray, caddy]

  - name: dotdash_id
    description: The VLESS id this relay uses on the dotdash server, a line of its vless_clients
    required: true
    owner: "65532:65532"
    services: [xray]

  - name: dotdash_encryption
    description: The encryption= value of the dotdash server's links
    required: true
    owner: "65532:65532"
    services: [xray]

  - name: dotdash_short_id
    description: The sid= value of the dotdash server's REALITY links
    required: true
    owner: "65532:65532"
    services: [xray]

  # The relay's own, not the server's: mKCP ends here, and relay-entry carries
  # it to the server's relays line, from which devices' links take it.
  - name: kcp_seed
    description: Key this relay's mKCP packets are encrypted under (the mkcp profile)
    required: true
    generator: {kind: hex, length: 32}
    owner: "65532:65532"
    services: [xray]

  # cert_issuer=acme-dns: Caddy's registration with the acme-dns server that
  # answers the DNS-01 check, as its /register endpoint returns it, with the
  # server's URL added: {"username", "password", "subdomain", "server_url"}.
  # It can answer only the check at the name whose CNAME points at it. Unset,
  # it is an empty file, which nothing reads under another cert_issuer.
  - name: acme_dns
    description: 'With cert_issuer=acme-dns, the acme-dns registration, JSON: {"username", "password", "subdomain", "server_url"}'
    required: false
    owner: "65532:65532"
    services: [caddy]
