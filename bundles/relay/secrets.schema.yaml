# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-secrets.json
# The relay's own REALITY and VLESS Encryption keys and its nonce, generated
# here, and what each dotdash server group's relay-config task prints for it:
# its server/1 line, with the relay's id there. The devices are no secret
# here: the relay fetches each group's list through its own tunnel, and holds
# it in memory alone. Xray's distroless image runs as 65532.
api_version: selfhost/v1alpha1

secrets:
  # One server/1 line per server group this relay carries devices to, as
  # each group's relay-config -- <name> prints it: the group's name, its
  # servers, their port and keys, and this relay's id on them, its way into
  # that group's servers and exit, and to its device list. Unset, it is an
  # empty file: the relay is idle, and lets nobody in.
  - name: servers
    description: 'The server groups this relay carries devices to, one "server/1 <name> <host>[,<host>...] <port> <public key> <short id> <encryption> <relay id> [xr=<port>,<path>] [address=<ip>[,<ip>...]]" line each, as each group''s relay-config task prints it; empty: none, so the relay lets nobody in'
    required: false
    owner: "65532:65532"
    services: [xray]

  # Other relays this one goes through instead of the servers, one relay/1
  # line each, as that relay's relay-entry prints it. Unset, it is an empty
  # file: the relay goes to the servers.
  - name: via
    description: "Other dotdash relays this one goes through instead of the servers, one relay/1 line each, as that relay's relay-entry prints it; each server group lets this relay in through them by its id there. Empty: straight to the servers"
    required: false
    owner: "65532:65532"
    services: [xray]

  # Made once at init and kept: with the name, each server derives this
  # relay's id from it, so a new relay that takes a removed one's name gets
  # another id. relay-entry prints it in the relay/1 line.
  - name: nonce
    description: This relay's nonce, 16 hex characters, which its relay/1 line carries and each server derives the relay's id from, with its name
    required: true
    generator: {kind: hex, length: 16}
    owner: "65532:65532"

  - name: vless_seed
    description: ML-KEM-768 seed (64 bytes, hex) this relay's VLESS Encryption key pair derives from
    required: true
    generator: {kind: hex, length: 128}
    owner: "65532:65532"
    services: [xray]

  - name: reality_key
    description: This relay's REALITY private key (x25519, base64url)
    required: true
    generator: {kind: password, length: 43, alphabet: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"}
    owner: "65532:65532"
    services: [xray]

  - name: reality_short_id
    description: This relay's REALITY short id
    required: true
    generator: {kind: hex, length: 16}
    owner: "65532:65532"
    services: [xray]

  # Under the own-site profile, the path the relay's site routes to Xray's
  # XHTTP inbound; anything else gets the site. Caddy restarts with it only
  # while the profile is on (morzer 0.15.1).
  - name: xhttp_path
    description: Secret URL path the own-site profile's Caddy routes to Xray's XHTTP inbound; everything else gets the site
    required: true
    generator: {kind: hex, length: 32}
    owner: "65532:65532"
    services: [xray, caddy]

  # The path CDNs in front (cdn_hosts) fetch XHTTP by, to Xray's CDN inbound,
  # apart from xhttp_path: a CDN, which reads every request, never learns the
  # path devices reach the relay by directly. 24 hex characters, so it never
  # looks like a subscription's 32.
  - name: cdn_xhttp_path
    description: Secret URL path the own-site profile's Caddy routes to Xray's XHTTP inbound for CDNs in front (cdn_hosts)
    required: true
    generator: {kind: hex, length: 24}
    owner: "65532:65532"
    services: [xray, caddy]

  # The relay's own, not the server's: mKCP ends here, and relay-entry carries
  # it to the server's relays line, from which devices' links take it.
  - name: kcp_seed
    description: Key this relay's mKCP packets are encrypted under (the mkcp profile)
    required: true
    generator: {kind: hex, length: 32}
    owner: "65532:65532"
    services: [xray]

  # cert_issuer=acme-dns: Caddy's registration with the acme-dns server that
  # answers the DNS-01 check, as its /register endpoint returns it, with the
  # server's URL added: {"username", "password", "subdomain", "server_url"}.
  # It can answer only the check at the name whose CNAME points at it. Unset,
  # it is an empty file, which nothing reads under another cert_issuer.
  - name: acme_dns
    description: 'With cert_issuer=acme-dns, the acme-dns registration, JSON: {"username", "password", "subdomain", "server_url"}'
    required: false
    owner: "65532:65532"
    services: [caddy]
