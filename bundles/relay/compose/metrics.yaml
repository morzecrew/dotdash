# The metrics profile: the relay's traffic per inbound and outbound, its
# verdicts on the servers, and each server group's state from the gateway's
# status (dotdash_group_*), every minute into the node exporter's textfile
# directory (metrics_textfile), as dotdash-dotdash-relay-xray.prom. The
# exporter reaches Xray's metrics on a network of its own, internal, where
# Xray listens under a name it has there alone (xray-metrics), so nowhere
# else. Not in Xray's namespace: a namespace shared with a container goes when
# that one is recreated (morzer restart xray), and the next restart of it then
# fails on the exporter left behind. It runs as 65532 like the rest: the
# directory has to be writable by it (sudo setfacl -m u:65532:rwx <it>).
# Never per device.
x-exporter: &exporter
  # The Caddy image for its shell and wget, as the server's tasks; jq is the
  # jq image's, mounted whole at /jq.
  image: ${DOTDASH_RELAY_IMAGE_CADDY:?set by morzer}
  entrypoint: ["sh", "/metrics/metrics.sh"]
  restart: unless-stopped
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 16
  mem_limit: 64m
  tmpfs: ["/tmp:size=1m"]
  logging:
    driver: local
    options: {max-size: 1m, max-file: "2"}
  volumes:
    - ${DOTDASH_RELAY_RELEASE_DIR:?set by morzer}/metrics:/metrics:ro
    - type: image
      source: ${DOTDASH_RELAY_IMAGE_JQ:?set by morzer}
      target: /jq
    - type: bind
      source: ${DOTDASH_RELAY_PARAM_METRICS_TEXTFILE:-/var/lib/prometheus/node-exporter}
      target: /textfile
      bind: {create_host_path: false}
    # The gateway's status (compose.yaml), which metrics.sh reads when it is
    # there.
    - gateway:/gateway:ro

services:
  xray:
    # default stays: a service's networks replace the default it is on alone.
    networks:
      default: {}
      metrics: {aliases: [xray-metrics]}
  metrics-xray:
    <<: *exporter
    networks: [metrics]
    command: ["dotdash-relay", "xray", "http://xray-metrics:11111/debug/vars"]

networks:
  metrics:
    internal: true
