# dotdash-relay. One Xray, on port 443: devices holding this relay's keys get
# VLESS with REALITY under the name of a site next to it, and each connection
# goes on to its device's own dotdash server group, as this relay's own client
# there. Anything else gets the site's real handshake. Nothing leaves here
# except to dotdash: each group's servers decide where its traffic exits, as
# they do for their own devices. The gateway's agent, Xray's parent in the
# image, fetches each group's device list through that group's tunnel every
# minute and keeps Xray's devices current through its API.
#
# Compose sees only what morzer gives it: DOTDASH_RELAY_IMAGE_*,
# DOTDASH_RELAY_PARAM_*, DOTDASH_RELAY_RELEASE_DIR, DOTDASH_RELAY_SECRETS_DIR.

x-hardened: &hardened
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: local
    options: {max-size: 10m, max-file: "3"}

services:
  xray:
    <<: *hardened
    image: ${DOTDASH_RELAY_IMAGE_XRAY:?set by morzer}
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 256m
    environment:
      # Go's soft memory limit at about 90% of mem_limit: Go collects garbage harder
      # near it rather than let the kernel kill Xray at the cap (dotdash-lab #49).
      GOMEMLIMIT: 230MiB
    volumes:
      # Long form, so a missing file fails the start rather than becoming a
      # directory morzer cannot render over. The device inbounds, then the
      # way to the server groups ($gateway), merged in that order.
      - type: bind
        source: /etc/dotdash-relay/xray.json
        target: /etc/xray/config.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/dotdash-relay/gateway.json
        target: /etc/xray/gateway.json
        read_only: true
        bind: {create_host_path: false}
      # The gateway's agent writes each group's state here
      # (/run/gateway/status.json), which the tasks and the metrics read.
      - gateway:/run/gateway
    tmpfs:
      # Where the image writes the config with secrets resolved, every
      # group's device ids among them, and stages a restart's beside it:
      # never disk.
      - /run/xray:uid=65532,gid=65532,mode=0700,size=16m
    secrets: [servers, via, vless_seed, reality_key, reality_short_id, xhttp_path, cdn_xhttp_path, kcp_seed]
    # REALITY on 443 inside too (Xray warns on any other port), as uid 65532
    # with no capabilities. It ends devices' TCP, so it sends their downloads:
    # on BBR (tcp_congestion), in this container's namespace alone.
    # Path-MTU probing on every connection and at most 128 KiB unsent in a
    # socket, as the server's gate has them (dotdash-lab #55).
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
      net.ipv4.tcp_congestion_control: "${DOTDASH_RELAY_PARAM_TCP_CONGESTION:-bbr}"
      net.ipv4.tcp_mtu_probing: 2
      net.ipv4.tcp_notsent_lowat: 131072
    # Devices always dial 443: https_port and listen differ from 443 and
    # every address only behind a web server of the operator's own on this
    # machine that passes the relay's name through from 443.
    ports: ["${DOTDASH_RELAY_PARAM_LISTEN-}:${DOTDASH_RELAY_PARAM_HTTPS_PORT:-443}:443"]
    # No healthcheck here: hooks/healthy runs the probe itself (see there).

  # One-shot behind a profile, started only by `morzer task run relay-entry`,
  # and `servers` and `facts`, which read the gateway's status.
  relay-entry:
    <<: *hardened
    image: ${DOTDASH_RELAY_IMAGE_BUSYBOX:?set by morzer}
    restart: "no"
    profiles: [tasks]
    network_mode: none
    pids_limit: 64
    environment: &entry-env
      SITE: ${DOTDASH_RELAY_PARAM_SITE:-}
      # Here rather than under own-site, so relay-entry can say it needs it.
      CDN_HOSTS: ${DOTDASH_RELAY_PARAM_CDN_HOSTS:-none}
      CDN_ONLY: ${DOTDASH_RELAY_PARAM_CDN_ONLY:-false}
      ENTRY_HOST: ${DOTDASH_RELAY_PARAM_ENTRY_HOST:-none}
      NAME: ${DOTDASH_RELAY_PARAM_NAME:-}
    volumes:
      - ${DOTDASH_RELAY_RELEASE_DIR:?set by morzer}/tasks:/task:ro
      - type: image
        source: ${DOTDASH_RELAY_IMAGE_XRAY:?set by morzer}
        target: /opt/xray
        image:
          subpath: usr/local/bin
      # jq, for the gateway's status: the jq image whole, at /jq.
      - type: image
        source: ${DOTDASH_RELAY_IMAGE_JQ:?set by morzer}
        target: /jq
      - gateway:/run/gateway:ro
    secrets: &entry-secrets [nonce, vless_seed, reality_key, reality_short_id, xhttp_path, cdn_xhttp_path, kcp_seed]

  # One-shot behind a profile, started only by `morzer task run entry-check`:
  # an Xray client of each of this relay's entries, as each group's checker,
  # in Xray's own namespace, which reaches its inbounds on loopback
  # (tasks/entry-check.sh).
  # Like relay-entry under device-traffic, it starts Xray if it is down.
  entry-check:
    <<: *hardened
    image: ${DOTDASH_RELAY_IMAGE_BUSYBOX:?set by morzer}
    restart: "no"
    profiles: [tasks]
    network_mode: service:xray
    pids_limit: 64
    environment:
      <<: *entry-env
      PROBE_URL: ${DOTDASH_RELAY_PARAM_PROBE_URL:-https://www.gstatic.com/generate_204}
    volumes:
      - ${DOTDASH_RELAY_RELEASE_DIR:?set by morzer}/tasks:/task:ro
      - type: image
        source: ${DOTDASH_RELAY_IMAGE_XRAY:?set by morzer}
        target: /opt/xray
        image:
          subpath: usr/local/bin
      - type: image
        source: ${DOTDASH_RELAY_IMAGE_JQ:?set by morzer}
        target: /jq
      - gateway:/run/gateway:ro
      # busybox has no CA certificates; fetching an https probe_url needs them.
      - type: image
        source: ${DOTDASH_RELAY_IMAGE_XRAY:?set by morzer}
        target: /etc/ssl/certs
        image:
          subpath: etc/ssl/certs
    # The client's config, which holds the relay's keys and a checker's id.
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700,size=1m
    secrets: *entry-secrets

secrets:
  servers: {file: "${DOTDASH_RELAY_SECRETS_DIR:?set by morzer}/servers"}
  via: {file: "${DOTDASH_RELAY_SECRETS_DIR:?set by morzer}/via"}
  nonce: {file: "${DOTDASH_RELAY_SECRETS_DIR:?set by morzer}/nonce"}
  kcp_seed: {file: "${DOTDASH_RELAY_SECRETS_DIR:?set by morzer}/kcp_seed"}
  vless_seed: {file: "${DOTDASH_RELAY_SECRETS_DIR:?set by morzer}/vless_seed"}
  reality_key: {file: "${DOTDASH_RELAY_SECRETS_DIR:?set by morzer}/reality_key"}
  reality_short_id: {file: "${DOTDASH_RELAY_SECRETS_DIR:?set by morzer}/reality_short_id"}
  xhttp_path: {file: "${DOTDASH_RELAY_SECRETS_DIR:?set by morzer}/xhttp_path"}
  cdn_xhttp_path: {file: "${DOTDASH_RELAY_SECRETS_DIR:?set by morzer}/cdn_xhttp_path"}
  acme_dns: {file: "${DOTDASH_RELAY_SECRETS_DIR:?set by morzer}/acme_dns"}

volumes:
  # The gateway's status, which its agent writes and the tasks and the
  # metrics profile's exporter read: in memory, never on disk, as it names
  # each group's servers. A backup stops Xray first (the volume is cold),
  # which unmounts it, so it captures it empty.
  gateway:
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=1m,uid=65532,gid=65532,mode=0755"}
