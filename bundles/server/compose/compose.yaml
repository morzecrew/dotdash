# dotdash. Xray owns the public TLS port with REALITY: clients holding the key
# get Xray, everything else is relayed to Caddy, which serves a cover site with
# a Let's Encrypt certificate and passes one secret path back to Xray's XHTTP
# inbound. Caddy publishes only port 80, for ACME. Every client connection
# leaves through the upstream proxy. The xdns profile adds the DNS tunnel
# (xdns.yaml), xhttp-reality XHTTP with REALITY on a port of its own
# (xhttp-reality.yaml), and xdns,xhttp-reality both.
#
# Compose sees only what morzer gives it: DOTDASH_IMAGE_*, DOTDASH_PARAM_*,
# DOTDASH_DOMAIN, DOTDASH_CONFIG_FILE, DOTDASH_RELEASE_DIR, DOTDASH_SECRETS_DIR.

x-hardened: &hardened
  restart: unless-stopped
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  logging:
    driver: local
    options: {max-size: 10m, max-file: "3"}

services:
  xray:
    <<: *hardened
    image: ${DOTDASH_IMAGE_XRAY:?set by morzer}
    environment:
      # The config's loopback-only http inbound: the probe takes the same
      # routing and upstream as client traffic.
      XRAY_HEALTHCHECK_PROXY: http://127.0.0.1:10809
      XRAY_HEALTHCHECK_URL: ${DOTDASH_PARAM_PROBE_URL:-https://www.gstatic.com/generate_204}
      XRAY_HEALTHCHECK_EXPECT: ${DOTDASH_PARAM_PROBE_EXPECT:-.*}
    volumes:
      # Long form, so a missing file fails the start: the short form has
      # Docker create a directory there, which morzer cannot render over.
      - type: bind
        source: ${DOTDASH_CONFIG_FILE:-/etc/dotdash/application.yaml}
        target: /etc/xray/config.json
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      # Where the image writes the config with secrets resolved; never disk.
      - /run/xray:uid=65532,gid=65532,mode=0700,size=1m
    secrets: [vless_clients, vless_seed, xhttp_path, reality_key, reality_short_id, kcp_seed]
    # REALITY on 443 inside too (Xray warns on any other port), as uid 65532
    # with no capabilities.
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}
    # Internal networks only: no published port, no route out. The gate
    # forwards the public port in and carries the way out.
    networks: [backend, inside]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/usr/local/bin/xray-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  # The one container with a route out (gate.json.tmpl): the public port in to
  # Xray, and Xray's way out to the upstream, whose credentials only it holds.
  gate:
    <<: *hardened
    image: ${DOTDASH_IMAGE_XRAY:?set by morzer}
    # XRAY_UPSTREAM_PIN and XRAY_UPSTREAM_ALIASES (templates/gate.env.tmpl).
    env_file: /etc/dotdash/gate.env
    volumes:
      - type: bind
        source: /etc/dotdash/gate.json
        target: /etc/xray/config.json
        read_only: true
        bind: {create_host_path: false}
      # The upstreams secret as the gate's outbounds: a file of its own, whose
      # outbounds Xray merges with config.json's, routing kept from that one.
      - type: bind
        source: ${DOTDASH_RELEASE_DIR:?set by morzer}/gate/upstreams.json
        target: /etc/xray/upstreams.json
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - /run/xray:uid=65532,gid=65532,mode=0700,size=1m
    secrets: [upstreams]
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}
    ports:
      - "${DOTDASH_PARAM_HTTPS_PORT:-443}:443/tcp"
    networks: [inside, egress]
    # After Xray, not before: an update from a release where Xray published
    # https_port itself recreates Xray first, freeing the port the gate binds.
    # Xray's healthcheck, which goes out through the gate, passes once it runs.
    depends_on:
      xray:
        condition: service_started
    mem_limit: 256m
    healthcheck:
      # No proxy configured, so the image checks that Xray runs.
      test: ["CMD", "/usr/local/bin/xray-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  caddy:
    <<: *hardened
    image: ${DOTDASH_IMAGE_CADDY:?set by morzer}
    environment:
      DOMAIN: ${DOTDASH_DOMAIN:?install with --domain}
      CERT_ISSUER: ${DOTDASH_PARAM_CERT_ISSUER:-acme}
    # 80 and 443 inside, as above.
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}
    volumes:
      - type: bind
        source: ${DOTDASH_RELEASE_DIR:?set by morzer}/caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: {create_host_path: false}
      # The bundled page, and the operator's own site, served instead when it
      # has the requested file (the Caddyfile decides).
      - ${DOTDASH_RELEASE_DIR:?set by morzer}/site:/srv/default:ro
      - ${DOTDASH_PARAM_SITE_DIR:-/srv/dotdash}:/srv/own:ro
      # The ACME account and certificates. The image's /data/caddy is mode
      # 1777, and a fresh volume copies it, so uid 65532 can write there.
      - caddy_data:/data
      # Each device's subscription file, which the subscription service writes.
      - subscription:/srv/sub:ro
    tmpfs:
      - /config:uid=65532,gid=65532,mode=0700,size=8m
    secrets: [xhttp_path]
    ports:
      - "80:80/tcp"
    networks: [edge, backend]
    mem_limit: 256m
    depends_on:
      xray:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # One-shot behind a profile, started only by `morzer task run client-config`.
  # The Caddy image for its shell, the Xray image mounted for the binaries that
  # derive the client keys; no network at all.
  client-config:
    <<: *hardened
    restart: "no"
    image: ${DOTDASH_IMAGE_CADDY:?set by morzer}
    profiles: [tasks]
    network_mode: none
    environment: &client-env
      DOMAIN: ${DOTDASH_DOMAIN:?install with --domain}
      HTTPS_PORT: ${DOTDASH_PARAM_HTTPS_PORT:-443}
      SERVERS: ${DOTDASH_PARAM_SERVERS:-self}
      DNS_RESOLVER: ${DOTDASH_PARAM_DNS_RESOLVER:-https://1.1.1.1/dns-query}
      SUBSCRIPTION: ${DOTDASH_PARAM_SUBSCRIPTION:-false}
      DIRECT: ${DOTDASH_PARAM_DIRECT:-true}
      RELAYS: ${DOTDASH_PARAM_RELAYS:-}
      CDN_HOSTS: ${DOTDASH_PARAM_CDN_HOSTS:-none}
      POOLS: ${DOTDASH_PARAM_POOLS:-}
      KCP_HEADER: ${DOTDASH_PARAM_KCP_HEADER:-dtls}
      KCP_OPEN: ${DOTDASH_PARAM_KCP_OPEN:-none}
    volumes:
      - ${DOTDASH_RELEASE_DIR:?set by morzer}/tasks:/task:ro
      - type: image
        source: ${DOTDASH_IMAGE_XRAY:?set by morzer}
        target: /opt/xray
        image:
          subpath: usr/local/bin
    secrets: [vless_clients, vless_seed, xhttp_path, reality_key, reality_short_id, subscription_key, kcp_seed]

  # Writes each device's subscription into the subscription volume at start
  # (tasks/subscription.sh), as client-config would print its links, and then
  # waits; morzer restarts it when a secret or parameter it reads changes.
  # The keys stay here: Caddy reads only the files. No network at all.
  subscription:
    <<: *hardened
    image: ${DOTDASH_IMAGE_CADDY:?set by morzer}
    network_mode: none
    init: true
    command: ["sh", "/task/subscription.sh"]
    environment: *client-env
    volumes:
      - ${DOTDASH_RELEASE_DIR:?set by morzer}/tasks:/task:ro
      - type: image
        source: ${DOTDASH_IMAGE_XRAY:?set by morzer}
        target: /opt/xray
        image:
          subpath: usr/local/bin
      - subscription:/sub
    secrets: [vless_clients, vless_seed, xhttp_path, reality_key, reality_short_id, subscription_key, kcp_seed]
    # Healthy once every device's file is written; restarted for a changed
    # secret or parameter, it is not until they are written again.
    healthcheck:
      test: ["CMD", "test", "-e", "/sub/.ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # One-shot behind a profile, started only by `morzer task run exit-check`.
  # It shares Xray's network namespace, so it reaches the probe inbound on
  # 127.0.0.1:10809 and asks through the upstream as client traffic leaves.
  exit-check:
    <<: *hardened
    restart: "no"
    image: ${DOTDASH_IMAGE_CADDY:?set by morzer}
    profiles: [tasks]
    network_mode: service:xray
    environment:
      RESOLVE: ${DOTDASH_PARAM_RESOLVE:-gateway}
      DNS_RESOLVER: ${DOTDASH_PARAM_DNS_RESOLVER:-https://1.1.1.1/dns-query}
    volumes:
      - ${DOTDASH_RELEASE_DIR:?set by morzer}/tasks:/task:ro

networks:
  edge: {}
  # Caddy and Xray to each other only; no route out.
  backend:
    internal: true
  # Xray and the gate to each other only; no route out.
  inside:
    internal: true
  # The gate's way out, and where the public port is published.
  egress: {}

volumes:
  caddy_data: {}
  # In memory: written at every start, and kept by nothing that outlives it.
  subscription:
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=4m,uid=65532,gid=65532,mode=0700"}

secrets:
  vless_clients:
    file: ${DOTDASH_SECRETS_DIR:-/run/dotdash/secrets}/vless_clients
  xhttp_path:
    file: ${DOTDASH_SECRETS_DIR:-/run/dotdash/secrets}/xhttp_path
  vless_seed:
    file: ${DOTDASH_SECRETS_DIR:-/run/dotdash/secrets}/vless_seed
  kcp_seed:
    file: ${DOTDASH_SECRETS_DIR:-/run/dotdash/secrets}/kcp_seed
  upstreams:
    file: ${DOTDASH_SECRETS_DIR:-/run/dotdash/secrets}/upstreams
  reality_key:
    file: ${DOTDASH_SECRETS_DIR:-/run/dotdash/secrets}/reality_key
  reality_short_id:
    file: ${DOTDASH_SECRETS_DIR:-/run/dotdash/secrets}/reality_short_id
  subscription_key:
    file: ${DOTDASH_SECRETS_DIR:-/run/dotdash/secrets}/subscription_key
