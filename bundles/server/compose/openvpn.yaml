# The openvpn profile, for the openvpn:// lines of the upstreams secret: Xray
# has no OpenVPN, so an OpenVPN client (vpn) holds a tunnel for each line, the
# k-th on tun<k>, and a SOCKS hop in its namespace (vpn-socks) sends what it
# gets on port 1080+k into tun<k> alone. The gate dials the k-th line at
# vpn:1080+k on the egress network (XRAY_UPSTREAM_ALIASES,
# templates/gate.env.tmpl).
# vpn's image swaps the default route for host routes to the servers in the
# configs before openvpn starts, and no tunnel takes the default route, so
# nothing in that namespace has a way out but a tunnel's device, on the first
# start too (platform-images, images/openvpn). hooks/policy checks that it has
# no default route around the tunnels.
services:
  vpn:
    image: ${DOTDASH_IMAGE_OPENVPN:?set by morzer}
    restart: unless-stopped
    # Root, the one container here that is: openvpn needs NET_ADMIN for its
    # tun device and routes, which a non-root user cannot use, and the kill
    # switch needs it for its own. DAC_READ_SEARCH reads the upstreams secret,
    # which is the gate's user's (0400, 65532) and which root without a
    # capability may not open; it reads, never writes, and only within this
    # container, where that secret is the one file not root's.
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, DAC_READ_SEARCH]
    devices: ["/dev/net/tun:/dev/net/tun"]
    # A read-only root needs nothing more: the image points openvpn's
    # temporary directory at /dev/shm, which Docker keeps writable.
    read_only: true
    security_opt: ["no-new-privileges:true"]
    # An openvpn and its supervisor for each of up to 8 tunnels.
    pids_limit: 128
    environment:
      OPENVPN_UPSTREAMS: /run/secrets/upstreams
    # Root reads the gate's list: it holds every way out, but this container
    # can already send traffic anywhere a tunnel reaches.
    secrets: [upstreams]
    # Nothing routes into the tunnels, so reverse-path filtering would drop
    # their replies; the image refuses to start with it on.
    sysctls:
      net.ipv4.conf.all.rp_filter: 0
      net.ipv4.conf.default.rp_filter: 0
    # egress alone: not on inside, beside Xray.
    networks: [egress]
    # About 20 MB for each openvpn.
    mem_limit: 256m
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      # Passes while any tunnel is up. Whether each carries traffic is the
      # gate's to judge, which probes every line, and hooks/healthy's, which
      # asks each one when nothing gets out.
      test: ["CMD", "/usr/local/bin/openvpn-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      # Every 2 s while it starts, so vpn-socks, which waits for it, follows
      # within seconds of a tunnel coming up: an edit of upstreams restarts
      # vpn.
      start_interval: 2s

  vpn-socks:
    image: ${DOTDASH_IMAGE_XRAY:?set by morzer}
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    network_mode: service:vpn
    volumes:
      - type: bind
        source: /etc/dotdash/vpn-socks.json
        target: /etc/xray/config.json
        bind: {create_host_path: false}
    tmpfs:
      - /run/xray:uid=65532,gid=65532,mode=0700,size=1m
    # Once the tunnel is up: vpn's image deletes its default route first
    # thing, and joining after its healthcheck passes leaves no moment at all
    # with a way out but the tunnel. restart: a restart of vpn gives it a new
    # network namespace, and Compose then restarts this after it, into the new
    # one; without it, this keeps the old namespace, cut off from the tunnel,
    # and restarting both at once races and fails.
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    mem_limit: 256m
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      # Liveness alone (no XRAY_HEALTHCHECK_PROXY): one tunnel down must not
      # mark the others' hop unhealthy.
      test: ["CMD", "/usr/local/bin/xray-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
