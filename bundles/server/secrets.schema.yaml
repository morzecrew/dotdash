# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-secrets.json
# Both images run as 65532 (Xray's distroless nonroot, and Caddy told to), so
# every file is theirs; Compose mounts each only into the services listed.
api_version: selfhost/v1alpha1

secrets:
  # One client per line, "<uuid> [name]", for every inbound; blank lines and
  # "#" comments are skipped. The generator writes the first, unnamed. Add a
  # device with `morzer secret edit vless_clients`; delete its line to revoke
  # it. The image refuses a line that is not a UUID (platform-images#130).
  - name: vless_clients
    description: VLESS clients, one "<uuid> [name]" per line
    required: true
    generator: {kind: uuid}
    owner: "65532:65532"
    services: [xray, subscription]

  - name: xhttp_path
    description: Secret URL path Caddy routes to Xray's XHTTP inbound; everything else gets the cover site
    required: true
    generator: {kind: hex, length: 32}
    owner: "65532:65532"
    services: [caddy, xray, subscription]

  # mKCP's packets are encrypted under it (AES-128-GCM) before any header, so
  # an observer sees no KCP; links carry it as their seed. VLESS Encryption
  # still protects what the packets carry. Only the mkcp profile uses it.
  - name: kcp_seed
    description: Key mKCP's packets are encrypted under (the mkcp profile)
    required: true
    generator: {kind: hex, length: 32}
    owner: "65532:65532"
    services: [xray, subscription]

  # Both VLESS Encryption strings derive from this ML-KEM-768 seed: the image
  # resolves the server's, the client-config task prints the client's.
  # Rotating it re-keys the server; clients need the new task output.
  - name: vless_seed
    description: ML-KEM-768 seed (64 bytes, hex) the VLESS Encryption key pair derives from
    required: true
    generator: {kind: hex, length: 128}
    owner: "65532:65532"
    services: [xray, subscription]

  # x25519 private key: 43 base64url characters are 32 random bytes, which is
  # what REALITY reads. The client-config task prints the public half.
  - name: reality_key
    description: REALITY private key (x25519, base64url)
    required: true
    generator: {kind: password, length: 43, alphabet: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"}
    owner: "65532:65532"
    services: [xray, subscription]

  - name: reality_short_id
    description: REALITY short id clients present alongside the key
    required: true
    generator: {kind: hex, length: 16}
    owner: "65532:65532"
    services: [xray, subscription]

  # The key each device's subscription path derives from (subscription.sh).
  # Rotating it moves every device's subscription to a new URL, which
  # client-config prints: the way to retire URLs that leaked.
  - name: subscription_key
    description: Key the subscription URLs derive from, one per device
    required: true
    generator: {kind: hex, length: 64}
    owner: "65532:65532"
    services: [subscription]

  # Every way out, one per line, in order: a proxy as socks5://, socks5+tls://,
  # http:// or https:// with "[user:pass@]host:port" after the scheme, a
  # WireGuard exit as its wireguard:// share link (the wireguard-line task
  # makes one from a wg-quick file), or an OpenVPN exit as openvpn:// and its
  # client config, gzipped and base64url-encoded (the openvpn-line task makes
  # one), for the openvpn profile's tunnels, at most 8. Each may end in
  # name=<name> and group=ipv6 (or group=upstream,ipv6). The gate's Xray image
  # turns the list into its outbounds ({"$upstreams": ...}, platform-images),
  # and the openvpn profile's client (vpn), root, reads its openvpn:// lines
  # (OPENVPN_UPSTREAMS); it is one value, so adding or reordering ways out is
  # one secret edit and one restart of each. While the profile is off, morzer
  # restarts the gate alone (0.15.1). Required: an update from a release
  # before it is refused until it is set, rather than coming up with no way
  # out.
  - name: upstreams
    description: 'Every way out, one per line, in order: socks5://, socks5+tls://, http://, https://, wireguard:// or openvpn:// URLs; each may end in name=<name> and group=ipv6'
    required: true
    owner: "65532:65532"
    services: [gate, vpn]

  # cert_issuer=acme-dns: Caddy's registration with the acme-dns server that
  # answers the DNS-01 check, as its /register endpoint returns it, with the
  # server's URL added: {"username", "password", "subdomain", "server_url"}.
  # It can answer only the check at the name whose CNAME points at it. Unset,
  # it is an empty file, which nothing reads under another cert_issuer.
  - name: acme_dns
    description: 'With cert_issuer=acme-dns, the acme-dns registration, JSON: {"username", "password", "subdomain", "server_url"}'
    required: false
    owner: "65532:65532"
    services: [caddy]
