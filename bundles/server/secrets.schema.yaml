# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-secrets.json
# Both images run as 65532 (Xray's distroless nonroot, and Caddy told to), so
# every file is theirs; Compose mounts each only into the services listed.
api_version: selfhost/v1alpha1

secrets:
  # One client per line, "<uuid> [name]", for every inbound; blank lines and
  # "#" comments are skipped. The generator writes the first, unnamed. Add a
  # device with `morzer secret edit vless_clients`; delete its line to revoke
  # it. The image refuses a line that is not a UUID (platform-images#130).
  - name: vless_clients
    description: VLESS clients, one "<uuid> [name]" per line
    required: true
    generator: {kind: uuid}
    owner: "65532:65532"
    services: [xray, subscription]

  - name: xhttp_path
    description: Secret URL path Caddy routes to Xray's XHTTP inbound; everything else gets the cover site
    required: true
    generator: {kind: hex, length: 32}
    owner: "65532:65532"
    services: [caddy, xray, subscription]

  # mKCP's packets are encrypted under it (AES-128-GCM) before any header, so
  # an observer sees no KCP; links carry it as their seed. VLESS Encryption
  # still protects what the packets carry. Only the mkcp profile uses it.
  - name: kcp_seed
    description: Key mKCP's packets are encrypted under (the mkcp profile)
    required: true
    generator: {kind: hex, length: 32}
    owner: "65532:65532"
    services: [xray, subscription]

  # Both VLESS Encryption strings derive from this ML-KEM-768 seed: the image
  # resolves the server's, the client-config task prints the client's.
  # Rotating it re-keys the server; clients need the new task output.
  - name: vless_seed
    description: ML-KEM-768 seed (64 bytes, hex) the VLESS Encryption key pair derives from
    required: true
    generator: {kind: hex, length: 128}
    owner: "65532:65532"
    services: [xray, subscription]

  # x25519 private key: 43 base64url characters are 32 random bytes, which is
  # what REALITY reads. The client-config task prints the public half.
  - name: reality_key
    description: REALITY private key (x25519, base64url)
    required: true
    generator: {kind: password, length: 43, alphabet: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"}
    owner: "65532:65532"
    services: [xray, subscription]

  - name: reality_short_id
    description: REALITY short id clients present alongside the key
    required: true
    generator: {kind: hex, length: 16}
    owner: "65532:65532"
    services: [xray, subscription]

  # The key each device's subscription path derives from (subscription.sh).
  # Rotating it moves every device's subscription to a new URL, which
  # client-config prints: the way to retire URLs that leaked.
  - name: subscription_key
    description: Key the subscription URLs derive from, one per device
    required: true
    generator: {kind: hex, length: 64}
    owner: "65532:65532"
    services: [subscription]

  # The upstream proxy, "user:pass@host:port" (or "host:port" for one that
  # asks for no login), in one value so a change of provider is one restart.
  # The gate's Xray image splits it ({"$proxy": ...}, platform-images): the
  # password may hold ":" and "@", and an IPv6 host goes in brackets.
  # Not required: an installation whose upstream is a tunnel needs none, and
  # with socks or http the egress health check fails, naming this secret,
  # while it is unset.
  - name: upstream
    description: 'The ISP/residential proxy, as "user:pass@host:port", for upstream_protocol socks, socks-tls, http or https'
    required: false
    owner: "65532:65532"
    services: [gate]

  # A tunnel's config has a secret of its own, so it is set before
  # upstream_protocol names it, while the running gate still reads the proxy,
  # and switching either way is one config set. The gate's image turns this
  # one into a WireGuard outbound ({"$wireguard": ...}, platform-images).
  - name: upstream_wireguard
    description: "The WireGuard exit's wg-quick client config, for upstream_protocol=wireguard"
    required: false
    owner: "65532:65532"
    services: [gate]

  # Read by vpn, the openvpn profile's OpenVPN client, which runs as root:
  # owned by root, it needs no capability to read. While the profile is off,
  # as it is when the config is first set, morzer restarts nothing (0.15.1);
  # turning the profile on creates vpn. While it runs, Compose restarts
  # vpn-socks after vpn (depends_on restart, compose/openvpn.yaml).
  - name: upstream_openvpn
    description: "The OpenVPN exit's client config, keys and any login inline, for upstream_protocol=openvpn (the openvpn profile)"
    required: false
    owner: "0:0"
    services: [vpn]

  # The IPv6 proxy's, in the same form. Optional: the gate mounts it whether
  # or not the proxy is in use, and an unset secret is an empty file there.
  # Unused while upstream6_protocol is none.
  - name: upstream6
    description: 'The IPv6 proxy, as "user:pass@host:port"; needed once upstream6_protocol is set'
    required: false
    owner: "65532:65532"
    services: [gate]

  # The backup proxy's, in the same form, mounted as upstream6 is. Unused
  # while upstream_backup_protocol is none.
  - name: upstream_backup
    description: 'A backup proxy for when the upstream fails, as "user:pass@host:port"; needed once upstream_backup_protocol is set'
    required: false
    owner: "65532:65532"
    services: [gate]
