# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-manifest.json
api_version: selfhost/v1alpha1
kind: application-release

metadata:
  name: dotdash
  # Stamped by `morzer release build --version X`, together with VERSION.
  version: 0.0.0
  description: Xray with REALITY in front of a Caddy cover site, an optional DNS tunnel, egressing through an upstream proxy
  vendor: morzecrew
  release_notes: RELEASE.md

providers:
  runtime: {name: compose}
  secrets: {name: sops-age}
  health: {name: http}

runtimes:
  compose:
    files:
      - compose/compose.yaml
    profiles:
      # The DNS tunnel on UDP/53, which also needs xdns_domain.
      xdns: [compose/xdns.yaml]
      # VLESS over XHTTP with REALITY on xhttp_reality_port, beside the two
      # transports every install has.
      xhttp-reality: [compose/xhttp-reality.yaml]
      # An OpenVPN client (vpn), with a tunnel for each openvpn:// line of the
      # upstreams secret, and a SOCKS hop in its namespace (vpn-socks), which
      # the gate dials for them: Xray has no OpenVPN of its own.
      openvpn: [compose/openvpn.yaml]
      # VLESS over mKCP on kcp_port: UDP, no TLS underneath, its packets
      # encrypted under kcp_seed and dressed in a kcp_header.
      mkcp: [compose/mkcp.yaml]
    # installation.profile=xdns,xhttp-reality runs both; any of them with
    # openvpn, such as xdns,openvpn, adds the OpenVPN tunnels.
    combinable: [xdns, xhttp-reality, openvpn, mkcp]
    options:
      project: dotdash

compatibility:
  # The manager this bundle is verified and rehearsed with, and the first that
  # health-checks a parameter change and undoes it when the check fails.
  min_manager_version: "0.16.0"
  # 0.7.0 renamed healthcheck_url, healthcheck6_url and healthcheck_expect to
  # probe_*, and replaced the upstream settings with the upstreams secret; an
  # update retires the old values, so 0.6.x would come back without them.
  # 0.4.0 declared false too, when the upstream secret replaced upstream_host
  # and its kin. An update from 0.3.x is still refused until `upstream` is set.
  rollback_safe: false
  # No database, which an unattended update needs declared.
  database: none

requirements:
  architectures: [amd64, arm64]
  tools:
    # client-config mounts the Xray image (Compose `type: image`).
    docker: ">=28.0.0"
    compose: ">=2.35.0"
  memory: 512MiB
  disk: 2GiB
  # TCP only. UDP/53 for the DNS tunnel is not checked here: on a host whose
  # systemd-resolved stub holds 127.0.0.53:53, set xdns_bind to the public IP.
  # Nor are xhttp_reality_port and kcp_port: these fields see the parameters,
  # not the profile, and a default install must not need them free.
  ports: ["80", "{{ .Parameters.https_port }}"]

parameters:
  https_port:
    type: port
    default: 443
    description: Host port of the REALITY inbound; anything without its key reaches the cover site
    services: [gate, subscription]
  upstream_mode:
    type: enum
    values: [failover, fastest, balance]
    default: failover
    description: "How the lines of the upstreams secret share the traffic. failover: the first line while it answers, then the fastest of the rest, so the exit stays put; fastest: whichever answers fastest; balance: connections spread over every line that answers, each possibly from another IP. Each line is probed at probe_url every 30 s"
    services: [gate]
  upstream_pin:
    type: string
    default: none
    description: "The name= of an upstreams line that goes first whatever its place, with the others behind it as upstream_mode has them, or none; under ipv6=separate a second name, comma-separated, pins the IPv6 group"
    services: [gate]
  upstream_udp:
    type: bool
    default: false
    description: "Carry client UDP through the upstreams. Every line must carry it: a WireGuard or OpenVPN line, or SOCKS5 with UDP ASSOCIATE; an HTTP proxy drops it. Otherwise UDP is dropped here"
    services: [xray, gate]
  probe6_url:
    type: string
    default: http://api6.ipify.org
    description: "With ipv6=separate, a URL with an IPv6 address only, which the egress health check also fetches, through the IPv6 lines; any 2xx is healthy"
  xdns_domain:
    type: string
    default: t
    description: Zone delegated to this server for the DNS tunnel (xdns profile); a name with no dot is taken under the domain, so t is t.example.com
    services: [xray]
  xdns_bind:
    type: string
    default: 0.0.0.0
    description: Host address UDP/53 is published on for the DNS tunnel
    services: [gate]
  xhttp_reality_port:
    type: port
    default: 8443
    description: "Host TCP port of XHTTP with REALITY (the xhttp-reality profile); must differ from https_port and 80"
    services: [gate, subscription]
  kcp_port:
    type: port
    default: 8447
    description: "Host UDP port of VLESS over mKCP (the mkcp profile); must not be 53 with the DNS tunnel on"
    services: [gate, subscription]
  kcp_header:
    type: enum
    values: [none, dtls, srtp, utp, wechat, wireguard]
    default: dtls
    description: "What mKCP's packets start with, to pass for another protocol (the mkcp profile): dtls a DTLS 1.2 record header, as WebRTC and VPNs send; wireguard a WireGuard data header; utp, wechat, or srtp (Xray's own, which does not start as RTP does); none sends the encrypted packets bare. Devices take a change from new links or their subscription"
    services: [xray, subscription]
  kcp_open:
    type: enum
    values: [none, quic]
    default: none
    description: "An opener in front of mKCP (the mkcp profile): quic sends a QUIC-Initial-shaped packet (finalmask noise) before the flow, so a network that lets QUIC out sees the start as QUIC; none sends nothing extra. Both ends must match, so devices take a change from new links (carried as fm=) or their subscription. The opener is a fixed shape; measure it on a canary before relying on it"
    services: [xray, subscription]
  xdns_mtu:
    type: int
    default: 900
    description: mKCP packet size the DNS tunnel answers with; must fit the EDNS0 size resolvers on the path advertise (1232 is common, lower it if replies are lost)
    services: [xray]
  resolve:
    type: enum
    values: [gateway, upstream]
    default: gateway
    description: "Who turns hostnames into addresses. gateway: this server, over dns_resolver, which itself goes out through the upstreams, so they see addresses only; a name resolving to a private address is blocked. upstream: the upstream proxies, which then see every hostname; not with a WireGuard or OpenVPN line, which resolves no names"
    services: [xray]
  ipv6:
    type: enum
    values: [allow, block, separate]
    default: allow
    description: "IPv6 destinations. allow: they leave through the upstreams like any other, which suits lines that all have IPv6. separate: through the lines marked group=ipv6, with upstream_mode applying to them alone, and never through the others. block: none leaves; names resolve to IPv4 addresses only and the upstreams are dialled over IPv4, so dual-stack sites still work; with resolve=upstream the upstream resolves names itself"
    services: [xray, gate]
  dns_resolver:
    type: string
    default: https://1.1.1.1/dns-query
    description: "The DNS-over-HTTPS server resolve=gateway asks, through the upstream; it sees the names, the upstream does not. client-config's Xray config answers the device's DNS from it too, through the tunnel. Only https:// URLs are accepted"
    services: [xray]
  probe_expect:
    type: string
    default: ".*"
    description: "Regular expression (RE2) the response to probe_url must match. With probe_url at an IP-echo service, the upstream's exit IP anchored, such as ^203\\.0\\.113\\.7\\s*$, makes Xray unhealthy when the exit IP changes"
    services: [xray]
  cert_issuer:
    type: enum
    values: [acme, internal]
    default: acme
    description: "Where the site certificate comes from: acme is Let's Encrypt, over ports 80 and 443; internal is Caddy's own CA, for a machine the internet cannot reach"
    services: [caddy]
  servers:
    type: string
    default: self
    description: "Servers with these same secrets, comma-separated; self is this one. client-config prints links for each and, with more than one, a config that uses whichever answers fastest"
    services: [subscription]
  relays:
    type: text
    # morzer wants a default for every parameter it doesn't ask for at init,
    # so a comment, which client-config skips, that shows the line's form.
    default: "# One relay per line, as its relay-entry task prints it: <host> <site> <public key> <short id> <encryption>"
    description: "The dotdash-relay machines devices also reach this server through, one \"<host> <site> <public key> <short id> <encryption> [own-site]\" line per relay, as a relay's relay-entry task prints it, ending with own-site <xhttp path> and kcp=<port>,<header>,<seed>[,<open>] where the relay serves them (the <open> field names its mKCP opener, quic, when it runs one), and cdn=<host>[,<host>] for local CDNs in front of its own site; client-config and the subscriptions add a link through each, and client-config the subscription URL through each own-site relay"
    services: [subscription]
  cdn_hosts:
    type: string
    default: none
    description: "Local CDN names devices reach this server through, comma-separated, each fronting https://<domain> as its origin; client-config and the subscriptions add an XHTTP link through each, shaped for such CDNs: packet-up, uploads by GET with the data in headers. none for none"
    services: [subscription]
  pools:
    type: text
    default: "# One pool per line: <pool> <device name, relay host or CDN host>..."
    description: "Pools against a leaked device giving away every entry point, one \"<pool> <member>...\" line per pool, the members device names from vless_clients, relay hosts and CDN hosts; client-config and the subscriptions give a device in a pool its pools' relays and CDN hosts and those in no pool, and a device in none all of them"
    services: [subscription]
  subscription:
    type: bool
    default: false
    description: "Serve each device a subscription URL on the cover site, which client-config prints: its links, which the app refreshes, so a revocation or a key rotation reaches it without resending links. A URL is as secret as the links"
    services: [subscription]
  site_dir:
    type: string
    default: /srv/dotdash
    description: "Host directory of your own cover site, served in place of the bundled page; files must be readable by uid 65532"
    services: [caddy]
  log_level:
    type: enum
    values: [debug, info, warning, error, none]
    default: error
    description: "Xray error-log verbosity; the access log is always off. warning and below name the destinations of failed connections, so keep them for debugging"
    services: [xray, gate]
  probe_url:
    type: string
    default: https://www.gstatic.com/generate_204
    description: URL the egress health check fetches through Xray and the upstreams, and the gate probes each upstreams line with every 30 s; any 2xx is healthy
    services: [xray, gate]

images:
  # hooks/policy reads the rendered config with it, run with no network, so
  # the host needs no jq of its own.
  jq: ghcr.io/jqlang/jq:1.8.1@sha256:4f34c6d23f4b1372ac789752cc955dc67c2ae177eb1b5860b75cdc5091ce6f91
  xray: ghcr.io/morzecrew/xray:26.11.9@sha256:9d6c0112c03e921a786f9cbaf2efd65e89bf0bbd7027015b81abb535c58a2d19
  caddy: docker.io/library/caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
  # The openvpn profile's OpenVPN client, whose kill switch drops the default
  # routes before anything runs (platform-images, images/openvpn).
  openvpn: ghcr.io/morzecrew/openvpn:2.6.20@sha256:12a7d3fe60c726d15c04f500fc1ad5696bc7e8a1ce0bfc41962267d1e2f31276

# Xray's config. Morzer renders one file Compose can mount (<etc>/application.yaml);
# its content is JSON, which is also YAML. Secrets are not in it: it holds
# {"$file": ...} references the image resolves at start.
configuration:
  - template: templates/xray.json.tmpl
    target: /etc/dotdash/application.yaml
    mode: "0644"
  - template: templates/gate.json.tmpl
    target: /etc/dotdash/gate.json
    mode: "0644"
  # The gate's pin and aliases, for its image's $upstreams: an env file rather
  # than a mounted one, so a change re-creates the gate, as Compose hashes a
  # service's environment and never a mounted file's contents.
  - template: templates/gate.env.tmpl
    target: /etc/dotdash/gate.env
    mode: "0644"
  # Rendered under every profile; only the openvpn profile mounts it.
  - template: templates/vpn-socks.json.tmpl
    target: /etc/dotdash/vpn-socks.json
    mode: "0644"

secrets:
  source: /etc/dotdash/secrets.sops.yaml
  render_to: /run/dotdash/secrets
  schema: secrets.schema.yaml

operations:
  smoke_test:
    kind: hook
    command: ["hooks/smoke-test"]
    timeout: 2m

# What an authority's desired-state document may set here (morzer 0.16): the
# devices and the keys every server shares, which the authority makes once,
# and the lists it derives from the other machines' facts. Not the upstreams
# or anything else this machine alone knows. None of these reaches a command
# line or a hook.
managed:
  parameters: [servers, relays, cdn_hosts, pools, subscription]
  secrets: [vless_clients, reality_key, vless_seed, reality_short_id, xhttp_path, kcp_seed, subscription_key]

# What this machine tells the authority it follows, after every change, when
# sync.recipient is set: the facts task's JSON.
published:
  task: facts

tasks:
  client-config:
    description: "Print client settings, for every client or the one named after --: a link per transport and an Xray config; with subscriptions on, the URL alone unless --full (output is credentials)"
    service: client-config
    command: ["sh", "/task/client-config.sh"]
    args: true
    timeout: 1m
  exit-check:
    description: "Print the IPv4 and IPv6 exits the upstream leaves from, with their network (ASN) and country, and whether they match; changes nothing"
    service: exit-check
    command: ["sh", "/task/exit-check.sh"]
    args: true
    timeout: 2m
  canary-config:
    description: "Print the init command and secrets for a dotdash-canary machine acting as the client named after -- (output is credentials)"
    service: client-config
    command: ["sh", "/task/canary-config.sh"]
    args: true
    timeout: 1m
  wireguard-line:
    description: "Print the upstreams line for a WireGuard exit from its wg-quick file, given as --input conf=<file> (output is its private key)"
    service: client-config
    command: ["sh", "/task/wireguard-line.sh", "{inputs.conf}"]
    inputs:
      conf:
        description: The WireGuard exit's wg-quick client config, as a provider or router exports it
        max_size: 64KiB
    timeout: 1m
  openvpn-line:
    description: "Print the upstreams line for an OpenVPN exit from its client config, given as --input conf=<file>, keys and any login inline (output is its keys)"
    service: client-config
    command: ["sh", "/task/openvpn-line.sh", "{inputs.conf}"]
    inputs:
      conf:
        description: The OpenVPN exit's client config, as a provider or router exports it
        max_size: 64KiB
    timeout: 1m
  facts:
    description: "Print this server's facts as JSON, which morzer publishes to the authority it follows: its domain and ports, the REALITY public key and the VLESS encryption string; no credentials"
    service: client-config
    command: ["sh", "/task/facts.sh"]
    timeout: 1m
  relay-config:
    description: "Print the init command and secrets for a dotdash-relay machine carrying devices on to this server as the client named after -- (output is every device's credentials)"
    service: client-config
    command: ["sh", "/task/relay-config.sh"]
    args: true
    timeout: 1m

health:
  checks:
    # egress fetches probe_url through Xray and the upstream, so healthy
    # means the whole way out works, not that a process is up; failing, it
    # names the layer (the upstream's address, its credentials, the
    # destination, the exit). `doctor` fails while either check does.
    - {name: cover-site, type: command, command: ["hooks/healthy", "cover-site"], timeout: 10s}
    - {name: egress, type: command, command: ["hooks/healthy", "egress"], timeout: 30s}

# The release's invariants (hooks/policy), against what runs: `doctor` fails
# when they drift. smoke_test checks them after every apply and update.
preflight:
  policy:
    description: traffic leaves through the upstream only, and nothing is published or privileged beyond the release's own
    command: [hooks/policy]
    fatal: true
    timeout: 1m
    remedy: re-render with `morzer apply`, and look at what changed /etc/dotdash/application.yaml or the containers

backup:
  volumes:
    # Caddy's ACME account and certificates: written whole, safe to copy live.
    caddy_data: {consistency: hot}

retention:
  releases: 3
  backups: 3
