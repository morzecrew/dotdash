# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-manifest.json
api_version: selfhost/v1alpha1
kind: application-release

metadata:
  name: dotdash
  # Stamped by `morzer release build --version X`, together with VERSION.
  version: 0.0.0
  description: Xray with REALITY in front of a Caddy cover site, an optional DNS tunnel, egressing through an upstream proxy
  vendor: morzecrew
  release_notes: RELEASE.md

providers:
  runtime: {name: compose}
  secrets: {name: sops-age}
  health: {name: http}

runtimes:
  compose:
    files:
      - compose/compose.yaml
    profiles:
      # The DNS tunnel on UDP/53, which also needs xdns_domain.
      xdns: [compose/xdns.yaml]
      # VLESS over XHTTP with REALITY on xhttp_reality_port, beside the two
      # transports every install has.
      xhttp-reality: [compose/xhttp-reality.yaml]
      # An OpenVPN client (vpn), with a tunnel for each openvpn:// line of the
      # upstreams secret, and a SOCKS hop in its namespace (vpn-socks), which
      # the gate dials for them: Xray has no OpenVPN of its own.
      openvpn: [compose/openvpn.yaml]
      # A container (warm) that keeps connections to the proxies of the
      # upstreams lines tagged warm=<n> open and logged in, which the gate
      # dials for those lines: a new connection skips the proxy's handshake.
      warm: [compose/warm.yaml]
      # VLESS over mKCP on kcp_port: UDP, no TLS underneath, its packets
      # encrypted under kcp_seed and dressed in a kcp_header.
      mkcp: [compose/mkcp.yaml]
      # Hysteria2 on hysteria2_port (UDP, 443 by default): QUIC under the
      # site's own certificate, each device's UUID its login, a probe
      # answered by the cover site over HTTP/3.
      hysteria2: [compose/hysteria2.yaml]
      # Traffic per inbound and outbound, and the gate's verdicts on its
      # upstreams, into the node exporter's textfile directory.
      metrics: [compose/metrics.yaml]
      # The bytes each device moves, in the facts the manager reads hourly,
      # which flags a device moving far more than usual: a leaked link.
      device-traffic: [compose/device-traffic.yaml]
      # An OpenFlux exit per device listed in openflux_channels, which that
      # device's OpenFlux app reaches over a carrier, a room or call on a
      # service a restricted network still lets through: the way in left when
      # nothing else gets through. Its connections leave through the gate.
      openflux: [compose/openflux.yaml]
    # installation.profile=xdns,xhttp-reality runs both; any of them with
    # openvpn, such as xdns,openvpn, adds the OpenVPN tunnels; warm and metrics
    # go with any.
    combinable: [xdns, xhttp-reality, openvpn, mkcp, hysteria2, metrics, warm, device-traffic, openflux]
    options:
      project: dotdash

compatibility:
  # The manager this bundle is verified and rehearsed with, and the first that
  # checks requirements.ports by address, protocol and profile, and lets
  # listen default to empty.
  min_manager_version: "0.18.0"
  # 0.7.0 alone declared false (0.4.0 before it): it renamed healthcheck_* to
  # probe_* and replaced the upstream settings with the upstreams secret, and
  # an update retires the old values, so 0.6.x would come back without them.
  # Going back from a later release to 0.7.0 or after loses nothing. An update
  # from 0.6.x straight to a later one is still refused until `upstreams` is
  # set.
  rollback_safe: true
  # No database, which an unattended update needs declared.
  database: none

requirements:
  architectures: [amd64, arm64]
  tools:
    # client-config mounts the Xray image (Compose `type: image`).
    docker: ">=28.0.0"
    compose: ">=2.35.0"
  memory: 512MiB
  disk: 2GiB
  # Each on the address and protocol Compose publishes it on, and a profile's
  # only under that profile: an entry that renders empty requires nothing.
  # An empty listen is every address, as Compose reads it.
  ports:
    - "{{ .Parameters.listen }}:{{ .Parameters.http_port }}"
    - "{{ .Parameters.listen }}:{{ .Parameters.https_port }}"
    - '{{ if has "xdns" .Profiles }}{{ .Parameters.xdns_bind }}:53/udp{{ end }}'
    - '{{ if has "xhttp-reality" .Profiles }}{{ .Parameters.xhttp_reality_port }}{{ end }}'
    - '{{ if has "mkcp" .Profiles }}{{ .Parameters.kcp_port }}/udp{{ end }}'
    - '{{ if has "hysteria2" .Profiles }}{{ .Parameters.hysteria2_port }}/udp{{ end }}'

parameters:
  https_port:
    type: port
    default: 443
    description: "Host port of the REALITY inbound, published at listen; anything without its key reaches the cover site. Devices, relays and the canary dial it too, unless entry_port names another"
    services: [gate, subscription]
  http_port:
    type: port
    default: 80
    description: "Host port of Caddy's plain HTTP, published at listen: the ACME HTTP-01 check under cert_issuer=acme, and the redirect to HTTPS. Behind a web server of your own on this machine, a spare port it forwards this domain's HTTP to; under cert_issuer=acme-dns nothing needs it"
    services: [caddy]
  listen:
    type: string
    default: ""
    description: "Host address https_port and http_port are published on: empty for every address, IPv4 and IPv6; 0.0.0.0 for every IPv4 address alone; 127.0.0.1 behind a web server of your own on this machine that holds 443 and passes this domain's TLS connections through untouched, with spare https_port and http_port and entry_port=443"
    services: [gate, caddy]
  entry_port:
    type: string
    default: none
    description: "The port devices, relays and the canary dial REALITY on, when it isn't https_port: 443 behind a web server of your own that passes this domain through to https_port; none for https_port"
    services: [subscription]
  upstream_mode:
    type: enum
    values: [failover, fastest, balance]
    default: failover
    description: "How the lines of the upstreams secret share the traffic. failover: the first line while it answers, then the fastest of the rest, so the exit stays put; fastest: whichever answers fastest; balance: connections spread over every line that answers, each possibly from another IP. Each line is probed at probe_url every 10 s"
    services: [gate]
  upstream_pin:
    type: string
    default: none
    description: "The name= of an upstreams line that goes first whatever its place, with the others behind it as upstream_mode has them, or none; under ipv6=separate a second name, comma-separated, pins the IPv6 group"
    services: [gate]
  upstream_udp:
    type: bool
    default: false
    description: "Carry client UDP through the upstreams. Every line must carry it: a WireGuard or OpenVPN line, or SOCKS5 with UDP ASSOCIATE; an HTTP proxy drops it. Otherwise UDP is dropped here"
    services: [xray, gate]
  probe6_url:
    type: string
    default: http://api6.ipify.org
    description: "With ipv6=separate, a URL with an IPv6 address only, which the egress health check also fetches, through the IPv6 lines; any 2xx is healthy"
  xdns_domain:
    type: string
    default: t
    description: Zone delegated to this server for the DNS tunnel (xdns profile); a name with no dot is taken under the domain, so t is t.example.com
    services: [xray, subscription]
  xdns_bind:
    type: string
    default: 0.0.0.0
    description: Host address UDP/53 is published on for the DNS tunnel
    services: [gate]
  xhttp_reality_port:
    type: port
    default: 8443
    description: "Host TCP port of XHTTP with REALITY (the xhttp-reality profile); must differ from https_port and http_port"
    services: [gate, subscription]
  kcp_port:
    type: port
    default: 8447
    description: "Host UDP port of VLESS over mKCP (the mkcp profile); must not be 53 with the DNS tunnel on"
    services: [gate, subscription]
  kcp_header:
    type: enum
    values: [none, dtls, srtp, utp, wechat, wireguard]
    default: dtls
    description: "What mKCP's packets start with, to pass for another protocol (the mkcp profile): dtls a DTLS 1.2 record header, as WebRTC and VPNs send; wireguard a WireGuard data header; utp, wechat, or srtp (Xray's own, which does not start as RTP does); none sends the encrypted packets bare. Devices take a change from new links or their subscription"
    services: [xray, subscription]
  kcp_open:
    type: enum
    values: [none, quic]
    default: none
    description: "An opener in front of mKCP (the mkcp profile): quic sends a QUIC-Initial-shaped packet (finalmask noise) before the flow, so a network that lets QUIC out sees the start as QUIC; none sends nothing extra. Both ends must match, so devices take a change from new links (carried as fm=) or their subscription. The opener is a fixed shape; measure it on a canary before relying on it"
    services: [xray, subscription]
  hysteria2_port:
    type: port
    default: 443
    description: "Host UDP port of Hysteria2 (the hysteria2 profile): 443, where an HTTP/3 site answers; must differ from kcp_port, and from 53 with the DNS tunnel on"
    services: [gate, subscription]
  hysteria2_up:
    type: int
    default: 0
    description: "Mbit/s Hysteria2 sends each device at whatever is lost on the way (Brutal), for a device that asks for it with its own rate; 0 keeps BBR, which backs off as TCP does. Set it to this server's uplink share per device, never more"
    services: [xray]
  metrics_textfile:
    type: string
    default: /var/lib/prometheus/node-exporter
    description: "Under the metrics profile, the node exporter's textfile directory, the one morzer's metrics.textfile names, which the exporters write dotdash-dotdash-xray.prom and dotdash-dotdash-gate.prom into; it has to exist and be writable by 65532 (sudo setfacl -m u:65532:rwx <it>)"
  xdns_mtu:
    type: int
    default: 900
    description: mKCP packet size the DNS tunnel answers with; must fit the EDNS0 size resolvers on the path advertise (1232 is common, lower it if replies are lost)
    services: [xray]
  xdns_tti:
    type: int
    default: 50
    description: "Milliseconds between the DNS tunnel's mKCP sends, on the server and in devices' configs (10 to 1000): 50 carries about three times what 200 did, with four times the queries; raise it if resolvers start refusing them"
    services: [xray, subscription]
  xdns_resolvers:
    type: string
    default: "udp://1.1.1.1:53,udp://8.8.8.8:53,udp://9.9.9.9:53"
    description: "The resolvers devices' DNS tunnel asks, comma-separated, its queries spread evenly over them: udp://, tcp:// or DoH https:// URLs. Where only the network's own resolver answers, put its address here"
    services: [subscription]
  resolve:
    type: enum
    values: [gateway, upstream]
    default: gateway
    description: "Who turns hostnames into addresses. gateway: this server, over dns_resolver, which itself goes out through the upstreams, so they see addresses only; a name resolving to a private address is blocked. upstream: the upstream proxies, which then see every hostname; not with a WireGuard or OpenVPN line, which resolves no names, nor a direct line, which would resolve them on this machine"
    services: [xray]
  ipv6:
    type: enum
    values: [allow, block, separate]
    default: allow
    description: "IPv6 destinations. allow: they leave through the upstreams like any other, which suits lines that all have IPv6. separate: through the lines marked group=ipv6, with upstream_mode applying to them alone, and never through the others. block: none leaves; names resolve to IPv4 addresses only and the upstreams are dialled over IPv4, so dual-stack sites still work; with resolve=upstream the upstream resolves names itself"
    services: [xray, gate]
  dns_resolver:
    type: string
    default: https://1.1.1.1/dns-query
    description: "The DNS-over-HTTPS server resolve=gateway asks, through the upstream; it sees the names, the upstream does not. Only https:// URLs are accepted"
    services: [xray]
  probe_expect:
    type: string
    default: ".*"
    description: "Regular expression (RE2) the response to probe_url must match. With probe_url at an IP-echo service, the upstream's exit IP anchored, such as ^203\\.0\\.113\\.7\\s*$, makes Xray unhealthy when the exit IP changes"
    services: [xray]
  cert_issuer:
    type: enum
    values: [acme, acme-dns, internal]
    default: acme
    description: "Where the site certificate comes from: acme is Let's Encrypt, over ports 80 and 443; internal is Caddy's own CA, for a machine the internet cannot reach; acme-dns is Let's Encrypt over DNS-01, handed to an acme-dns server by a CNAME, for a wildcard over the domain's parent that keeps the domain out of the certificate logs (the acme_dns secret)"
    services: [caddy]
  servers:
    type: string
    default: self
    description: "Servers with these same secrets, comma-separated; self is this one. client-config prints links for each and, with more than one, a config that uses whichever answers fastest"
    services: [subscription]
  # A server group's name: relays know it by it, and its links are named by it.
  name:
    type: string
    default: none
    description: "This server group's name, 1 to 16 lowercase letters and digits starting with a letter, the same on every server in servers: the name relays know these servers by, in the server/1 line relay-config prints them, and the one devices' links to these servers are named by in place of \"server\". Apps show it, so pick an opaque one. none for none, which relay-config refuses"
    services: [subscription]
  relays:
    type: text
    # morzer wants a default for every parameter it doesn't ask for at init,
    # so a comment, which client-config skips, that shows the line's form.
    default: "# One relay per line, as its relay-entry task prints it: relay/1 <name> <nonce> <host> <site> <public key> <short id> <encryption> ..."
    description: "The dotdash-relay machines devices also reach this server through, one line per relay, as a relay's relay-entry task prints it: \"relay/1 <name> <nonce> <host> <site> <public key> <short id> <encryption>\", then xhttp=<path> where the relay has a site of its own, kcp=<port>,<header>,<seed>[,quic], hy2=<port>, cdn=<host>[,<host>], cdnpath=<path>, origin=<host>[/<path>][,...] and cdn-only where it serves them. Each such relay is let in by an id these servers derive from relay_seed and its name and nonce, which relay-config prints it in a server/1 line, so it has no line in vless_clients; deleting its line here revokes it. The lines of the release before, \"<host> <site> <public key> <short id> <encryption> ...\", are read too, for this release, their relays let in by their clients in vless_clients as before. client-config and the subscriptions add a link through each, and client-config the subscription URL through each relay with a site of its own"
    services: [xray, subscription]
  relay_flags:
    type: text
    default: "# One relay per line: <name> [standby] [off=<path>[,<path>]] [split]"
    description: "What this server decides about each relay, by its name, one \"<name> <flag>...\" line per relay: standby, a relay devices use only when every other link fails, and don't check meanwhile; off=<path>[,<path>], the paths its canaries find blocked (reality, xhttp, mkcp, hysteria2, or cdn:<host> for one CDN in front of it), which devices then don't get through it; split, REALITY through it with its hello split, which its canaries got through only so (dotdash-manager sets off= and split). A change restarts no Xray, as an edit to relays does"
    services: [subscription]
  cdn_hosts:
    type: string
    default: none
    description: "Local CDN names devices reach this server through, comma-separated, each fronting https://<domain> as its origin; client-config and the subscriptions add an XHTTP link through each, shaped for such CDNs: packet-up, uploads by GET with the data in headers. none for none"
    services: [subscription]
  cdn_extra:
    type: text
    default: none
    description: "The XHTTP extra a CDN or a gateway in front asks for, where it asks for its own: \"<host> <JSON object>\", the object as it gives it, across lines if need be, for a host in cdn_hosts or a relay's cdn= or origin=. Links and outbounds through that host carry it in place of dotdash's own, which must suit the inbound behind it unless the gateway turns it back; one Xray refuses is left out. none for none"
    services: [subscription]
  pools:
    type: text
    default: "# One pool per line: <pool> <device name, relay host or CDN host>..."
    description: "Pools against a leaked device giving away every entry point, one \"<pool> <member>...\" line per pool, the members device names from vless_clients, relay hosts and CDN hosts; client-config and the subscriptions give a device in a pool its pools' relays and CDN hosts and those in no pool, and a device in none all of them"
    services: [subscription]
  hello_split:
    type: bool
    default: false
    description: "Split the ClientHello of devices' REALITY links to these servers into small TLS records, sent apart (Xray's tlshello fragment), in the Xray config they get (client-config --full, the subscription's JSON, dotdash-client): what gets through a box blocking the servers' name by SNI that reassembles TCP but not TLS records. Share links can't carry it. dotdash-manager sets it when a canary gets through only so; the split hello is a fingerprint of its own, so it stays off otherwise"
    services: [subscription]
  reality_second_key:
    type: bool
    default: false
    description: "Accept a second REALITY key beside reality_key, from the reality_key_second and reality_short_id_second secrets, so devices holding either get in: how a key is rotated with no device cut off (the docs' Rotating the REALITY key). Links, configs and subscriptions carry reality_key's"
    services: [xray]
  direct:
    type: bool
    default: true
    description: "Give devices links straight to the servers. false keeps every server's address out of devices' links, configs and subscriptions: devices reach the servers only through relays and CDN hosts, fetch subscriptions only through own-site relays, and get no DNS tunnel, whose zone points at a server, nor the subscriptions' title, which names the exit. A device that knew an address keeps reaching it: false hides the servers, it does not lock devices out"
    services: [subscription, exit-title]
  subscription:
    type: bool
    default: false
    description: "Serve each device a subscription URL on the cover site, which client-config prints: its links, which the app refreshes, so a revocation or a key rotation reaches it without resending links. A URL is as secret as the links"
    services: [subscription, exit-title]
  happ_routing:
    type: text
    default: none
    description: "With subscriptions on, a routing profile for Happ, as Happ's own JSON (Name, DirectSites, DirectIp, Geoipurl, Geositeurl and the rest): sent with every subscription in Happ's routing header, which adds the profile and turns it on, so the sites it lists go around the tunnel on every Happ device. Other apps ignore it; none sends none"
    services: [subscription]
  openflux_channels:
    type: text
    default: "# One device per line: <device> <kind>[=<link>] ..."
    description: "Under the openflux profile, the devices that get an OpenFlux channel, one \"<device> <kind>[=<link>] ...\" line each: a vless_clients name or UUID, then the kinds of carrier, one session over all of them. co makes its own rooms when given no link, and tm its own call with call_provider and call_token. Each channel is an exit of its own, 20-70 MiB; the openflux-link task prints its link for the device's OpenFlux app. \"#\" starts a comment"
    services: [openflux]
  call_provider:
    type: enum
    values: [none, tm]
    default: none
    description: "Under the openflux profile, whose API makes a call for a bare tm in openflux_channels, with the call_token secret; none: tm needs a link"
    services: [openflux]
  exit_ipv4_url:
    type: string
    default: http://api4.ipify.org
    description: "With subscription, what the subscriptions' title asks for this server's IPv4 exit, through the upstreams every ten minutes: a plain-HTTP URL that answers with the caller's address alone. The apps that show a subscription's name (Happ, Hiddify) then show the exit, after its country's flag, in place of the domain"
    services: [xray, exit-title]
  exit_info_url:
    type: string
    default: http://ipinfo.io
    description: "With subscription, where the subscriptions' title asks <url>/<address>/country for the exit's country, whose flag goes before the address; the address alone when it gives none. Plain HTTP"
    services: [xray, exit-title]
  cover:
    type: string
    default: pages
    description: "What the cover site serves past your own files in /srv/dotdash (readable by uid 65532): pages, the bundled page; or your app's URL, http://cover-app:8080 for a container on the network dotdash_edge or http://host.docker.internal:8080 for one published on the host, which gets every request but a subscription's and XHTTP's"
    services: [caddy]
  tcp_congestion:
    type: enum
    values: [bbr, cubic]
    default: bbr
    description: "TCP congestion control toward devices, in the gate's own namespace: bbr keeps its pace through a lossy last mile (6-50 times cubic's speed in the lab under 1.5-2% loss); cubic for a kernel without tcp_bbr, where bbr fails the apply and morzer rolls it back"
    services: [gate]
  log_level:
    type: enum
    values: [debug, info, warning, error, none]
    default: error
    description: "Xray error-log verbosity; the access log is always off. warning and below name the destinations of failed connections, so keep them for debugging"
    services: [xray, gate]
  probe_url:
    type: string
    default: https://www.gstatic.com/generate_204
    description: URL the egress health check fetches through Xray and the upstreams, and the gate probes each upstreams line with every 10 s; any 2xx is healthy
    services: [xray, gate]

images:
  # hooks/policy reads the rendered config with it, run with no network, so
  # the host needs no jq of its own.
  jq: ghcr.io/jqlang/jq:1.8.2@sha256:b9c68867e5766576263a222e91db3de422d802069c7af70440e667a95344e486
  xray: ghcr.io/morzecrew/xray:26.11.9@sha256:0105eea74fbd5a8227619b7a220ee0a493a5799065bf54ea2b8b7a3c824eed30
  # Upstream's Caddy with the acme-dns DNS module, for cert_issuer=acme-dns;
  # otherwise as upstream's image, whose shell the tasks also use.
  caddy: ghcr.io/morzecrew/caddy-acmedns:2.11.9@sha256:ade990affb797eb565007e52fc6fe3d34deed0d9300d1b3f4153643299a0de4c
  # The openvpn profile's OpenVPN client, whose kill switch drops the default
  # routes before anything runs (platform-images, images/openvpn).
  openvpn: ghcr.io/morzecrew/openvpn:2.6.23@sha256:fc453525119ed714e3910d8f09691defcf7c9d11bf888c955fd7016eb7d9ef92
  # The warm profile's keeper of ready connections to the upstreams' proxies
  # (platform-images, images/proxy-warm).
  warm: ghcr.io/morzecrew/proxy-warm:0.1.1@sha256:3d116030cc278e48f92c3b52c5918d0888278a3526e3ef868e09cf6d763769cb
  # The openflux profile's exits, OpenFlux's core built from a release tag's
  # source, its exit's UDP kept behind its upstream proxy (platform-images,
  # images/openflux).
  openflux: ghcr.io/morzecrew/openflux:0.17.1@sha256:12abf728095ef3a0549d3e6de3939bc662737631cbb0e0a8c9cb05ab0edd5ab6

# Xray's config. Morzer renders one file Compose can mount (<etc>/application.yaml);
# its content is JSON, which is also YAML. Secrets are not in it: it holds
# {"$file": ...} references the image resolves at start.
configuration:
  - template: templates/xray.json.tmpl
    target: /etc/dotdash/application.yaml
    mode: "0644"
  - template: templates/gate.json.tmpl
    target: /etc/dotdash/gate.json
    mode: "0644"
  # The gate's pin and aliases, for its image's $upstreams: an env file rather
  # than a mounted one, so a change re-creates the gate, as Compose hashes a
  # service's environment and never a mounted file's contents.
  # Caddy's site names: the wildcard under cert_issuer=acme-dns.
  - template: templates/caddy.env.tmpl
    target: /etc/dotdash/caddy.env
    mode: "0644"
  - template: templates/gate.env.tmpl
    target: /etc/dotdash/gate.env
    mode: "0644"
  # Rendered under every profile; only the openvpn profile mounts it.
  - template: templates/vpn-socks.json.tmpl
    target: /etc/dotdash/vpn-socks.json
    mode: "0644"

secrets:
  source: /etc/dotdash/secrets.sops.yaml
  render_to: /run/dotdash/secrets
  schema: secrets.schema.yaml

operations:
  smoke_test:
    kind: hook
    command: ["hooks/smoke-test"]
    timeout: 2m

# What an authority's desired-state document may set here (morzer 0.16): the
# devices and the keys every server shares, which the authority makes once,
# and the lists it derives from the other machines' facts, the split hello
# from its canaries' included. Not the upstreams or anything else this
# machine alone knows. None of these reaches a command line or a hook.
managed:
  parameters: [servers, name, relays, relay_flags, cdn_hosts, cdn_extra, pools, subscription, direct, reality_second_key, hello_split]
  secrets: [vless_clients, reality_key, vless_seed, reality_short_id, xhttp_path, kcp_seed, subscription_key, relay_seed, reality_key_second, reality_short_id_second]

# What this machine tells the authority it follows, after every change, when
# sync.recipient is set: the facts task's JSON.
published:
  task: facts
  # Run again before every fleet publish, hourly, so the device-traffic
  # profile's counts are an hour old at most; without it the facts are
  # the same each time and stay as they are. One task operation an hour
  # in the journal and the attestations (retention.attestations).
  refresh: publish

tasks:
  client-config:
    description: "Print client settings, for every client or the one named after --: links and an Xray config; with subscriptions on, the URL unless --full; --relay <relay>, its own alone (output is credentials)"
    service: client-config
    command: ["sh", "/task/client-config.sh"]
    args: true
    timeout: 1m
  exit-check:
    description: "Print the IPv4 and IPv6 exits the upstream leaves from, with their network (ASN) and country, and whether they match; changes nothing"
    service: exit-check
    command: ["sh", "/task/exit-check.sh"]
    args: true
    timeout: 2m
  cdn-check:
    description: "For each CDN in front of this server and its relays (cdn_hosts, cdn=, origin=): does it refuse subscriptions, and does its links' path reach Xray, the site's 404 or nothing; changes nothing"
    service: cdn-check
    command: ["sh", "/task/cdn-check.sh"]
    timeout: 2m
  canary-config:
    description: "Print the init command and secrets for a dotdash-canary machine acting as the client named after -- (output is credentials)"
    service: client-config
    command: ["sh", "/task/canary-config.sh"]
    args: true
    timeout: 1m
  wireguard-line:
    description: "Print the upstreams line for a WireGuard exit from its wg-quick file, given as --input conf=<file> (output is its private key)"
    service: client-config
    command: ["sh", "/task/wireguard-line.sh", "{inputs.conf}"]
    inputs:
      conf:
        description: The WireGuard exit's wg-quick client config, as a provider or router exports it
        max_size: 64KiB
    timeout: 1m
  openvpn-line:
    description: "Print the upstreams line for an OpenVPN exit from its client config, given as --input conf=<file>, keys and any login inline (output is its keys)"
    service: client-config
    command: ["sh", "/task/openvpn-line.sh", "{inputs.conf}"]
    inputs:
      conf:
        description: The OpenVPN exit's client config, as a provider or router exports it
        max_size: 64KiB
    timeout: 1m
  openflux-link:
    description: "Print the OpenFlux link of each device with a channel under the openflux profile, or of the one named after --, for its OpenFlux app (output is credentials)"
    service: openflux-link
    command: ["sh", "/task/openflux-link.sh"]
    args: true
    timeout: 1m
  facts:
    description: "Print this server's facts as JSON, which morzer publishes to its authority: its domain and ports, REALITY public key, VLESS encryption and certificate's days left; no credentials"
    service: client-config
    command: ["sh", "/task/facts.sh"]
    timeout: 1m
  relay-config:
    description: "Print the server/1 line for the relay/1 relay named after --, for its servers secret; for an older relay, named as its client in vless_clients, its init and device copy (output is credentials)"
    service: client-config
    command: ["sh", "/task/relay-config.sh"]
    args: true
    timeout: 1m

health:
  checks:
    # egress fetches probe_url through Xray and the upstream, so healthy
    # means the whole way out works, not that a process is up; failing, it
    # names the layer (the upstream's address, its credentials, the
    # destination, the exit). `doctor` fails while any check does.
    - {name: cover-site, type: command, command: ["hooks/healthy", "cover-site"], timeout: 10s}
    - {name: egress, type: command, command: ["hooks/healthy", "egress"], timeout: 30s}
    # A relays or cdn_extra line, or a field of one, that client-config
    # would leave out fails it, by its line and field, so the change that
    # brought it is rolled back; a field it doesn't know, a name taken twice
    # or a pool member that names nothing only warns. A start period, so it
    # fails at once rather than when the operation runs out of time.
    - {name: lists, type: command, command: ["hooks/healthy", "lists"], timeout: 30s, start_period: 20s}

# The release's invariants (hooks/policy), against what runs: `doctor` fails
# when they drift. smoke_test checks them after every apply and update.
preflight:
  policy:
    description: traffic leaves through the upstream only, and nothing is published or privileged beyond the release's own
    command: [hooks/policy]
    fatal: true
    timeout: 1m
    remedy: re-render with `morzer apply`, and look at what changed /etc/dotdash/application.yaml or the containers

backup:
  volumes:
    # Caddy's ACME account and certificates: written whole, safe to copy live.
    caddy_data: {consistency: hot}

retention:
  releases: 3
  backups: 3
