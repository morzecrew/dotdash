# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-manifest.json
api_version: selfhost/v1alpha1
kind: application-release

metadata:
  name: dotdash-client
  # Stamped by `morzer release build --version X`, together with VERSION.
  version: 0.0.0
  description: A dotdash client for a machine or a network, a SOCKS and HTTP proxy that goes through dotdash, from one subscription URL
  vendor: morzecrew
  release_notes: RELEASE.md

providers:
  runtime: {name: compose}
  secrets: {name: sops-age}
  health: {name: http}

runtimes:
  compose:
    files:
      - compose/compose.yaml
    profiles:
      # Every connection on this machine through dotdash, with no proxy
      # settings: TUN, as root with NET_ADMIN on the host's network.
      tun: [compose/tun.yaml]
      # When every dotdash link fails its probe, an OpenFlux client takes the
      # traffic to this device's OpenFlux exit on a dotdash server, over a
      # service the network still lets through (openflux_link). Not with tun.
      openflux: [compose/openflux.yaml]
    options:
      project: dotdash-client

configuration:
  - template: templates/config.json.tmpl
    target: /etc/dotdash-client/config.json
    mode: "0644"
  - template: templates/subscription.json.tmpl
    target: /etc/dotdash-client/subscription.json
    mode: "0644"
  # Rendered under every profile, as the base files are; only the tun
  # profile mounts it.
  - template: templates/resolv.conf.tmpl
    target: /etc/dotdash-client/resolv.conf
    mode: "0644"

secrets:
  source: /etc/dotdash-client/secrets.sops.yaml
  render_to: /run/dotdash-client/secrets
  schema: secrets.schema.yaml

compatibility:
  # The manager this bundle is verified and rehearsed with.
  min_manager_version: "0.17.0"
  rollback_safe: true
  # No database, which an unattended update needs declared.
  database: none

requirements:
  architectures: [amd64, arm64]
  tools:
    docker: ">=28.0.0"
    compose: ">=2.35.0"
  memory: 256MiB
  disk: 512MiB
  ports: ["{{ .Parameters.port }}"]

parameters:
  listen:
    type: string
    default: 127.0.0.1
    description: "The address the proxy port is published on: 127.0.0.1 for this machine alone; anything else, such as 0.0.0.0 for the network, and devices need proxy_user and the proxy_password secret"
    services: [xray]
  port:
    type: port
    default: 7890
    description: The SOCKS5 and HTTP proxy port, both on one
    services: [xray]
  proxy_user:
    type: string
    default: dotdash
    description: The username devices give, with the proxy_password secret, when listen is not 127.0.0.1
    services: [xray]
  subscription_interval:
    type: int
    default: 3600
    description: Seconds between fetches of the subscription, through dotdash where it gets through and directly otherwise
    services: [xray]
  gateway:
    type: bool
    default: false
    description: "Under the tun profile, this machine is its LAN's gateway: doctor then checks that the host forwards LAN traffic into TUN, which Docker's FORWARD policy DROP blocks until two DOCKER-USER rules accept it"
    services: [xray]
  dns_listen:
    type: string
    default: none
    description: "Under the tun profile, the address and port Xray answers DNS on for the LAN, such as 192.168.1.10:53, with the same fake addresses; none for none. 0.0.0.0:53 clashes with systemd-resolved's stub"
    services: [xray]
  dns_server:
    type: string
    default: 1.1.1.1
    description: "Under the tun profile, the DNS server asked directly, around dotdash, for the addresses of dotdash's servers, of what direct rules send around it, and of .lan, .local and .home.arpa names; your router's address answers the LAN's own names, and works where public resolvers don't"
    services: [xray]
  # morzer wants a default for every parameter it doesn't ask for at init:
  # a comment, which the templates skip, showing a rule's form.
  block_rules:
    type: text
    default: "# One rule per line, without its target, such as DOMAIN-SUFFIX,ads.example"
    description: "Destinations refused, one rule per line without its target, such as DOMAIN-SUFFIX,example.com: DOMAIN, DOMAIN-SUFFIX, DOMAIN-KEYWORD, DOMAIN-REGEX, GEOSITE, IP-CIDR, IP-CIDR6, GEOIP or DST-PORT, an IP rule matching addresses apps give, never looked up; \"#\" starts a comment"
    services: [xray]
  proxy_rules:
    type: text
    default: "# One rule per line, without its target, such as GEOSITE,github"
    description: "Destinations sent through dotdash even when a direct rule matches them too, one rule per line without its target, of the types block_rules takes; block rules still come first; \"#\" starts a comment"
    services: [xray]
  direct_rules:
    type: text
    default: "# One rule per line, without its target, such as IP-CIDR,192.168.0.0/16"
    description: "Destinations reached directly, not through dotdash, one rule per line without its target, such as IP-CIDR,192.168.0.0/16, of the types block_rules takes; \"#\" starts a comment"
    services: [xray]
  # Empty for Xray's own: the xray image fetches a pinned one only when set.
  geoip:
    type: string
    default: ""
    description: "A geoip.dat in place of Xray's own, as \"<url> <sha256>\": fetched through dotdash once the client runs, within a minute, and kept, so later starts need no fetch. Set it first, and rules naming its lists once the log says it was fetched; empty for Xray's own"
    services: [xray]
  geosite:
    type: string
    default: ""
    description: "A geosite.dat in place of Xray's own, as \"<url> <sha256>\", fetched and kept as geoip's is; empty for Xray's own"
    services: [xray]
  ipv6:
    type: enum
    values: [allow, block]
    default: allow
    description: "IPv6 destinations. allow: through dotdash like the rest. block: refused before any other rule, a direct rule's included, so apps fall back to IPv4; under tun it is still taken in, so nothing leaves around dotdash"
    services: [xray]
  probe_url:
    type: string
    default: https://www.gstatic.com/generate_204
    description: What picking the fastest link and the health check fetch through dotdash; any 2xx is healthy
    services: [xray]
  cdn:
    type: enum
    values: [use, skip]
    default: use
    description: "Links through a CDN. use: like any other link. skip: never picked nor probed. A relay's CDN links are told apart from 0.13.0 dotdash servers on. Only a subscription with nothing else still sends traffic to one: what the balancer can't place goes to the first link, and servers list CDN links last"
    services: [xray]

images:
  # The tun profile's kill switch, and its cleanup under the base files
  # (killswitch/killswitch.sh): iproute2's ip and nft in an Alpine shell,
  # which the OpenVPN image carries; busybox's ip has no
  # suppress_prefixlength and no oif rules.
  killswitch: ghcr.io/morzecrew/openvpn:2.6.23@sha256:fc453525119ed714e3910d8f09691defcf7c9d11bf888c955fd7016eb7d9ef92
  # The proxy-config task's shell; Xray's image has none.
  busybox: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
  xray: ghcr.io/morzecrew/xray:26.11.9@sha256:0105eea74fbd5a8227619b7a220ee0a493a5799065bf54ea2b8b7a3c824eed30
  # The openflux profile's client (platform-images, images/openflux).
  openflux: ghcr.io/morzecrew/openflux:0.17.1@sha256:12abf728095ef3a0549d3e6de3939bc662737631cbb0e0a8c9cb05ab0edd5ab6

# What an authority's desired-state document may set here (morzer 0.16): the
# device's subscription, the password of its local proxy, and its OpenFlux
# link. None reaches a command line or a hook.
managed:
  secrets: [subscription_url, proxy_password, openflux_link]

tasks:
  proxy-config:
    description: "Print the SOCKS5 and HTTP proxy settings devices need, with proxy_user and proxy_password once listen is not 127.0.0.1; argument: the address devices reach this machine at (output is a credential)"
    service: proxy-config
    command: ["sh", "/task/proxy-config.sh"]
    args: true
    timeout: 1m

health:
  checks:
    # Fetches probe_url through dotdash, up to three tries. `doctor` runs it
    # too, and fails, so a notify target hears when this machine cannot get
    # out through dotdash.
    - {name: through-dotdash, type: command, command: ["hooks/healthy"], timeout: 2m}
    # With gateway on: TUN is up, the host forwards, and nothing in its
    # firewall drops LAN traffic on the way into TUN.
    - {name: gateway, type: command, command: ["hooks/gateway"], timeout: 10s}
    # Under the tun profile, the kill switch's rules are in place.
    - {name: killswitch, type: command, command: ["hooks/killswitch"], timeout: 10s}

retention:
  releases: 3
  backups: 3
