# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-manifest.json
api_version: selfhost/v1alpha1
kind: application-release

metadata:
  name: dotdash-client
  # Stamped by `morzer release build --version X`, together with VERSION.
  version: 0.0.0
  description: A dotdash client for a machine or a network, a SOCKS and HTTP proxy that goes through dotdash, from one subscription URL
  vendor: morzecrew
  release_notes: RELEASE.md

providers:
  runtime: {name: compose}
  secrets: {name: sops-age}
  health: {name: http}

runtimes:
  compose:
    files:
      - compose/compose.yaml
    profiles:
      # Every connection on this machine through dotdash, with no proxy
      # settings: TUN, as root with NET_ADMIN on the host's network.
      tun: [compose/tun.yaml]
    options:
      project: dotdash-client

configuration:
  - template: templates/config.json.tmpl
    target: /etc/dotdash-client/config.json
    mode: "0644"
  # Rendered under every profile, since templates can't see which is on; only
  # the tun profile mounts it.
  - template: templates/config-tun.json.tmpl
    target: /etc/dotdash-client/config-tun.json
    mode: "0644"

secrets:
  source: /etc/dotdash-client/secrets.sops.yaml
  render_to: /run/dotdash-client/secrets
  schema: secrets.schema.yaml

compatibility:
  # The manager this bundle is verified and rehearsed with, and the first with
  # text parameters, which the rules are.
  min_manager_version: "0.15.0"
  rollback_safe: true
  # No database, which an unattended update needs declared.
  database: none

requirements:
  architectures: [amd64, arm64]
  tools:
    docker: ">=28.0.0"
    compose: ">=2.35.0"
  memory: 256MiB
  disk: 512MiB
  ports: ["{{ .Parameters.port }}"]

parameters:
  listen:
    type: string
    default: 127.0.0.1
    description: "The address the proxy port is published on: 127.0.0.1 for this machine alone; anything else, such as 0.0.0.0 for the network, and devices need proxy_user and the proxy_password secret"
    services: [mihomo]
  port:
    type: port
    default: 7890
    description: The SOCKS5 and HTTP proxy port, both on one
    services: [mihomo]
  proxy_user:
    type: string
    default: dotdash
    description: The username devices give, with the proxy_password secret, when listen is not 127.0.0.1
    services: [mihomo]
  subscription_interval:
    type: int
    default: 3600
    description: Seconds between fetches of the subscription, through dotdash where it gets through and directly otherwise
    services: [mihomo]
  gateway:
    type: bool
    default: false
    description: "Under the tun profile, this machine is its LAN's gateway: doctor then checks that the host forwards LAN traffic into TUN, which Docker's FORWARD policy DROP blocks until two DOCKER-USER rules accept it"
    services: [mihomo]
  dns_listen:
    type: string
    default: "off"
    description: "Under the tun profile, the address and port mihomo answers DNS on for the LAN, such as 192.168.1.10:53, with the same fake addresses; off for none. 0.0.0.0:53 clashes with systemd-resolved's stub"
    services: [mihomo]
  # morzer wants a default for every parameter it doesn't ask for at init:
  # a comment, which the templates skip, showing a rule's form.
  block_rules:
    type: text
    default: "# One rule per line, without its target, such as DOMAIN-SUFFIX,ads.example"
    description: "Destinations refused, one mihomo classical rule per line without its target, such as DOMAIN-SUFFIX,example.com; \"#\" starts a comment"
    services: [mihomo]
  direct_rules:
    type: text
    default: "# One rule per line, without its target, such as IP-CIDR,192.168.0.0/16,no-resolve"
    description: "Destinations reached directly, not through dotdash, one mihomo classical rule per line without its target, such as IP-CIDR,192.168.0.0/16,no-resolve; \"#\" starts a comment"
    services: [mihomo]
  ipv6:
    type: enum
    values: [allow, block]
    default: allow
    description: "IPv6 destinations. allow: through dotdash like the rest. block: refused before any other rule, a direct rule's included, so apps fall back to IPv4; under tun it is still taken in, so nothing leaves around dotdash"
    services: [mihomo]
  probe_url:
    type: string
    default: https://www.gstatic.com/generate_204
    description: What picking the fastest link and the health check fetch through dotdash; any 2xx is healthy
    services: [mihomo]

images:
  # The proxy-config task's shell; mihomo's image has none.
  busybox: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
  mihomo: ghcr.io/morzecrew/mihomo:1.19.33@sha256:84f6ca181df09df3605e1a4b45c94fd2920afbf7e2332d1ae367ae1e12b90b84

tasks:
  proxy-config:
    description: "Print the SOCKS5 and HTTP proxy settings devices need, with proxy_user and proxy_password once listen is not 127.0.0.1; argument: the address devices reach this machine at (output is a credential)"
    service: proxy-config
    command: ["sh", "/task/proxy-config.sh"]
    args: true
    timeout: 1m

health:
  checks:
    # Fetches probe_url through dotdash, up to three tries. `doctor` runs it
    # too, and fails, so a notify target hears when this machine cannot get
    # out through dotdash.
    - {name: through-dotdash, type: command, command: ["hooks/healthy"], timeout: 2m}
    # With gateway on: TUN is up, the host forwards, and nothing in its
    # firewall drops LAN traffic on the way into TUN.
    - {name: gateway, type: command, command: ["hooks/gateway"], timeout: 10s}

retention:
  releases: 3
  backups: 3
