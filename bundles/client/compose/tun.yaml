# The tun profile: Xray takes every connection on this machine through a TUN
# interface, so apps need no proxy settings. That needs the host's network
# and NET_ADMIN, which a process gets only as root: Docker gives a non-root
# user no effective capability. DAC_OVERRIDE lets root read the secrets and
# write the home volume and runtime directory, which are 65532's;
# NET_BIND_SERVICE lets it listen on port 53 (the resolver inbound, and
# dns_listen). Nothing else is granted: the root filesystem stays read-only
# and no-new-privileges stays on. A stop gives Xray time to take its routes
# down; after a kill they linger, harmless, pointing at an interface that is
# gone.
#
# With Xray gone, a crash or a restart on a new subscription, its TUN and
# routes go with it, and the machine's default route would carry everything
# around dotdash: the killswitch service's routing rules, which outlive Xray,
# leave nothing but Xray's own connections and the LAN reachable then
# (killswitch/killswitch.sh).

services:
  xray:
    user: "0:0"
    cap_add: [NET_ADMIN, DAC_OVERRIDE, NET_BIND_SERVICE]
    devices: ["/dev/net/tun:/dev/net/tun"]
    network_mode: host
    # On the host's network the port is the listener's own (config-tun.json).
    ports: !reset []
    volumes:
      - type: bind
        source: /etc/dotdash-client/config-tun.json
        target: /etc/xray/10-client.json
        read_only: true
        bind: {create_host_path: false}
      # Xray's own lookups go to its resolver inbound, not the host's
      # resolver, whose questions TUN takes back (config-tun.json.tmpl).
      - type: bind
        source: /etc/dotdash-client/resolv.conf
        target: /etc/resolv.conf
        read_only: true
        bind: {create_host_path: false}

  killswitch:
    image: ${DOTDASH_CLIENT_IMAGE_KILLSWITCH:?set by morzer}
    restart: unless-stopped
    # Routing rules on the host's network: root with NET_ADMIN, nothing else.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    network_mode: host
    pids_limit: 32
    mem_limit: 32m
    # Time to take the rules out on a stop.
    stop_grace_period: 10s
    logging:
      driver: local
      options: {max-size: 1m, max-file: "2"}
    entrypoint: ["sh", "/killswitch/killswitch.sh"]
    volumes:
      - ${DOTDASH_CLIENT_RELEASE_DIR:?set by morzer}/killswitch:/killswitch:ro
