# The tun profile: Xray takes every connection on this machine through a TUN
# interface, so apps need no proxy settings. That needs the host's network
# and NET_ADMIN, which a process gets only as root: Docker gives a non-root
# user no effective capability. DAC_OVERRIDE lets root read the secrets and
# write the home volume and runtime directory, which are 65532's;
# NET_BIND_SERVICE lets it listen on port 53 (the resolver inbound, and
# dns_listen). Nothing else is granted: the root filesystem stays read-only
# and no-new-privileges stays on. Group 65531 is Xray's alone: the kill
# switch sends every DNS question into TUN but that group's. A stop gives
# Xray time to take its routes down; after a kill they linger, harmless,
# pointing at an interface that is gone.
#
# With Xray gone, a crash or a restart on a new subscription, its TUN and
# routes go with it, and the machine's default route would carry everything
# around dotdash: the killswitch service's routing rules, which outlive Xray
# and the service itself, leave nothing but Xray's own connections and the
# LAN reachable then (killswitch/killswitch.sh).

services:
  xray:
    user: "0:65531"
    cap_add: [NET_ADMIN, DAC_OVERRIDE, NET_BIND_SERVICE]
    devices: ["/dev/net/tun:/dev/net/tun"]
    network_mode: host
    environment:
      # The sub port (config.json): through dotdash where a link answers,
      # and directly from Xray, outside TUN, while none does, the one way out
      # a fresh install has.
      XRAY_SUBSCRIPTION_PROXY: socks5h://127.0.0.1:7892
    # On the host's network the port is the listener's own (config.json).
    ports: !reset []
    volumes:
      # Xray's own lookups go to its resolver inbound, not the host's
      # resolver, whose questions TUN takes back (config.json.tmpl).
      - type: bind
        source: /etc/dotdash-client/resolv.conf
        target: /etc/resolv.conf
        read_only: true
        bind: {create_host_path: false}

  # The base files' killswitch service (compose.yaml), running the rules
  # rather than taking them out.
  killswitch:
    command: ["run"]
