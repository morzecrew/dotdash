# The documentation site. Every pull request that touches it builds it with
# --strict, which fails on a broken link. A push to main publishes it as the
# `dev` version on gh-pages, never the default once a release exists; released
# versions are docs-release.yml's.
name: docs-dev

on:
  pull_request:
    paths: [pages/**, CHANGELOG.md, scripts/bootstrap.sh, .github/scripts/publish-bootstrap.sh, .github/workflows/docs-*.yml]
  push:
    branches: [main]
    paths: [pages/**, CHANGELOG.md, scripts/bootstrap.sh, .github/scripts/publish-bootstrap.sh, .github/workflows/docs-*.yml]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Build the site
        working-directory: pages
        run: uv run --locked zensical build --strict

  deploy:
    needs: build
    # `dev` follows main only, so a dispatch from another branch can't
    # overwrite it.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Not docs-release.yml's group: GitHub keeps one waiting run per group, so
    # a third deploy would cancel a waiting release's. Both push to gh-pages,
    # so a push another deploy beat starts again from the branch as it is now.
    concurrency:
      group: docs-dev
      cancel-in-progress: false
    permissions:
      contents: write # mike pushes the built site to gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] mike pushes with these credentials
        with:
          fetch-depth: 0 # mike reads and updates the gh-pages branch

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Publish dev
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          retry() { for _ in 1 2 3; do git fetch -q origin gh-pages && git branch -f gh-pages origin/gh-pages && "$@" && return; sleep 10; done; return 1; }
          retry uv run --locked mike deploy --push --branch gh-pages dev
          # Until the first release publishes `latest`, main owns the root:
          # its redirect, and bootstrap.sh beside it.
          versions=$(uv run --locked mike list --branch gh-pages)
          if ! grep -q '\[latest\]' <<<"$versions"; then
            retry uv run --locked mike set-default --push --branch gh-pages dev
            retry ../.github/scripts/publish-bootstrap.sh
          fi
