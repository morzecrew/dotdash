# The client's bundle (client/, package dotdash-client) for a pull request:
# built and smoke-tested against a stand-in dotdash server, never published,
# signed with a key made in the job. The jobs are bundle-ci's.
name: client-pr

on:
  pull_request:
    paths:
      - bundles/client/**
      - .github/client-smoke.d/**
      - .github/workflows/client-*.yml

permissions: {}

concurrency:
  group: client-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle:
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@31ef658ebef55dedc7cb23184f3a38acc7b1d899 # fix/container-dns (testing; v0.10.1 replaces it)
    with:
      morzer-version: "0.15.1"
      ref: ${{ github.sha }}
      version: 0.0.0-pr.${{ github.event.pull_request.number }}
      signing: ephemeral
      # The key that signs, shipped as minisign.pub: init trusts it on first use.
      ship-pubkey: true
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      bundle-dir: bundles/client
      version-paths: bundles/client
      package: dotdash-client
      smoke-hooks: .github/client-smoke.d
      components: ""
      probe-paths: ""
      # .github/client-smoke.d/pre-apply sets the stand-in's subscription URL.
      operator-secrets: subscription_url
      # smoke-update installs the published :main first, trusting this key.
      dev-pubkey: ${{ vars.MINISIGN_DEV_PUBKEY }}
