# A pull request's bundle, built and smoke-tested, never published. It signs
# with a key made in the job: the dev and release keys are never given to a
# pull request. The jobs are bundle-ci's.
name: pr

on:
  pull_request:
    paths:
      - bundles/server/**
      - .github/smoke.d/**
      - .github/tests/**
      - .github/workflows/pr.yml
      - .github/workflows/main.yml
      - .github/workflows/release.yml

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle:
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@6360c44fecddb64b29d176ea2f935b7e8a8f6916 # v0.12.2
    with:
      morzer-version: "0.18.0"
      bundle-dir: bundles/server
      version-paths: bundles/server
      package: dotdash-server
      ref: ${{ github.sha }}
      version: 0.0.0-pr.${{ github.event.pull_request.number }}
      signing: ephemeral
      # The key that signs, shipped as minisign.pub: init trusts it on first use.
      ship-pubkey: true
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      components: ""
      probe-paths: ""
      operator-secrets: upstreams
      init-args: >-
        --domain dotdash.test --set probe_url=http://11.99.0.10:8000/
        --set cert_issuer=internal --profile xdns
      # smoke-update installs the published :main first, trusting this key.
      dev-pubkey: ${{ vars.MINISIGN_DEV_PUBKEY }}

  # client-config.sh against a matrix of parameters, in the images the bundle
  # pins, without a rig: seconds, where the smoke needs an install.
  client-config:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Registry login
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "${TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
      - name: client-config's cases
        run: bash .github/tests/client-config.sh
