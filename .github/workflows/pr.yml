# A pull request's bundle, built and smoke-tested, never published. It signs
# with a key made in the job: the dev and release keys are never given to a
# pull request. The jobs are bundle-ci's.
name: pr

on:
  pull_request:

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle:
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@dc33ba03f86a4ed2264db186f6abbf3012c9f58a # v0.10.1
    with:
      morzer-version: "0.16.0"
      bundle-dir: bundles/server
      version-paths: bundles/server
      package: dotdash-server
      ref: ${{ github.sha }}
      version: 0.0.0-pr.${{ github.event.pull_request.number }}
      signing: ephemeral
      # The key that signs, shipped as minisign.pub: init trusts it on first use.
      ship-pubkey: true
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      components: ""
      probe-paths: ""
      operator-secrets: upstream
      # healthcheck_url is the published release's name for probe_url, from
      # before 0.7.0, which smoke-update installs first; a release that does
      # not declare a --set gets it left out (smoke.sh).
      init-args: >-
        --domain dotdash.test --set upstream_protocol=http
        --set probe_url=http://11.99.0.10:8000/
        --set healthcheck_url=http://11.99.0.10:8000/
        --set cert_issuer=internal --profile xdns
      # smoke-update installs the published :main first, trusting this key.
      dev-pubkey: ${{ vars.MINISIGN_DEV_PUBKEY }}
