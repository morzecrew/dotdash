# A pull request's bundle, built and smoke-tested, never published. It signs
# with a key made in the job: the dev and release keys are never given to a
# pull request. The jobs are bundle-ci's.
name: pr

on:
  pull_request:

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle:
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@96969fd2ea37e5117f67353dae43c85c761597d0 # v0.10.0
    with:
      morzer-version: "0.15.1"
      ref: ${{ github.sha }}
      version: 0.0.0-pr.${{ github.event.pull_request.number }}
      signing: ephemeral
      # The key that signs, shipped as minisign.pub: init trusts it on first use.
      ship-pubkey: true
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      components: ""
      probe-paths: ""
      operator-secrets: upstream
      # upstream_host and upstream_port are the published release's, from
      # before the upstream secret, which smoke-update installs first; a
      # release that does not declare them gets them left out (smoke.sh).
      init-args: >-
        --domain dotdash.test --set upstream_host=upstream.rig.invalid
        --set upstream_port=18080 --set upstream_protocol=http
        --set healthcheck_url=http://11.99.0.10:8000/ --set cert_issuer=internal
        --profile xdns
      # smoke-update installs the published :main first, trusting this key.
      dev-pubkey: ${{ vars.MINISIGN_DEV_PUBKEY }}
