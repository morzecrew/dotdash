# A pull request's bundles, each it touches built and smoke-tested
# (_bundle.yml), never published. Each signs with a key made in the job: the
# dev and release keys are never given to a pull request. The jobs are
# bundle-ci's.
name: pr

on:
  pull_request:
    paths:
      - bundles/**
      - .github/*smoke.d/**
      - .github/tests/**
      - .github/workflows/pr.yml
      - .github/workflows/main.yml
      - .github/workflows/_bundle.yml
      - .github/workflows/_main.yml
      - .github/workflows/*release.yml

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The bundles the pull request touches, as each bundle's own workflow once
  # chose them: bundles/<bundle>/, its smoke hooks and its release workflow;
  # the server's also client-config's cases and the client smoke's stand-in,
  # which they hold to client-config's output; every bundle the workflows
  # they share.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bundles: ${{ steps.changes.outputs.bundles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        run: |
          set -euo pipefail
          all="server relay client canary acme-dns"
          # The merge commit's first parent is the base branch.
          names=$(git diff --name-only HEAD^1 HEAD | while read -r f; do
            case ${f} in
            bundles/*/*) f=${f#bundles/} && echo "${f%%/*}" ;;
            .github/smoke.d/* | .github/tests/* | .github/workflows/release.yml) echo server ;;
            .github/client-smoke.d/pre-apply/server.txt) echo server client ;;
            .github/*-smoke.d/*) f=${f#.github/} && echo "${f%%-smoke.d/*}" ;;
            .github/workflows/*-release.yml) f=${f#.github/workflows/} && echo "${f%-release.yml}" ;;
            .github/workflows/pr.yml | .github/workflows/main.yml | .github/workflows/_bundle.yml | .github/workflows/_main.yml) echo "${all}" ;;
            esac
          done)
          bundles=$(tr ' ' '\n' <<<"${names}" | jq -Rnc --arg all "${all}" '[inputs] | unique | map(select(IN($all | splits(" "))))')
          echo "bundles=${bundles}" | tee -a "${GITHUB_OUTPUT}"

  bundle:
    needs: changes
    if: needs.changes.outputs.bundles != '[]'
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJSON(needs.changes.outputs.bundles) }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_bundle.yml # zizmor: ignore[self-repository] actionlint 1.7.12 refuses $/
    with:
      bundle: ${{ matrix.bundle }}
      version: 0.0.0-pr.${{ github.event.pull_request.number }}
      signing: ephemeral
      # GitHub-hosted, never vars.RUNS_ON: a fork's pull request must not reach
      # a self-hosted runner or its image cache.
      runs-on: ubuntu-24.04

  # client-config.sh against a matrix of parameters, in the images the bundle
  # pins, without a rig: seconds, where the smoke needs an install.
  client-config:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.bundles), 'server')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Registry login
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "${TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
      - name: client-config's cases
        run: bash .github/tests/client-config.sh
