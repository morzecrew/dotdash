# REALITY and XHTTP under added latency and packet loss, in a rig on a
# GitHub-hosted runner: never on a real machine. It informs, it never gates:
# nothing requires it, and a pull request that changes the pinned images or
# Xray's config sees its figures beside the last ones from main.
#
# The rig is bundle-ci's rehearsal (rehearse.sh): it installs the published
# :main with the smoke hooks' stand-in upstream and target, then this tree's
# server bundle goes on top, and .github/bench/bench.sh measures it.
name: benchmark

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      requests:
        description: Small fetches per scenario and transport
        default: "20"
      transfers:
        description: 1 MiB transfers per scenario and transport
        default: "3"
      delays:
        description: Added delays, <ms>[:<jitter ms>], space-separated
        default: "0 100:30 250:50"
      losses:
        description: Added packet loss in percent, space-separated
        default: "0 2 5"
  pull_request:
    paths:
      - bundles/server/manifest.yaml
      - bundles/server/templates/**
      - .github/bench/**
      - .github/workflows/benchmark.yml

permissions: {}

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    # GitHub-hosted on purpose: netem needs the host's sch_netem module, which
    # a self-hosted runner may not have or let a job load.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
      # The last benchmark of main, to compare a pull request with.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: morzecrew/bundle-ci
          ref: dc33ba03f86a4ed2264db186f6abbf3012c9f58a # v0.10.1
          path: .bundle-ci
          persist-credentials: false

      # The job's token for tools.sh's GitHub release downloads, here and in
      # the rehearsal, which hands it to that one command in the rig.
      - name: Install oras, and load netem
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BIN_DIR="${RUNNER_TEMP}/bin" bash .bundle-ci/scripts/tools.sh oras
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"
          sudo modprobe sch_netem

      - name: Install dotdash in a rig
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REHEARSE_PUBKEY: ${{ vars.MINISIGN_DEV_PUBKEY }}
          REHEARSE_MORZER_VERSION: "0.16.0"
          REHEARSE_BUNDLE_DIR: bundles/server
          # The smoke hooks' pre-apply alone, for the rig's stand-in upstream
          # and target: the hooks themselves would run against the published
          # :main the rehearsal installs first, and bench.sh makes its own
          # clients. smoke-install runs every hook on this tree's bundle.
          REHEARSE_HOOKS: .bench-hooks
          REHEARSE_PROBE_PATHS: ""
          REHEARSE_OPERATOR_SECRETS: upstream
          # healthcheck_url for a published release from before 0.7.0, as in pr.yml.
          REHEARSE_INIT_ARGS: >-
            --domain dotdash.test --set upstream_protocol=http
            --set probe_url=http://11.99.0.10:8000/
            --set healthcheck_url=http://11.99.0.10:8000/
            --set cert_issuer=internal --profile xdns
        run: |
          mkdir -p .bench-hooks && cp -R .github/smoke.d/pre-apply .bench-hooks/
          # ponytail: the old package until dotdash-server:main is published;
          # drop the fallback once the dotdash package is deleted.
          from=ghcr.io/morzecrew/dotdash-server:main
          oras manifest fetch "${from}" >/dev/null 2>&1 || from=ghcr.io/morzecrew/dotdash:main
          bash .bundle-ci/scripts/rehearse.sh --from "${from}" --keep
          # The token stays out of the rest of the rig.
          GITHUB_TOKEN= bash .bundle-ci/scripts/rig.sh exec dotdash-rehearsal \
            sh -c 'bash /rig/smoke.sh update "$(ls /rig/dist/*.tar.zst | head -1)"'

      - name: Benchmark
        env:
          BENCH_REQUESTS: ${{ inputs.requests || '20' }}
          BENCH_TRANSFERS: ${{ inputs.transfers || '3' }}
          BENCH_DELAYS: ${{ inputs.delays || '0 100:30 250:50' }}
          BENCH_LOSSES: ${{ inputs.losses || '0 2 5' }}
        run: |
          bash .bundle-ci/scripts/rig.sh cp dotdash-rehearsal .github/bench/bench.sh /rig/bench.sh
          bash .bundle-ci/scripts/rig.sh exec dotdash-rehearsal env \
            BENCH_REQUESTS="${BENCH_REQUESTS}" BENCH_TRANSFERS="${BENCH_TRANSFERS}" \
            BENCH_DELAYS="${BENCH_DELAYS}" BENCH_LOSSES="${BENCH_LOSSES}" \
            bash /rig/bench.sh >"${RUNNER_TEMP}/benchmark.json"
          jq -e '.scenarios | length > 0' "${RUNNER_TEMP}/benchmark.json" >/dev/null

      - name: Summarize, beside main's last benchmark
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          baseline=
          if [ "${EVENT}" = pull_request ]; then
            run=$(gh run list -R "${GITHUB_REPOSITORY}" --workflow benchmark.yml --branch main \
              --status success --limit 1 --json databaseId -q '.[0].databaseId // empty')
            if [ -n "${run}" ] && gh run download "${run}" -R "${GITHUB_REPOSITORY}" -n benchmark \
              -D "${RUNNER_TEMP}/baseline" 2>/dev/null; then
              baseline=${RUNNER_TEMP}/baseline/benchmark.json
            fi
          fi
          bash .github/bench/summary.sh "${RUNNER_TEMP}/benchmark.json" ${baseline:+"${baseline}"} \
            >>"${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark
          path: ${{ runner.temp }}/benchmark.json
          retention-days: 90

      - name: Remove the rig
        if: always()
        run: bash .bundle-ci/scripts/rig.sh stop dotdash-rehearsal || true
