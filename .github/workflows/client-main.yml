# The client's dev channel: build, sign and smoke-test every change to bundles/client/
# on main, then publish ghcr.io/morzecrew/dotdash-client:<version> and move
# :main. The jobs are bundle-ci's.
name: client-main

on:
  push:
    branches: [main]
    paths:
      - bundles/client/**
      - .github/client-smoke.d/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: main-client
  cancel-in-progress: false

jobs:
  bundle:
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@dc33ba03f86a4ed2264db186f6abbf3012c9f58a # v0.10.1
    with:
      morzer-version: "0.15.1"
      ref: ${{ github.sha }}
      channel: main
      signing: dev
      # The key that signs, shipped as minisign.pub: init trusts it on first use.
      ship-pubkey: true
      # Nothing moved since the last run: the version is already published.
      on-existing: skip
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      bundle-dir: bundles/client
      version-paths: bundles/client
      package: dotdash-client
      smoke-hooks: .github/client-smoke.d
      components: ""
      probe-paths: ""
      # .github/client-smoke.d/pre-apply sets the stand-in's subscription URL.
      operator-secrets: subscription_url
      dev-pubkey: ${{ vars.MINISIGN_DEV_PUBKEY }}
    secrets:
      minisign-key: ${{ secrets.MINISIGN_DEV_KEY }}

  publish:
    needs: bundle
    if: needs.bundle.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: write
      # The provenance publish.yml attests for the bundle.
      id-token: write
      attestations: write
    uses: morzecrew/bundle-ci/.github/workflows/publish.yml@dc33ba03f86a4ed2264db186f6abbf3012c9f58a # v0.10.1
    with:
      version: ${{ needs.bundle.outputs.version }}
      archive: ${{ needs.bundle.outputs.archive }}
      channel: main
      package: dotdash-client
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
