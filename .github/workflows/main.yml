# The dev channel: build, sign and smoke-test every change to the bundle on
# main, then publish `:<version>` and move `:main`. The jobs are
# bundle-ci's; this file says when they run and what they may do. dotdash
# pins third-party images in its manifest, so nothing here pins components.
name: main

on:
  push:
    branches: [main]
    paths:
      - bundles/server/**
      - .github/smoke.d/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: main-bundle
  cancel-in-progress: false

jobs:
  bundle:
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@759760aded983198badd37208339f6a50dc55930 # v0.11.0
    with:
      morzer-version: "0.17.0"
      bundle-dir: bundles/server
      version-paths: bundles/server
      package: dotdash-server
      ref: ${{ github.sha }}
      channel: main
      signing: dev
      # The key that signs, shipped as minisign.pub: init trusts it on first use.
      ship-pubkey: true
      # Nothing moved since the last run: the version is already published.
      on-existing: skip
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      components: ""
      probe-paths: ""
      # upstream is the published release's, which smoke-update installs first.
      operator-secrets: upstreams upstream
      # What init refuses without; .github/smoke.d/pre-apply supplies the rest.
      # healthcheck_url is the published release's name for probe_url, from
      # before 0.7.0, which smoke-update installs first; a release that does
      # not declare a --set gets it left out (smoke.sh).
      init-args: >-
        --domain dotdash.test --set upstream_protocol=http
        --set probe_url=http://11.99.0.10:8000/
        --set healthcheck_url=http://11.99.0.10:8000/
        --set cert_issuer=internal --profile xdns
      dev-pubkey: ${{ vars.MINISIGN_DEV_PUBKEY }}
    secrets:
      minisign-key: ${{ secrets.MINISIGN_DEV_KEY }}

  publish:
    needs: bundle
    if: needs.bundle.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: write
      # The provenance publish.yml attests for the bundle.
      id-token: write
      attestations: write
    uses: morzecrew/bundle-ci/.github/workflows/publish.yml@759760aded983198badd37208339f6a50dc55930 # v0.11.0
    with:
      version: ${{ needs.bundle.outputs.version }}
      archive: ${{ needs.bundle.outputs.archive }}
      channel: main
      package: dotdash-server
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}

  # The command the docs give works on what was just published: the
  # attestation is there, signed by bundle-ci's publish workflow for this
  # commit.
  provenance:
    needs: [bundle, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Verify the published bundle's provenance
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://ghcr.io/morzecrew/dotdash-server:${VERSION}" --owner morzecrew \
            --signer-workflow morzecrew/bundle-ci/.github/workflows/publish.yml \
            --source-digest "${GITHUB_SHA}" >/dev/null
          echo "dotdash-server:${VERSION}: provenance verified"
