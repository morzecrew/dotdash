# The dev channel: build, sign and smoke-test every change to the bundle on
# main, then publish `:<version>` and move `:main`. The jobs are
# bundle-ci's; this file says when they run and what they may do. dotdash
# pins third-party images in its manifest, so nothing here pins components.
name: main

on:
  push:
    branches: [main]
    paths:
      - bundle/**
      - .github/smoke.d/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: main-bundle
  cancel-in-progress: false

jobs:
  bundle:
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@64db868a6a80495d10c9dd5e3f1ea53d60f6aa99 # v0.9.2
    with:
      morzer-version: "0.14.0"
      ref: ${{ github.sha }}
      channel: main
      signing: dev
      # Nothing moved since the last run: the version is already published.
      on-existing: skip
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      components: ""
      probe-paths: ""
      operator-secrets: upstream
      # What init refuses without; .github/smoke.d/pre-apply supplies the rest.
      # upstream_host and upstream_port are the published release's, from
      # before the upstream secret, which smoke-update installs first; a
      # release that does not declare them gets them left out (smoke.sh).
      init-args: >-
        --domain dotdash.test --set upstream_host=upstream.rig.invalid
        --set upstream_port=18080 --set upstream_protocol=http
        --set healthcheck_url=http://11.99.0.10:8000/ --set cert_issuer=internal
        --profile xdns
      dev-pubkey: ${{ vars.MINISIGN_DEV_PUBKEY }}
    secrets:
      minisign-key: ${{ secrets.MINISIGN_DEV_KEY }}

  publish:
    needs: bundle
    if: needs.bundle.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: write
      # The provenance publish.yml attests for the bundle.
      id-token: write
      attestations: write
    uses: morzecrew/bundle-ci/.github/workflows/publish.yml@64db868a6a80495d10c9dd5e3f1ea53d60f6aa99 # v0.9.2
    with:
      version: ${{ needs.bundle.outputs.version }}
      archive: ${{ needs.bundle.outputs.archive }}
      channel: main
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}

  # The command the README gives works on what was just published: the
  # attestation is there, signed by bundle-ci's publish workflow for this
  # commit.
  provenance:
    needs: [bundle, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Verify the published bundle's provenance
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://ghcr.io/morzecrew/dotdash:${VERSION}" --owner morzecrew \
            --signer-workflow morzecrew/bundle-ci/.github/workflows/publish.yml \
            --source-digest "${GITHUB_SHA}" >/dev/null
          echo "dotdash:${VERSION}: provenance verified"
