# The dev channel: build, sign and smoke-test every change to a bundle on
# main, then publish its `:<version>` and move `:main` (_main.yml, one run of
# it per bundle changed). The jobs are bundle-ci's; this file says when they
# run and what they may do.
name: main

on:
  push:
    branches: [main]
    paths:
      - bundles/**
      - .github/*smoke.d/**
  workflow_dispatch:
    inputs:
      bundle:
        description: The bundle to build and publish, or all of them
        type: choice
        options: [all, server, relay, client, canary, acme-dns]
        default: all

permissions: {}

jobs:
  # The bundles the push touched, as each bundle's own workflow once chose
  # them: bundles/<bundle>/ and its smoke hooks.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bundles: ${{ steps.changes.outputs.bundles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          BEFORE: ${{ github.event.before }}
          WANT: ${{ inputs.bundle }}
        run: |
          set -euo pipefail
          all="server relay client canary acme-dns"
          if [ -n "${WANT}" ]; then
            # A run by hand: what it names. A bundle nothing moved in is
            # already published, and bundle-ci skips it.
            if [ "${WANT}" = all ]; then names=${all}; else names=${WANT}; fi
          elif files=$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}" 2>/dev/null); then
            names=$(while read -r f; do
              case ${f} in
              bundles/*/*) f=${f#bundles/} && echo "${f%%/*}" ;;
              .github/smoke.d/*) echo server ;;
              .github/*-smoke.d/*) f=${f#.github/} && echo "${f%%-smoke.d/*}" ;;
              esac
            done <<<"${files}")
          else
            # A push git cannot compare (a rewrite): every bundle.
            names=${all}
          fi
          bundles=$(tr ' ' '\n' <<<"${names}" | jq -Rnc --arg all "${all}" '[inputs] | unique | map(select(IN($all | splits(" "))))')
          echo "bundles=${bundles}" | tee -a "${GITHUB_OUTPUT}"

  bundle:
    needs: changes
    if: needs.changes.outputs.bundles != '[]'
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJSON(needs.changes.outputs.bundles) }}
    # A group per bundle, never cancelled: a publish waits for the one before
    # it, and one bundle's queue never holds or drops another's. The server's
    # keeps the name its own workflow gave it.
    concurrency:
      group: main-${{ matrix.bundle == 'server' && 'bundle' || matrix.bundle }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_main.yml # zizmor: ignore[self-repository] actionlint 1.7.12 refuses $/
    with:
      bundle: ${{ matrix.bundle }}
    secrets:
      minisign-key: ${{ secrets.MINISIGN_DEV_KEY }}
