# Keep the bundle packages small: the last 5 dev versions, which a dev machine
# may still roll back to, and untagged versions for a day. `main`, `stable`
# and every X.Y.Z are never selected. The job is bundle-ci's.
name: retention

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  retention:
    # The package API is reached with GH_PAT, not GITHUB_TOKEN.
    permissions: {}
    uses: morzecrew/bundle-ci/.github/workflows/retention.yml@31ef658ebef55dedc7cb23184f3a38acc7b1d899 # fix/container-dns (testing; v0.10.1 replaces it)
    with:
      package: dotdash-server
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
    secrets:
      token: ${{ secrets.GH_PAT }}

  canary:
    permissions: {}
    uses: morzecrew/bundle-ci/.github/workflows/retention.yml@31ef658ebef55dedc7cb23184f3a38acc7b1d899 # fix/container-dns (testing; v0.10.1 replaces it)
    with:
      package: dotdash-canary
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
    secrets:
      token: ${{ secrets.GH_PAT }}

  relay:
    permissions: {}
    uses: morzecrew/bundle-ci/.github/workflows/retention.yml@31ef658ebef55dedc7cb23184f3a38acc7b1d899 # fix/container-dns (testing; v0.10.1 replaces it)
    with:
      package: dotdash-relay
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
    secrets:
      token: ${{ secrets.GH_PAT }}

  client:
    permissions: {}
    uses: morzecrew/bundle-ci/.github/workflows/retention.yml@31ef658ebef55dedc7cb23184f3a38acc7b1d899 # fix/container-dns (testing; v0.10.1 replaces it)
    with:
      package: dotdash-client
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
    secrets:
      token: ${{ secrets.GH_PAT }}
