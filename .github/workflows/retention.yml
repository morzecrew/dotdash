# Keep the bundle packages small: the last 5 dev versions, which a dev machine
# may still roll back to, and untagged versions for a day. `main`, `stable`
# and every X.Y.Z are never selected. The job is bundle-ci's.
name: retention

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  retention:
    strategy:
      fail-fast: false
      matrix:
        package: [dotdash-server, dotdash-canary, dotdash-relay, dotdash-client, dotdash-acme-dns]
    # The package API is reached with GH_PAT, not GITHUB_TOKEN.
    permissions: {}
    uses: morzecrew/bundle-ci/.github/workflows/retention.yml@26526964fefb8d0b1d5dc71ba46eb411b8e47e01 # v0.13.0
    with:
      package: ${{ matrix.package }}
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
    secrets:
      token: ${{ secrets.GH_PAT }}
