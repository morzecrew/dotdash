# The canary's dev channel: build, sign and smoke-test every change to bundles/canary/
# on main, then publish ghcr.io/morzecrew/dotdash-canary:<version> and move
# :main. The jobs are bundle-ci's.
name: canary-main

on:
  push:
    branches: [main]
    paths:
      - bundles/canary/**
      - .github/canary-smoke.d/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: main-canary
  cancel-in-progress: false

jobs:
  bundle:
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@759760aded983198badd37208339f6a50dc55930 # v0.11.0
    with:
      morzer-version: "0.17.0"
      ref: ${{ github.sha }}
      channel: main
      signing: dev
      # The key that signs, shipped as minisign.pub: init trusts it on first use.
      ship-pubkey: true
      # Nothing moved since the last run: the version is already published.
      on-existing: skip
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      bundle-dir: bundles/canary
      version-paths: bundles/canary
      package: dotdash-canary
      smoke-hooks: .github/canary-smoke.d
      components: ""
      probe-paths: ""
      operator-secrets: dotdash_id dotdash_encryption dotdash_short_id dotdash_xhttp_path
      init-args: >-
        --set dotdash_server=www.gstatic.com --set dotdash_address=rig.invalid
        --set dotdash_public_key=set-by-the-rig
      # 0.7.0 renamed the target's parameters, which have no default, so a
      # canary is set up again rather than updated to it. Back to true once
      # 0.7.0 is on :main and :stable.
      smoke-update: false
      dev-pubkey: ${{ vars.MINISIGN_DEV_PUBKEY }}
    secrets:
      minisign-key: ${{ secrets.MINISIGN_DEV_KEY }}

  publish:
    needs: bundle
    if: needs.bundle.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: write
      # The provenance publish.yml attests for the bundle.
      id-token: write
      attestations: write
    uses: morzecrew/bundle-ci/.github/workflows/publish.yml@759760aded983198badd37208339f6a50dc55930 # v0.11.0
    with:
      version: ${{ needs.bundle.outputs.version }}
      archive: ${{ needs.bundle.outputs.archive }}
      channel: main
      package: dotdash-canary
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
