# The acme-dns bundle (bundles/acme-dns/, package dotdash-acme-dns) for a pull
# request: built and smoke-tested, never published, signed with a key made in
# the job. The jobs are bundle-ci's.
name: acme-dns-pr

on:
  pull_request:
    paths:
      - bundles/acme-dns/**
      - .github/acme-dns-smoke.d/**
      - .github/workflows/acme-dns-*.yml

permissions: {}

concurrency:
  group: acme-dns-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle:
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@11cf2fa664039ee7800e614ecce85dd041be99d0 # v0.12.1
    with:
      morzer-version: "0.17.1"
      ref: ${{ github.sha }}
      version: 0.0.0-pr.${{ github.event.pull_request.number }}
      signing: ephemeral
      # The key that signs, shipped as minisign.pub: init trusts it on first use.
      ship-pubkey: true
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      bundle-dir: bundles/acme-dns
      version-paths: bundles/acme-dns
      package: dotdash-acme-dns
      smoke-hooks: .github/acme-dns-smoke.d
      components: ""
      probe-paths: ""
      # The rig's zone and loopback address; the API on plain HTTP, since no CA
      # reaches a rig.
      init-args: >-
        --domain auth.rig.invalid --set address=127.0.0.1
        --set nameserver=ns.rig.invalid --set api_tls=none
      # smoke-update installs the published :main first, trusting this key.
      dev-pubkey: ${{ vars.MINISIGN_DEV_PUBKEY }}
