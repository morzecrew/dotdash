# A release's documentation. A vX.Y.Z tag publishes version X.Y on gh-pages;
# when X.Y is the newest released minor it also takes the `latest` alias and
# the root redirect and publishes that release's bootstrap.sh at the root, so
# a patch on an older minor refreshes that minor alone.
# Dispatch it on a tag to publish that tag's docs again.
name: docs-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One group per tag, not docs-dev.yml's: GitHub keeps one waiting run per
    # group, so a deploy queued behind this one would cancel it. Both push to
    # gh-pages, so a push another deploy beat starts again from the branch as
    # it is now.
    concurrency:
      group: docs-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # mike pushes the built site to gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] mike pushes with these credentials
        with:
          fetch-depth: 0 # mike reads gh-pages; every tag, to find the newest minor
          fetch-tags: true

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Publish the release's minor
        working-directory: pages
        env:
          REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != tag ] || ! [[ "$REF" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::error::run on a vX.Y.Z tag (got $REF_TYPE '$REF')"
            exit 1
          fi
          minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          newest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          newest=$(echo "${newest#v}" | cut -d. -f1,2)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          retry() { for _ in 1 2 3; do git fetch -q origin gh-pages && git branch -f gh-pages origin/gh-pages && "$@" && return; sleep 10; done; return 1; }
          if [ "$minor" = "$newest" ]; then
            retry uv run --locked mike deploy --push --update-aliases --branch gh-pages "$minor" latest
            retry uv run --locked mike set-default --push --branch gh-pages latest
            retry ../.github/scripts/publish-bootstrap.sh
          else
            retry uv run --locked mike deploy --push --branch gh-pages "$minor"
          fi
          echo "published $minor (newest minor: $newest)"
