# The canary's stable channel, released with dotdash: the same tag vX.Y.Z on
# main builds, signs and smoke-tests that commit's bundles/canary/, publishes
# dotdash-canary:X.Y.Z, moves :stable and attaches the archive to the tag's
# GitHub release, whichever of this and release.yml creates it. The jobs are
# bundle-ci's.
name: canary-release

on:
  push:
    tags: ["v*"]

permissions: {}

# One group per workflow: GitHub keeps one waiting run per group, so a group
# the four release workflows shared cancelled two of them on v0.5.0. Their
# GitHub release is safe without it: github-release.yml uploads to the
# release when another bundle created it first.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    permissions:
      contents: read
    uses: morzecrew/bundle-ci/.github/workflows/guard.yml@11cf2fa664039ee7800e614ecce85dd041be99d0 # v0.12.1
    with:
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}

  bundle:
    needs: guard
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@11cf2fa664039ee7800e614ecce85dd041be99d0 # v0.12.1
    with:
      morzer-version: "0.16.0"
      ref: ${{ github.sha }}
      version: ${{ needs.guard.outputs.version }}
      channel: stable
      signing: release
      # The key that signs, shipped as minisign.pub: init trusts it on first use.
      ship-pubkey: true
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      bundle-dir: bundles/canary
      version-paths: bundles/canary
      package: dotdash-canary
      smoke-hooks: .github/canary-smoke.d
      components: ""
      probe-paths: ""
      operator-secrets: dotdash_id dotdash_encryption dotdash_short_id dotdash_xhttp_path
      init-args: >-
        --set dotdash_server=www.gstatic.com --set dotdash_address=rig.invalid
        --set dotdash_public_key=set-by-the-rig
      # 0.7.0 renamed the target's parameters, which have no default, so a
      # canary is set up again rather than updated to it. Back to true once
      # 0.7.0 is on :main and :stable.
      smoke-update: false
      release-pubkey: ${{ vars.MINISIGN_RELEASE_PUBKEY }}
    secrets:
      minisign-key: ${{ secrets.MINISIGN_RELEASE_KEY }}

  publish:
    needs: bundle
    if: needs.bundle.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: write
      # The provenance publish.yml attests for the bundle.
      id-token: write
      attestations: write
    uses: morzecrew/bundle-ci/.github/workflows/publish.yml@11cf2fa664039ee7800e614ecce85dd041be99d0 # v0.12.1
    with:
      version: ${{ needs.bundle.outputs.version }}
      archive: ${{ needs.bundle.outputs.archive }}
      channel: stable
      package: dotdash-canary
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}

  github-release:
    needs: [bundle, publish]
    permissions:
      contents: write
    uses: morzecrew/bundle-ci/.github/workflows/github-release.yml@11cf2fa664039ee7800e614ecce85dd041be99d0 # v0.12.1
    with:
      version: ${{ needs.bundle.outputs.version }}
      archive: ${{ needs.bundle.outputs.archive }}
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
