# The stable channel: a tag `vX.Y.Z` on main builds, signs and smoke-tests
# that commit's bundle, publishes `:X.Y.Z`, moves `:stable` and creates the
# GitHub release from CHANGELOG.md, the archive attached. No image is
# tagged: dotdash's images are third-party pins. The jobs are bundle-ci's.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

# One group per workflow: GitHub keeps one waiting run per group, so a group
# the four release workflows shared cancelled two of them on v0.5.0. Their
# GitHub release is safe without it: github-release.yml uploads to the
# release when another bundle created it first.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    permissions:
      contents: read
    uses: morzecrew/bundle-ci/.github/workflows/guard.yml@dc33ba03f86a4ed2264db186f6abbf3012c9f58a # v0.10.1
    with:
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}

  bundle:
    needs: guard
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@dc33ba03f86a4ed2264db186f6abbf3012c9f58a # v0.10.1
    with:
      morzer-version: "0.16.0"
      bundle-dir: bundles/server
      version-paths: bundles/server
      package: dotdash-server
      ref: ${{ github.sha }}
      version: ${{ needs.guard.outputs.version }}
      channel: stable
      signing: release
      # The key that signs, shipped as minisign.pub: init trusts it on first use.
      ship-pubkey: true
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      components: ""
      probe-paths: ""
      operator-secrets: upstream
      # healthcheck_url is the published release's name for probe_url, from
      # before 0.7.0, which smoke-update installs first; a release that does
      # not declare a --set gets it left out (smoke.sh).
      init-args: >-
        --domain dotdash.test --set upstream_protocol=http
        --set probe_url=http://11.99.0.10:8000/
        --set healthcheck_url=http://11.99.0.10:8000/
        --set cert_issuer=internal --profile xdns
      release-pubkey: ${{ vars.MINISIGN_RELEASE_PUBKEY }}
    secrets:
      minisign-key: ${{ secrets.MINISIGN_RELEASE_KEY }}

  publish:
    needs: bundle
    if: needs.bundle.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: write
      # The provenance publish.yml attests for the bundle.
      id-token: write
      attestations: write
    uses: morzecrew/bundle-ci/.github/workflows/publish.yml@dc33ba03f86a4ed2264db186f6abbf3012c9f58a # v0.10.1
    with:
      version: ${{ needs.bundle.outputs.version }}
      archive: ${{ needs.bundle.outputs.archive }}
      channel: stable
      package: dotdash-server
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}

  github-release:
    needs: [bundle, publish]
    permissions:
      contents: write
    uses: morzecrew/bundle-ci/.github/workflows/github-release.yml@dc33ba03f86a4ed2264db186f6abbf3012c9f58a # v0.10.1
    with:
      version: ${{ needs.bundle.outputs.version }}
      archive: ${{ needs.bundle.outputs.archive }}
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
