# The stable channel: a tag `vX.Y.Z` on main builds, signs and smoke-tests
# that commit's bundle, publishes `:X.Y.Z`, moves `:stable` and creates the
# GitHub release from CHANGELOG.md, the archive attached. No image is
# tagged: dotdash's images are third-party pins. The jobs are bundle-ci's.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    permissions:
      contents: read
    uses: morzecrew/bundle-ci/.github/workflows/guard.yml@96969fd2ea37e5117f67353dae43c85c761597d0 # v0.10.0
    with:
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}

  bundle:
    needs: guard
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@96969fd2ea37e5117f67353dae43c85c761597d0 # v0.10.0
    with:
      morzer-version: "0.15.0"
      ref: ${{ github.sha }}
      version: ${{ needs.guard.outputs.version }}
      channel: stable
      signing: release
      # The key that signs, shipped as minisign.pub: init trusts it on first use.
      ship-pubkey: true
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      components: ""
      probe-paths: ""
      operator-secrets: upstream
      # upstream_host and upstream_port are the published release's, from
      # before the upstream secret, which smoke-update installs first; a
      # release that does not declare them gets them left out (smoke.sh).
      init-args: >-
        --domain dotdash.test --set upstream_host=upstream.rig.invalid
        --set upstream_port=18080 --set upstream_protocol=http
        --set healthcheck_url=http://11.99.0.10:8000/ --set cert_issuer=internal
        --profile xdns
      release-pubkey: ${{ vars.MINISIGN_RELEASE_PUBKEY }}
    secrets:
      minisign-key: ${{ secrets.MINISIGN_RELEASE_KEY }}

  publish:
    needs: bundle
    if: needs.bundle.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: write
      # The provenance publish.yml attests for the bundle.
      id-token: write
      attestations: write
    uses: morzecrew/bundle-ci/.github/workflows/publish.yml@96969fd2ea37e5117f67353dae43c85c761597d0 # v0.10.0
    with:
      version: ${{ needs.bundle.outputs.version }}
      archive: ${{ needs.bundle.outputs.archive }}
      channel: stable
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}

  github-release:
    needs: [bundle, publish]
    permissions:
      contents: write
    uses: morzecrew/bundle-ci/.github/workflows/github-release.yml@96969fd2ea37e5117f67353dae43c85c761597d0 # v0.10.0
    with:
      version: ${{ needs.bundle.outputs.version }}
      archive: ${{ needs.bundle.outputs.archive }}
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
