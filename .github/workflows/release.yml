# The stable channel: a tag `vX.Y.Z` on main builds, signs and smoke-tests
# that commit's bundle, publishes `:X.Y.Z` and moves `:stable`. No image is
# tagged: dotdash's images are third-party pins. The jobs are bundle-ci's.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    permissions:
      contents: read
    uses: morzecrew/bundle-ci/.github/workflows/guard.yml@668e3a3c984bf4bb037fa5e8f2227e54285fc4e0 # main after bundle-ci#18
    with:
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}

  bundle:
    needs: guard
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@668e3a3c984bf4bb037fa5e8f2227e54285fc4e0 # main after bundle-ci#18
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.guard.outputs.version }}
      channel: stable
      signing: release
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      components: ""
      probe-paths: ""
      operator-secrets: upstream_username upstream_password
      init-args: >-
        --domain dotdash.test --set upstream_host=upstream.rig.invalid
        --set upstream_port=18080 --set upstream_protocol=http
        --set healthcheck_url=http://target:8000/ --set cert_issuer=internal
        --profile xdns
      release-pubkey: ${{ vars.MINISIGN_RELEASE_PUBKEY }}
      bundle-ci-ref: 668e3a3c984bf4bb037fa5e8f2227e54285fc4e0
    secrets:
      minisign-key: ${{ secrets.MINISIGN_RELEASE_KEY }}

  publish:
    needs: bundle
    if: needs.bundle.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: write
    uses: morzecrew/bundle-ci/.github/workflows/publish.yml@668e3a3c984bf4bb037fa5e8f2227e54285fc4e0 # main after bundle-ci#18
    with:
      version: ${{ needs.bundle.outputs.version }}
      archive: ${{ needs.bundle.outputs.archive }}
      channel: stable
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
