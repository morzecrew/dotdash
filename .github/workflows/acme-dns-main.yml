# The acme-dns bundle's dev channel: build, sign and smoke-test every change to
# bundles/acme-dns/ on main, then publish ghcr.io/morzecrew/dotdash-acme-dns:<version>
# and move :main. The jobs are bundle-ci's.
name: acme-dns-main

on:
  push:
    branches: [main]
    paths:
      - bundles/acme-dns/**
      - .github/acme-dns-smoke.d/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: main-acme-dns
  cancel-in-progress: false

jobs:
  bundle:
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@11cf2fa664039ee7800e614ecce85dd041be99d0 # v0.12.1
    with:
      morzer-version: "0.18.0"
      ref: ${{ github.sha }}
      channel: main
      signing: dev
      # The key that signs, shipped as minisign.pub: init trusts it on first use.
      ship-pubkey: true
      # Nothing moved since the last run: the version is already published.
      on-existing: skip
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      bundle-dir: bundles/acme-dns
      version-paths: bundles/acme-dns
      package: dotdash-acme-dns
      smoke-hooks: .github/acme-dns-smoke.d
      components: ""
      probe-paths: ""
      # The rig's zone and loopback address; the API on plain HTTP, since no CA
      # reaches a rig.
      init-args: >-
        --domain auth.rig.invalid --set address=127.0.0.1
        --set nameserver=ns.rig.invalid --set api_tls=none
      dev-pubkey: ${{ vars.MINISIGN_DEV_PUBKEY }}
    secrets:
      minisign-key: ${{ secrets.MINISIGN_DEV_KEY }}

  publish:
    needs: bundle
    if: needs.bundle.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: write
      # The provenance publish.yml attests for the bundle.
      id-token: write
      attestations: write
    uses: morzecrew/bundle-ci/.github/workflows/publish.yml@11cf2fa664039ee7800e614ecce85dd041be99d0 # v0.12.1
    with:
      version: ${{ needs.bundle.outputs.version }}
      archive: ${{ needs.bundle.outputs.archive }}
      channel: main
      package: dotdash-acme-dns
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
