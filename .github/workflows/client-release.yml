# The client's stable channel, released with dotdash: the same tag vX.Y.Z on
# main builds, signs and smoke-tests that commit's bundles/client/, publishes
# dotdash-client:X.Y.Z, moves :stable and attaches the archive to the tag's
# GitHub release, whichever of this and release.yml creates it. The jobs are
# bundle-ci's.
name: client-release

on:
  push:
    tags: ["v*"]

permissions: {}

# One group per workflow: GitHub keeps one waiting run per group, so a group
# the four release workflows shared cancelled two of them on v0.5.0. Their
# GitHub release is safe without it: github-release.yml uploads to the
# release when another bundle created it first.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    permissions:
      contents: read
    uses: morzecrew/bundle-ci/.github/workflows/guard.yml@dc33ba03f86a4ed2264db186f6abbf3012c9f58a # v0.10.1
    with:
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}

  bundle:
    needs: guard
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@dc33ba03f86a4ed2264db186f6abbf3012c9f58a # v0.10.1
    with:
      morzer-version: "0.15.1"
      ref: ${{ github.sha }}
      version: ${{ needs.guard.outputs.version }}
      channel: stable
      signing: release
      # The key that signs, shipped as minisign.pub: init trusts it on first use.
      ship-pubkey: true
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      bundle-dir: bundles/client
      version-paths: bundles/client
      package: dotdash-client
      smoke-hooks: .github/client-smoke.d
      components: ""
      probe-paths: ""
      # .github/client-smoke.d/pre-apply sets the stand-in's subscription URL.
      operator-secrets: subscription_url
      release-pubkey: ${{ vars.MINISIGN_RELEASE_PUBKEY }}
    secrets:
      minisign-key: ${{ secrets.MINISIGN_RELEASE_KEY }}

  publish:
    needs: bundle
    if: needs.bundle.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: write
      # The provenance publish.yml attests for the bundle.
      id-token: write
      attestations: write
    uses: morzecrew/bundle-ci/.github/workflows/publish.yml@dc33ba03f86a4ed2264db186f6abbf3012c9f58a # v0.10.1
    with:
      version: ${{ needs.bundle.outputs.version }}
      archive: ${{ needs.bundle.outputs.archive }}
      channel: stable
      package: dotdash-client
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}

  github-release:
    needs: [bundle, publish]
    permissions:
      contents: write
    uses: morzecrew/bundle-ci/.github/workflows/github-release.yml@dc33ba03f86a4ed2264db186f6abbf3012c9f58a # v0.10.1
    with:
      version: ${{ needs.bundle.outputs.version }}
      archive: ${{ needs.bundle.outputs.archive }}
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
