# The canary's bundle (canary/, package dotdash-canary) for a pull request:
# built and smoke-tested against a stand-in dotdash server, never published,
# signed with a key made in the job. The jobs are bundle-ci's.
name: canary-pr

on:
  pull_request:
    paths:
      - bundles/canary/**
      - .github/canary-smoke.d/**
      - .github/workflows/canary-*.yml

permissions: {}

concurrency:
  group: canary-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle:
    permissions:
      contents: read
      packages: read
    uses: morzecrew/bundle-ci/.github/workflows/bundle.yml@11cf2fa664039ee7800e614ecce85dd041be99d0 # v0.12.1
    with:
      morzer-version: "0.16.0"
      ref: ${{ github.sha }}
      version: 0.0.0-pr.${{ github.event.pull_request.number }}
      signing: ephemeral
      # The key that signs, shipped as minisign.pub: init trusts it on first use.
      ship-pubkey: true
      runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
      bundle-dir: bundles/canary
      version-paths: bundles/canary
      package: dotdash-canary
      smoke-hooks: .github/canary-smoke.d
      components: ""
      probe-paths: ""
      operator-secrets: dotdash_id dotdash_encryption dotdash_short_id dotdash_xhttp_path
      # .github/canary-smoke.d/pre-apply replaces these with the stand-in's.
      init-args: >-
        --set dotdash_server=www.gstatic.com --set dotdash_address=rig.invalid
        --set dotdash_public_key=set-by-the-rig
      # 0.7.0 renamed the target's parameters, which have no default, so a
      # canary is set up again rather than updated to it. Back to true once
      # 0.7.0 is on :main and :stable.
      smoke-update: false
      # smoke-update installs the published :main first, trusting this key.
      dev-pubkey: ${{ vars.MINISIGN_DEV_PUBKEY }}
