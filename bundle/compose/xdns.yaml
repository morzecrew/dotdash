# The xdns profile (`morzer init --profile xdns`): the DNS tunnel on UDP/53.
# The inbound itself is in the Xray template, under the same profile.
services:
  xray:
    ports:
      - "${DOTDASH_PARAM_XDNS_BIND:-0.0.0.0}:53:5353/udp"

  client-config:
    environment:
      XDNS_DOMAIN: ${DOTDASH_PARAM_XDNS_DOMAIN:-t}
