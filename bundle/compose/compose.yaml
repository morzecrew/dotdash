# dotdash. Xray owns the public TLS port with REALITY: clients holding the key
# get Xray, everything else is relayed to Caddy, which serves a cover site with
# a Let's Encrypt certificate and passes one secret path back to Xray's XHTTP
# inbound. Caddy publishes only port 80, for ACME. Every client connection
# leaves through the upstream proxy. The xdns profile adds the DNS tunnel
# (xdns.yaml).
#
# Compose sees only what morzer gives it: DOTDASH_IMAGE_*, DOTDASH_PARAM_*,
# DOTDASH_DOMAIN, DOTDASH_CONFIG_FILE, DOTDASH_RELEASE_DIR, DOTDASH_SECRETS_DIR.

x-hardened: &hardened
  restart: unless-stopped
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  logging:
    driver: local
    options: {max-size: 10m, max-file: "3"}

services:
  xray:
    <<: *hardened
    image: ${DOTDASH_IMAGE_XRAY:?set by morzer}
    environment:
      # The config's loopback-only http inbound: the probe takes the same
      # routing and upstream as client traffic.
      XRAY_HEALTHCHECK_PROXY: http://127.0.0.1:10809
      XRAY_HEALTHCHECK_URL: ${DOTDASH_PARAM_HEALTHCHECK_URL:-https://www.gstatic.com/generate_204}
      XRAY_HEALTHCHECK_EXPECT: ${DOTDASH_PARAM_HEALTHCHECK_EXPECT:-.*}
    volumes:
      # Long form, so a missing file fails the start: the short form has
      # Docker create a directory there, which morzer cannot render over.
      - type: bind
        source: ${DOTDASH_CONFIG_FILE:-/etc/dotdash/application.yaml}
        target: /etc/xray/config.json
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      # Where the image writes the config with secrets resolved; never disk.
      - /run/xray:uid=65532,gid=65532,mode=0700,size=1m
    secrets: [vless_clients, vless_seed, xhttp_path, reality_key, reality_short_id, upstream_username, upstream_password]
    # REALITY on 443 inside too (Xray warns on any other port), as uid 65532
    # with no capabilities.
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}
    ports:
      - "${DOTDASH_PARAM_HTTPS_PORT:-443}:443/tcp"
    networks: [backend, egress]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/usr/local/bin/xray-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  caddy:
    <<: *hardened
    image: ${DOTDASH_IMAGE_CADDY:?set by morzer}
    environment:
      DOMAIN: ${DOTDASH_DOMAIN:?install with --domain}
      CERT_ISSUER: ${DOTDASH_PARAM_CERT_ISSUER:-acme}
    # 80 and 443 inside, as above.
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}
    volumes:
      - type: bind
        source: ${DOTDASH_RELEASE_DIR:?set by morzer}/caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: {create_host_path: false}
      # The bundled page, and the operator's own site, served instead when it
      # has the requested file (the Caddyfile decides).
      - ${DOTDASH_RELEASE_DIR:?set by morzer}/site:/srv/default:ro
      - ${DOTDASH_PARAM_SITE_DIR:-/srv/dotdash}:/srv/own:ro
      # The ACME account and certificates. The image's /data/caddy is mode
      # 1777, and a fresh volume copies it, so uid 65532 can write there.
      - caddy_data:/data
    tmpfs:
      - /config:uid=65532,gid=65532,mode=0700,size=8m
    secrets: [xhttp_path]
    ports:
      - "80:80/tcp"
    networks: [edge, backend]
    mem_limit: 256m
    depends_on:
      xray:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # One-shot behind a profile, started only by `morzer task run client-config`.
  # The Caddy image for its shell, the Xray image mounted for the binaries that
  # derive the client keys; no network at all.
  client-config:
    <<: *hardened
    restart: "no"
    image: ${DOTDASH_IMAGE_CADDY:?set by morzer}
    profiles: [tasks]
    network_mode: none
    environment:
      DOMAIN: ${DOTDASH_DOMAIN:?install with --domain}
      HTTPS_PORT: ${DOTDASH_PARAM_HTTPS_PORT:-443}
      SERVERS: ${DOTDASH_PARAM_SERVERS:-self}
    volumes:
      - ${DOTDASH_RELEASE_DIR:?set by morzer}/tasks:/task:ro
      - type: image
        source: ${DOTDASH_IMAGE_XRAY:?set by morzer}
        target: /opt/xray
        image:
          subpath: usr/local/bin
    secrets: [vless_clients, vless_seed, xhttp_path, reality_key, reality_short_id]

  # One-shot behind a profile, started only by `morzer task run exit-check`.
  # It shares Xray's network namespace, so it reaches the probe inbound on
  # 127.0.0.1:10809 and asks through the upstream as client traffic leaves.
  exit-check:
    <<: *hardened
    restart: "no"
    image: ${DOTDASH_IMAGE_CADDY:?set by morzer}
    profiles: [tasks]
    network_mode: service:xray
    volumes:
      - ${DOTDASH_RELEASE_DIR:?set by morzer}/tasks:/task:ro

networks:
  edge: {}
  # Caddy and Xray to each other only; no route out.
  backend:
    internal: true
  egress: {}

volumes:
  caddy_data: {}

secrets:
  vless_clients:
    file: ${DOTDASH_SECRETS_DIR:-/run/dotdash/secrets}/vless_clients
  xhttp_path:
    file: ${DOTDASH_SECRETS_DIR:-/run/dotdash/secrets}/xhttp_path
  vless_seed:
    file: ${DOTDASH_SECRETS_DIR:-/run/dotdash/secrets}/vless_seed
  upstream_username:
    file: ${DOTDASH_SECRETS_DIR:-/run/dotdash/secrets}/upstream_username
  upstream_password:
    file: ${DOTDASH_SECRETS_DIR:-/run/dotdash/secrets}/upstream_password
  reality_key:
    file: ${DOTDASH_SECRETS_DIR:-/run/dotdash/secrets}/reality_key
  reality_short_id:
    file: ${DOTDASH_SECRETS_DIR:-/run/dotdash/secrets}/reality_short_id
