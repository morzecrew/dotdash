# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-secrets.json
# Both images run as 65532 (Xray's distroless nonroot, and Caddy told to), so
# every file is theirs; Compose mounts each only into the services listed.
api_version: selfhost/v1alpha1

secrets:
  - name: vless_uuid
    description: VLESS client id, shared by the XHTTP and XDNS inbounds
    required: true
    generator: {kind: uuid}
    owner: "65532:65532"
    services: [xray]

  - name: xhttp_path
    description: Secret URL path Caddy routes to Xray's XHTTP inbound; everything else gets the cover site
    required: true
    generator: {kind: hex, length: 32}
    owner: "65532:65532"
    services: [caddy, xray]

  - name: vless_decryption
    description: VLESS Encryption server key, the "decryption" value printed by `xray vlessenc` (ML-KEM-768 block)
    required: true
    owner: "65532:65532"
    services: [xray]

  - name: vless_encryption
    description: VLESS Encryption client key, the "encryption" value from the same `xray vlessenc` run; read only by the client-config task
    required: true
    owner: "65532:65532"

  - name: upstream_username
    description: Username for the ISP/residential proxy
    required: true
    owner: "65532:65532"
    services: [xray]

  - name: upstream_password
    description: Password for the ISP/residential proxy
    required: true
    owner: "65532:65532"
    services: [xray]

  - name: origin_cert
    description: Cloudflare Origin CA certificate (PEM) for the domain
    required: true
    owner: "65532:65532"
    services: [caddy]

  - name: origin_key
    description: Private key (PEM) of the Cloudflare Origin CA certificate
    required: true
    owner: "65532:65532"
    services: [caddy]

  - name: cf_aop_ca
    description: CA (PEM) that signed the client certificate uploaded to Cloudflare for zone-level Authenticated Origin Pulls
    required: true
    owner: "65532:65532"
    services: [caddy]
