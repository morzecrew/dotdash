# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-secrets.json
# Both images run as 65532 (Xray's distroless nonroot, and Caddy told to), so
# every file is theirs; Compose mounts each only into the services listed.
api_version: selfhost/v1alpha1

secrets:
  # One client per line, "<uuid> [name]", for every inbound; blank lines and
  # "#" comments are skipped. The generator writes the first, unnamed. Add a
  # device with `morzer secret edit vless_clients`; delete its line to revoke
  # it. The image refuses a line that is not a UUID (platform-images#130).
  - name: vless_clients
    description: VLESS clients, one "<uuid> [name]" per line
    required: true
    generator: {kind: uuid}
    owner: "65532:65532"
    services: [xray]

  - name: xhttp_path
    description: Secret URL path Caddy routes to Xray's XHTTP inbound; everything else gets the cover site
    required: true
    generator: {kind: hex, length: 32}
    owner: "65532:65532"
    services: [caddy, xray]

  # Both VLESS Encryption strings derive from this ML-KEM-768 seed: the image
  # resolves the server's, the client-config task prints the client's.
  # Rotating it re-keys the server; clients need the new task output.
  - name: vless_seed
    description: ML-KEM-768 seed (64 bytes, hex) the VLESS Encryption key pair derives from
    required: true
    generator: {kind: hex, length: 128}
    owner: "65532:65532"
    services: [xray]

  # x25519 private key: 43 base64url characters are 32 random bytes, which is
  # what REALITY reads. The client-config task prints the public half.
  - name: reality_key
    description: REALITY private key (x25519, base64url)
    required: true
    generator: {kind: password, length: 43, alphabet: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"}
    owner: "65532:65532"
    services: [xray]

  - name: reality_short_id
    description: REALITY short id clients present alongside the key
    required: true
    generator: {kind: hex, length: 16}
    owner: "65532:65532"
    services: [xray]

  - name: upstream_username
    description: Username for the ISP/residential proxy
    required: true
    owner: "65532:65532"
    services: [gate]

  - name: upstream_password
    description: Password for the ISP/residential proxy
    required: true
    owner: "65532:65532"
    services: [gate]
