# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-manifest.json
api_version: selfhost/v1alpha1
kind: application-release

metadata:
  name: dotdash
  # Stamped by `morzer release build --version X`, together with VERSION.
  version: 0.0.0
  description: Xray with REALITY in front of a Caddy cover site, an optional DNS tunnel, egressing through an upstream proxy
  vendor: morzecrew
  release_notes: RELEASE.md

providers:
  runtime: {name: compose}
  secrets: {name: sops-age}
  health: {name: http}

runtimes:
  compose:
    files:
      - compose/compose.yaml
    profiles:
      # The DNS tunnel on UDP/53, which also needs xdns_domain.
      xdns: [compose/xdns.yaml]
      # VLESS over XHTTP with REALITY on xhttp_reality_port, beside the two
      # transports every install has. One profile per installation, so both
      # together is a profile of its own.
      xhttp-reality: [compose/xhttp-reality.yaml]
      # Both, from before profiles combined. Deprecated: xdns,xhttp-reality
      # does the same; it goes in the next release.
      xdns-xhttp-reality: [compose/xdns.yaml, compose/xhttp-reality.yaml]
      # An OpenVPN client (vpn) and a SOCKS hop in its namespace (vpn-socks),
      # which the gate dials with upstream_protocol=openvpn: Xray has no
      # OpenVPN of its own.
      openvpn: [compose/openvpn.yaml]
    # installation.profile=xdns,xhttp-reality runs both; any of them with
    # openvpn, such as xdns,openvpn, adds the OpenVPN upstream.
    combinable: [xdns, xhttp-reality, openvpn]
    options:
      project: dotdash

compatibility:
  # The manager this bundle is verified and rehearsed with, and the first that
  # combines profiles, takes text parameters and renders an unset optional
  # secret as an empty file.
  min_manager_version: "0.15.0"
  # 0.4.0 alone declared false: it replaced upstream_host, upstream_port and
  # their secrets with the upstream secret, and an update drops the old
  # values, so 0.3.x could not start again. Going back from a later release
  # to 0.4.0 or after loses nothing. An update from 0.3.x straight to a later
  # one is still refused until `upstream` is set.
  rollback_safe: true
  # No database, which an unattended update needs declared.
  database: none

requirements:
  architectures: [amd64, arm64]
  tools:
    # client-config mounts the Xray image (Compose `type: image`).
    docker: ">=28.0.0"
    compose: ">=2.35.0"
  memory: 512MiB
  disk: 2GiB
  # TCP only. UDP/53 for the DNS tunnel is not checked here: on a host whose
  # systemd-resolved stub holds 127.0.0.53:53, set xdns_bind to the public IP.
  # Nor is xhttp_reality_port: these fields see the parameters, not the
  # profile, and a default install must not need it free.
  ports: ["80", "{{ .Parameters.https_port }}"]

parameters:
  https_port:
    type: port
    default: 443
    description: Host port of the REALITY inbound; anything without its key reaches the cover site
    services: [gate, subscription]
  upstream_protocol:
    type: enum
    values: [socks, http, wireguard, openvpn]
    default: socks
    description: "How every client connection leaves: socks or http, a proxy the upstream secret names as user:pass@host:port; wireguard, a WireGuard exit, from the wg-quick client config in upstream_wireguard; openvpn, an OpenVPN exit, from the client config in upstream_openvpn, which needs the openvpn profile. A tunnel carries UDP and IPv6 itself, so it takes neither upstream6_protocol nor resolve=upstream"
    services: [xray, gate]
  upstream_tls:
    type: bool
    default: false
    description: Connect to the upstream proxy over TLS (an HTTPS or SOCKS-over-TLS proxy), so its credentials and your destinations do not cross the network in clear
    services: [gate]
  upstream_udp:
    type: bool
    default: false
    description: Relay client UDP through a SOCKS5 upstream that supports UDP ASSOCIATE; otherwise UDP is dropped. A wireguard or openvpn upstream always carries UDP
    services: [xray, gate]
  upstream6_protocol:
    type: enum
    values: [none, socks, http]
    default: none
    description: "Protocol of a second proxy for IPv6, which the upstream6 secret names as user:pass@host:port, or none. With one, a destination that has an IPv6 address leaves through it, IPv4-only ones through the upstream, and neither falls back to the other"
    services: [xray, gate]
  upstream6_tls:
    type: bool
    default: false
    description: Connect to the IPv6 proxy over TLS
    services: [gate]
  healthcheck6_url:
    type: string
    default: http://api6.ipify.org
    description: "With the IPv6 proxy, a URL with an IPv6 address only, which the egress health check also fetches, through the IPv6 proxy; any 2xx is healthy"
  xdns_domain:
    type: string
    default: t
    description: Zone delegated to this server for the DNS tunnel (xdns profile); a name with no dot is taken under the domain, so t is t.example.com
    services: [xray]
  xdns_bind:
    type: string
    default: 0.0.0.0
    description: Host address UDP/53 is published on for the DNS tunnel
    services: [gate]
  xhttp_reality_port:
    type: port
    default: 8443
    description: "Host TCP port of XHTTP with REALITY (the xhttp-reality profile); must differ from https_port and 80"
    services: [gate, subscription]
  xdns_mtu:
    type: int
    default: 900
    description: mKCP packet size the DNS tunnel answers with; must fit the EDNS0 size resolvers on the path advertise (1232 is common, lower it if replies are lost)
    services: [xray]
  resolve:
    type: enum
    values: [gateway, upstream]
    default: gateway
    description: "Who turns hostnames into addresses. gateway: this server, over dns_resolver, which itself goes out through the upstream, so the upstream sees addresses only; a name resolving to a private address is blocked. upstream: the upstream, which then sees every hostname"
    services: [xray]
  dns_resolver:
    type: string
    default: https://1.1.1.1/dns-query
    description: "The DNS-over-HTTPS server resolve=gateway asks, through the upstream; it sees the names, the upstream does not. client-config's Xray config answers the device's DNS from it too, through the tunnel. Only https:// URLs are accepted"
    services: [xray]
  healthcheck_expect:
    type: string
    default: ".*"
    description: "Regular expression (RE2) the healthcheck response must match. With healthcheck_url at an IP-echo service, the upstream's exit IP anchored, such as ^203\\.0\\.113\\.7\\s*$, makes Xray unhealthy when the exit IP changes"
    services: [xray]
  cert_issuer:
    type: enum
    values: [acme, internal]
    default: acme
    description: "Where the site certificate comes from: acme is Let's Encrypt, over ports 80 and 443; internal is Caddy's own CA, for a machine the internet cannot reach"
    services: [caddy]
  servers:
    type: string
    default: self
    description: "Servers with these same secrets, comma-separated; self is this one. client-config prints links for each and, with more than one, a config that uses whichever answers fastest"
    services: [subscription]
  relays:
    type: text
    # morzer wants a default for every parameter it doesn't ask for at init,
    # so a comment, which client-config skips, that shows the line's form.
    default: "# One relay per line, as its relay-entry task prints it: <host> <site> <public key> <short id> <encryption>"
    description: "The dotdash-relay machines devices also reach this server through, one \"<host> <site> <public key> <short id> <encryption>\" line per relay, as a relay's relay-entry task prints it; client-config and the subscriptions add a link through each"
    services: [subscription]
  subscription:
    type: bool
    default: false
    description: "Serve each device a subscription URL on the cover site, which client-config prints: its links, which the app refreshes, so a revocation or a key rotation reaches it without resending links. A URL is as secret as the links"
    services: [subscription]
  site_dir:
    type: string
    default: /srv/dotdash
    description: "Host directory of your own cover site, served in place of the bundled page; files must be readable by uid 65532"
    services: [caddy]
  log_level:
    type: enum
    values: [debug, info, warning, error, none]
    default: error
    description: "Xray error-log verbosity; the access log is always off. warning and below name the destinations of failed connections, so keep them for debugging"
    services: [xray, gate]
  healthcheck_url:
    type: string
    default: https://www.gstatic.com/generate_204
    description: URL Xray's healthcheck fetches through the upstream proxy; any 2xx is healthy
    services: [xray]

images:
  # hooks/policy reads the rendered config with it, run with no network, so
  # the host needs no jq of its own.
  jq: ghcr.io/jqlang/jq:1.8.1@sha256:4f34c6d23f4b1372ac789752cc955dc67c2ae177eb1b5860b75cdc5091ce6f91
  xray: ghcr.io/morzecrew/xray:26.10.31@sha256:996f30a2cb6f65e1121b599afcebb1d3cb669f0ba3f22fe16c2ac9b7c6693527
  caddy: docker.io/library/caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
  # The openvpn profile's OpenVPN client, whose kill switch drops the default
  # routes before anything runs (platform-images, images/openvpn).
  openvpn: ghcr.io/morzecrew/openvpn:2.6.20@sha256:effaeb50a48f60aa40838c423c211b44e7443b6e2f22c8a5edb40adffb9a976d

# Xray's config. Morzer renders one file Compose can mount (<etc>/application.yaml);
# its content is JSON, which is also YAML. Secrets are not in it: it holds
# {"$file": ...} references the image resolves at start.
configuration:
  - template: templates/xray.json.tmpl
    target: /etc/dotdash/application.yaml
    mode: "0644"
  - template: templates/gate.json.tmpl
    target: /etc/dotdash/gate.json
    mode: "0644"
  # Rendered under every profile; only the openvpn profile mounts it.
  - template: templates/vpn-socks.json.tmpl
    target: /etc/dotdash/vpn-socks.json
    mode: "0644"

secrets:
  source: /etc/dotdash/secrets.sops.yaml
  render_to: /run/dotdash/secrets
  schema: secrets.schema.yaml

operations:
  smoke_test:
    kind: hook
    command: ["hooks/smoke-test"]
    timeout: 2m

tasks:
  client-config:
    description: "Print client settings, for every client or the one named after --: a link per transport and an Xray config; with subscriptions on, the URL alone unless --full (output is credentials)"
    service: client-config
    command: ["sh", "/task/client-config.sh"]
    args: true
    timeout: 1m
  exit-check:
    description: "Print the IPv4 and IPv6 exits the upstream leaves from, with their network (ASN) and country, and whether they match; changes nothing"
    service: exit-check
    command: ["sh", "/task/exit-check.sh"]
    args: true
    timeout: 2m
  canary-config:
    description: "Print the init command and secrets for a dotdash-canary machine acting as the client named after -- (output is credentials)"
    service: client-config
    command: ["sh", "/task/canary-config.sh"]
    args: true
    timeout: 1m
  relay-config:
    description: "Print the init command and secrets for a dotdash-relay machine carrying devices on to this server as the client named after -- (output is every device's credentials)"
    service: client-config
    command: ["sh", "/task/relay-config.sh"]
    args: true
    timeout: 1m

health:
  checks:
    # egress fetches healthcheck_url through Xray and the upstream, so healthy
    # means the whole way out works, not that a process is up; failing, it
    # names the layer (the upstream's address, its credentials, the
    # destination, the exit). `doctor` fails while either check does.
    - {name: cover-site, type: command, command: ["hooks/healthy", "cover-site"], timeout: 10s}
    - {name: egress, type: command, command: ["hooks/healthy", "egress"], timeout: 30s}

# The release's invariants (hooks/policy), against what runs: `doctor` fails
# when they drift. smoke_test checks them after every apply and update.
preflight:
  policy:
    description: traffic leaves through the upstream only, and nothing is published or privileged beyond the release's own
    command: [hooks/policy]
    fatal: true
    timeout: 1m
    remedy: re-render with `morzer apply`, and look at what changed /etc/dotdash/application.yaml or the containers

backup:
  volumes:
    # Caddy's ACME account and certificates: written whole, safe to copy live.
    caddy_data: {consistency: hot}

retention:
  releases: 3
  backups: 3
