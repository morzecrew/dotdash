[project]
site_name = "dotdash"
site_url = "https://morzecrew.github.io/dotdash/"
site_description = "Four morzer bundles that get devices in a censored network out through a server of yours: the server, a relay, a client and a canary"
site_author = "Lev Litvinov"
copyright = "&copy; 2026 Lev Litvinov and contributors"

repo_url = "https://github.com/morzecrew/dotdash"
repo_name = "dotdash"

nav = [
    { "Home" = "index.md" },
    { "Before a shutdown" = "shutdown.md" },
    { "Server" = [
        "server/index.md",
        "server/install.md",
        "server/devices.md",
        "server/device-dns.md",
        { "Options" = [
            "server/cover-site.md",
            "server/dns-tunnel.md",
            "server/xhttp-reality.md",
            "server/ipv6-upstream.md",
            "server/tunnel-upstream.md",
            "server/cdn.md",
            "server/several-servers.md",
        ] },
        { "Operations" = [
            "server/operations.md",
            "server/leaks.md",
            "server/move-server.md",
        ] },
        { "Reference" = [
            "server/parameters.md",
            "server/secrets.md",
        ] },
    ] },
    { "Relay" = [
        "relay/index.md",
        "relay/install.md",
        "relay/operations.md",
        "relay/reference.md",
    ] },
    { "Client" = [
        "client/index.md",
        "client/network.md",
        "client/rules.md",
        "client/tun.md",
        "client/reference.md",
    ] },
    { "Canary" = [
        "canary/index.md",
    ] },
    { "Releases" = [
        "reference/releases.md",
        "reference/changelog.md",
    ] },
]

dev_addr = "localhost:8047"

[project.theme]
features = [
    "search.highlight",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.progress",
    "navigation.tabs",
    "navigation.sections",
    "navigation.indexes",
    "navigation.path",
    "navigation.top",
    "toc.follow",
    "content.code.copy",
    "content.code.select",
]

[project.theme.icon]
logo = "lucide/radio-tower"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "blue grey"
accent = "teal"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
primary = "blue grey"
accent = "teal"

# The changelog page includes ../CHANGELOG.md rather than copying it.
[project.markdown_extensions.pymdownx.snippets]
base_path = ["docs", ".."]
check_paths = true

[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]

# The root redirects to `latest`, the newest released minor; a patch release
# refreshes its minor. `dev` follows main and is never the default once a
# release exists. See .github/workflows/docs-*.yml.
[project.extra.version]
provider = "mike"
default = "latest"
alias = true
