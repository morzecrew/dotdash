# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-manifest.json
api_version: selfhost/v1alpha1
kind: application-release

metadata:
  name: dotdash-relay
  # Stamped by `morzer release build --version X`, together with VERSION.
  version: 0.0.0
  description: A relay inside the country, where only domestic addresses get through, that carries devices on to a dotdash server
  vendor: morzecrew
  release_notes: RELEASE.md

providers:
  runtime: {name: compose}
  secrets: {name: sops-age}
  health: {name: http}

runtimes:
  compose:
    files:
      - compose/compose.yaml
    profiles:
      # A site of the relay's own, under its own domain, as REALITY's target,
      # instead of a borrowed one (site): see compose/own-site.yaml.
      own-site: [compose/own-site.yaml]
    options:
      project: dotdash-relay

configuration:
  - template: templates/xray.json.tmpl
    target: /etc/dotdash-relay/xray.json
    mode: "0644"

secrets:
  source: /etc/dotdash-relay/secrets.sops.yaml
  render_to: /run/dotdash-relay/secrets
  schema: secrets.schema.yaml

compatibility:
  # The manager this bundle is verified and rehearsed with, and the first with
  # split, which the server list needs.
  min_manager_version: "0.15.0"
  rollback_safe: true
  # No database, which an unattended update needs declared.
  database: none

requirements:
  architectures: [amd64, arm64]
  tools:
    docker: ">=28.0.0"
    compose: ">=2.35.0"
  memory: 256MiB
  disk: 512MiB
  # 443 alone: on networks that let only listed addresses through, other
  # ports are cut even to those. The own-site profile also publishes 80, for
  # its certificate, which these fields cannot see.
  ports: ["443"]

# `morzer task run relay-config -- <client>` on the dotdash server prints the
# init command and the secrets for this machine.
parameters:
  # Required unless the own-site profile, whose site is the relay's own.
  site:
    type: string
    default: none
    description: "Without the own-site profile, a site next to this machine, in its own network, that speaks TLS 1.3 and HTTP/2: devices send its name, and anyone probing port 443 gets its real handshake. With it, unused: the relay's own domain is the site"
    services: [xray]
  # No services: Caddy runs under the own-site profile alone, and morzer's
  # restart of a service behind an inactive profile fails (morzer#324). A
  # change takes a full apply.
  site_dir:
    type: string
    default: /srv/dotdash-relay
    description: "With the own-site profile, the host directory of your own site, served in place of the bundled page; files must be readable by uid 65532"
  cert_issuer:
    type: enum
    values: [acme, internal]
    default: acme
    description: "With the own-site profile, where its certificate comes from: acme is Let's Encrypt, over port 80; internal is Caddy's own CA, for a machine the internet cannot reach"
  dotdash_servers:
    type: string
    description: "The dotdash servers sharing one set of keys (dotdash's servers), comma-separated domains, each sent as its TLS server name; with several, the relay uses whichever answers fastest"
    services: [xray]
  # Before dotdash_servers, kept so a relay set up then updates as it is: an
  # update leaves dotdash_servers, which has no default, empty, and the
  # template falls back to this.
  dotdash_server:
    type: string
    default: none
    description: "Deprecated: the one dotdash server, read only while dotdash_servers is none; set dotdash_servers instead"
    services: [xray]
  dotdash_address:
    type: string
    # morzer wants a default for every parameter it doesn't ask for at init.
    default: none
    description: Where to connect when dotdash_servers names one server, if not to its name, such as an IP; none reaches each server by its name
    services: [xray]
  dotdash_port:
    type: port
    default: 443
    description: The dotdash server's https_port
    services: [xray]
  dotdash_public_key:
    type: string
    description: The dotdash server's REALITY public key, the pbk of its REALITY links
    services: [xray]
  probe_url:
    type: string
    default: https://www.gstatic.com/generate_204
    description: What the health check fetches through dotdash; any 2xx is healthy
    services: [xray]

images:
  # The relay-entry task's shell; Xray's image has none.
  busybox: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
  xray: ghcr.io/morzecrew/xray:26.10.31@sha256:996f30a2cb6f65e1121b599afcebb1d3cb669f0ba3f22fe16c2ac9b7c6693527
  # The own-site profile's site; dotdash's own.
  caddy: docker.io/library/caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee

tasks:
  relay-entry:
    description: "Print this relay's line for the dotdash server's relays secret, and how a dotdash-canary checks it; argument: the address devices reach this machine at"
    service: relay-entry
    command: ["sh", "/task/relay-entry.sh"]
    args: true
    timeout: 1m

health:
  checks:
    # Fetches probe_url through dotdash, up to three tries, so healthy means the
    # way on to dotdash works. Whether devices can reach this machine is not
    # something it can see: only a device on such a network can (a canary).
    - {name: through-dotdash, type: command, command: ["hooks/healthy"], timeout: 2m}
    # With the own-site profile, Caddy, the site probes meet, is healthy.
    - {name: cover-site, type: command, command: ["hooks/cover-site"], timeout: 10s}

retention:
  releases: 3
  backups: 3
