# The xhttp profile: the XHTTP path too, through dotdash's cover site.
services:
  xhttp:
    extends: {file: compose.yaml, service: reality}
    volumes:
      - type: bind
        source: /etc/dotdash-canary/xhttp.json
        target: /etc/xray/config.json
        read_only: true
        bind: {create_host_path: false}
    secrets: [xhttp_path]
