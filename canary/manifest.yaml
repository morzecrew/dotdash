# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-manifest.json
api_version: selfhost/v1alpha1
kind: application-release

metadata:
  name: dotdash-canary
  # Stamped by `morzer release build --version X`, together with VERSION.
  version: 0.0.0
  description: A dotdash client on a machine inside the network you care about, healthy only while it can reach the internet through dotdash
  vendor: morzecrew
  release_notes: RELEASE.md

providers:
  runtime: {name: compose}
  secrets: {name: sops-age}
  health: {name: http}

runtimes:
  compose:
    files:
      - compose/compose.yaml
    profiles:
      # Also checks the XHTTP path, through dotdash's cover site.
      xhttp: [compose/xhttp.yaml]
      # XHTTP with REALITY instead, on its own port: the server's xhttp-reality
      # profiles.
      xhttp-reality: [compose/xhttp-reality.yaml]
      # mKCP instead, on its own UDP port: the server's mkcp profile.
      mkcp: [compose/mkcp.yaml]
    options:
      project: dotdash-canary

configuration:
  - template: templates/reality.json.tmpl
    target: /etc/dotdash-canary/reality.json
    mode: "0644"
  - template: templates/xhttp.json.tmpl
    target: /etc/dotdash-canary/xhttp.json
    mode: "0644"
  - template: templates/xhttp-reality.json.tmpl
    target: /etc/dotdash-canary/xhttp-reality.json
    mode: "0644"
  - template: templates/mkcp.json.tmpl
    target: /etc/dotdash-canary/mkcp.json
    mode: "0644"

secrets:
  source: /etc/dotdash-canary/secrets.sops.yaml
  render_to: /run/dotdash-canary/secrets
  schema: secrets.schema.yaml

compatibility:
  # The manager this bundle is verified and rehearsed with, and the first whose
  # `doctor` fails on a failing health check.
  min_manager_version: "0.14.0"
  rollback_safe: true
  # No database, which an unattended update needs declared.
  database: none

requirements:
  architectures: [amd64, arm64]
  tools:
    docker: ">=28.0.0"
    compose: ">=2.35.0"
  memory: 128MiB
  disk: 512MiB

# `morzer task run canary-config -- <client>` on the dotdash server prints the
# init command and the secrets for this machine.
parameters:
  server:
    type: string
    description: The dotdash server's domain, sent as the TLS server name
    services: [reality, xhttp, xhttp-reality, mkcp]
  address:
    type: string
    description: Where to connect, normally the same domain; an IP or a CDN's name also works
    services: [reality, xhttp, xhttp-reality, mkcp]
  port:
    type: port
    default: 443
    description: The dotdash server's https_port
    services: [reality, xhttp]
  xhttp_reality_port:
    type: port
    default: 8443
    description: The dotdash server's xhttp_reality_port (the xhttp-reality profile)
    services: [xhttp-reality]
  kcp_port:
    type: port
    default: 8447
    description: The dotdash server's kcp_port (the mkcp profile)
    services: [mkcp]
  kcp_header:
    type: enum
    values: [none, dtls, srtp, utp, wechat, wireguard]
    default: dtls
    description: The dotdash server's kcp_header (the mkcp profile)
    services: [mkcp]
  reality_public_key:
    type: string
    description: The REALITY public key, the pbk of a dotdash REALITY link
    services: [reality, xhttp-reality]
  probe_url:
    type: string
    default: https://www.gstatic.com/generate_204
    description: What each check fetches through dotdash; any 2xx is healthy
    services: [reality, xhttp, xhttp-reality, mkcp]
  # No services: only the measure task reads it, when it runs.
  download_url:
    type: string
    default: https://speed.cloudflare.com/__down?bytes=1000000
    description: "What measure downloads three times through each transport for its Mbit/s; none skips the downloads"

images:
  # The measure task's shell; Xray's image has none.
  busybox: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
  xray: ghcr.io/morzecrew/xray:26.10.31@sha256:996f30a2cb6f65e1121b599afcebb1d3cb669f0ba3f22fe16c2ac9b7c6693527

tasks:
  measure:
    description: "Measure each transport through dotdash: N fetches (20 unless given), with success rate, timeouts and latency, and three downloads of download_url with the median Mbit/s, as JSON; arguments: [count] [url] [timeout]"
    service: measure
    command: ["sh", "/task/measure.sh"]
    args: true
    timeout: 15m

health:
  checks:
    # Each service fetches probe_url through dotdash, up to three tries.
    # `doctor` runs it too, and fails, so a notify target at its default level
    # hears when this machine cannot get out through dotdash.
    - {name: through-dotdash, type: command, command: ["hooks/healthy"], timeout: 2m}

retention:
  releases: 3
  backups: 3
