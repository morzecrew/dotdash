# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-secrets.json
# The values of one dotdash client, as dotdash's canary-config task prints
# them. Xray's distroless image runs as 65532.
api_version: selfhost/v1alpha1

secrets:
  - name: vless_id
    description: The client's VLESS id, a line of dotdash's vless_clients
    required: true
    owner: "65532:65532"
    services: [reality, xhttp]

  - name: vless_encryption
    description: The encryption= value of a dotdash link
    required: true
    owner: "65532:65532"
    services: [reality, xhttp]

  - name: reality_short_id
    description: The sid= value of a dotdash REALITY link
    required: true
    owner: "65532:65532"
    services: [reality]

  - name: xhttp_path
    description: The path= value of a dotdash XHTTP link, without the leading %2F
    required: true
    owner: "65532:65532"
    services: [xhttp]
